<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サッカー人生">
<title>サッカー人生シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a;
  --card:#111318;
  --card2:#171a21;
  --line:#252932;
  --text:#f2f3f5;
  --muted:#8a8f9a;
  --accent:#c6ff3d;
  --skill:#c6ff3d;
  --fame:#3dd6ff;
  --money:#ffd34d;
  --scandal:#ff3d6e;
  --radius:20px;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.app{
  width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 10px);
  gap:10px;overflow:hidden;position:relative;
  background:
    radial-gradient(120% 50% at 50% -10%,rgba(198,255,61,.10),transparent 60%),
    radial-gradient(80% 40% at 100% 110%,rgba(255,61,110,.10),transparent 60%),
    var(--bg);
}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.logo{font-family:var(--display);font-size:15px;line-height:1.1;letter-spacing:.02em}
.logo small{display:block;font-family:var(--body);font-size:9px;color:var(--muted);letter-spacing:.2em;font-weight:700}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.bgm{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1;display:grid;place-items:center;opacity:.55;transition:.2s}
.bgm.on{opacity:1;border-color:rgba(198,255,61,.5)}
.toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.toggle button{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;color:var(--muted);transition:.2s}
.toggle button.on{background:var(--accent);color:#0a0b0d}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;transition:opacity .3s}
.statrow{display:flex;gap:6px;flex:none;align-items:stretch}
.statrow .stats{flex:1;min-width:0}
#avatar{width:58px;height:58px;flex:none;align-self:center;image-rendering:pixelated;image-rendering:crisp-edges;background:radial-gradient(circle at 50% 60%,#1c2029,var(--card) 70%);border:1px solid var(--line);border-radius:12px}
.stats.dim{opacity:.25}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px 8px}
.stat .lbl{font-size:9.5px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.stat .val{font-family:var(--display);font-size:17px;line-height:1.2}
.bar{height:4px;background:#22252d;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stat.s .val{color:var(--skill)} .stat.s .bar i{background:var(--skill)}
.stat.f .val{color:var(--fame)} .stat.f .bar i{background:var(--fame)}
.stat.m .val{color:var(--money);font-size:14px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .stat.m .bar i{background:var(--money)}
.stat.x .val{color:var(--scandal)} .stat.x .bar i{background:var(--scandal)}
.stat.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.08)}}
/* clock（時間経過バー＋倍速） */
.clock{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 10px}
.clock-top{display:flex;align-items:center;gap:8px}
.clock-age{font-family:var(--display);font-size:15px;line-height:1;white-space:nowrap}
.clock-age small{font-family:var(--body);font-size:10px;color:var(--muted);margin-left:2px}
.clock-state{flex:1;font-size:10.5px;font-weight:900;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock.paused .clock-state{color:var(--money);animation:blink 1.2s ease-in-out infinite}
.clock.stopped .clock-state{color:var(--muted);animation:none}
@keyframes blink{50%{opacity:.4}}
.pause{flex:none;font-size:11.5px;font-weight:900;padding:8px 12px;min-height:34px;border-radius:999px;background:var(--money);color:#0a0b0d;white-space:nowrap}
.pause.resume{background:var(--accent)}
.pause:disabled{opacity:.35}
.clock.held .ybar i{background:linear-gradient(90deg,rgba(138,143,154,.4),var(--muted));box-shadow:none}
.clock.held .clock-state{color:var(--muted);animation:blink 1.2s ease-in-out infinite}
.speed{display:flex;background:#0c0e12;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.speed button{font-size:11px;font-weight:900;padding:5px 10px;border-radius:999px;color:var(--muted);font-family:var(--display)}
.speed button.on{background:var(--text);color:#0a0b0d}
.ybar{position:relative;height:8px;background:#1e2128;border-radius:8px;overflow:hidden;margin-top:8px}
.ybar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;
  background:linear-gradient(90deg,rgba(198,255,61,.5),var(--accent));box-shadow:0 0 10px rgba(198,255,61,.6)}
.clock.paused .ybar i{background:linear-gradient(90deg,rgba(255,211,77,.4),var(--money));box-shadow:0 0 10px rgba(255,211,77,.5)}
.ybar .ev-mark{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--money);opacity:.8}
/* player name */
.pname{font-family:var(--display);font-size:26px;line-height:1.2;
  background:linear-gradient(90deg,#fff 0%,var(--accent) 70%,var(--fame));-webkit-background-clip:text;background-clip:text;color:transparent}
.psub{font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--muted);margin:2px 0 14px;display:flex;align-items:center;gap:6px}
.pname-s{font-size:12px;font-weight:900;color:var(--muted);margin-bottom:12px}
.pname-s b{color:var(--text)}
/* life */
.life-sub{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:900;letter-spacing:.12em;color:#0a0b0d;background:var(--accent);padding:3px 8px;border-radius:6px}
.next-ev{font-size:11px;color:var(--muted);font-weight:700}
.next-ev b{color:var(--money)}
.log{display:flex;flex-direction:column;gap:6px}
.log-item{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.log-item.new{animation:fade .4s ease-out}
.log-item .la{font-family:var(--display);font-size:14px;color:var(--muted);line-height:1.35}
.log-item .lt{font-size:13px;line-height:1.6}
.log-item .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:10.5px;font-weight:900}
.log-item .mini .s{color:var(--skill)}.log-item .mini .f{color:var(--fame)}.log-item .mini .m{color:var(--money)}.log-item .mini .x{color:var(--scandal)}
.log-item.story{border-color:rgba(255,211,77,.35);background:linear-gradient(135deg,rgba(255,211,77,.08),var(--card) 65%)}
.log-item.story .la{color:var(--money)}
.log-item.story .lt{font-size:13.5px;line-height:1.75}
.story-tag{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--money);margin-bottom:3px}
.pill.pos{color:#0a0b0d}
.pos-head{text-align:center}
.pos-head .h2{font-size:26px;margin-top:2px}
.pos-head .sub{margin-top:6px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 12px;border-radius:18px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 16%,transparent),var(--card) 60%);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);transition:transform .12s}
.pos-card:active{transform:scale(.97)}
.pos-card .pe{font-size:30px;line-height:1.1}
.pos-card .pk{font-family:var(--display);font-size:26px;line-height:1.05;color:var(--pc)}
.pos-card .pf{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.pos-card .pd{font-size:12px;font-weight:700;line-height:1.5;margin-top:4px}
.pos-card.cur{opacity:.55}
.pos-card .pcur{font-size:10px;font-weight:900;color:var(--pc);letter-spacing:.06em}
.pos-card .pu{font-size:10.5px;font-weight:900;color:var(--pc);margin-top:4px}
.log-item.hap{border-color:rgba(61,214,255,.3)}
.hap-tag{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--fame);margin-bottom:2px}
.log-item.ev{border-color:rgba(198,255,61,.35);background:linear-gradient(135deg,rgba(198,255,61,.07),var(--card) 60%)}
.log-item.ev .la{color:var(--accent)}
.log-item .ll{font-size:13.5px;font-weight:900;line-height:1.45;margin-bottom:3px}
.log-item .tag{display:inline-block;font-size:9px;font-weight:900;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.log-item .tag.ok{color:var(--accent);border:1px solid var(--accent)}
.log-item .tag.ng{color:var(--scandal);border:1px solid var(--scandal)}
.log-item .chips{margin-top:8px}
.warn{font-size:12px;font-weight:900;color:var(--scandal);text-align:center}
/* main */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.main>*{flex-shrink:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:900;font-size:16px;background:var(--accent);color:#0a0b0d;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.foot{font-size:9.5px;color:#555a64;text-align:center;flex:none;line-height:1.4}
/* title */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-block:12px;cursor:pointer;
  background:radial-gradient(closest-side,rgba(198,255,61,.06),transparent 70%) center/120% 60% no-repeat}
.hero .brand{display:flex;align-items:center;justify-content:center;gap:10px;animation:plIn .9s ease-out both}
.hero h1{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2;margin:0;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.ball{font-size:30px;animation:spin 6s linear infinite;display:inline-block;filter:drop-shadow(0 0 18px rgba(198,255,61,.45))}
.hero .rule{width:0;height:1px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:grow 1.2s .3s ease-out forwards}
@keyframes grow{to{width:72%}}
.prologue{display:flex;flex-direction:column;gap:20px;margin:30px 0 34px}
.pl{margin:0;font-size:16px;line-height:1.85;font-weight:700;color:#c9ccd3;opacity:0;filter:blur(8px);transform:translateY(10px);
  animation:plIn 1.1s var(--d,0s) ease-out forwards}
.pl b{color:var(--text);font-weight:900}
.pl.last{font-size:17px;color:var(--text)}
.pl.last b{display:inline-block;margin-top:6px;font-family:var(--display);font-weight:400;font-size:26px;color:var(--money);text-shadow:0 0 22px rgba(255,211,77,.45)}
@keyframes plIn{to{opacity:1;filter:none;transform:none}}
.btn.fate{letter-spacing:.04em;animation:glow 2.4s 1s ease-in-out infinite}
.hero{min-height:calc(100dvh - 190px)}
.scroll-cue{margin-top:auto;padding-top:22px;font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;
  opacity:0;animation:plIn .8s 5.4s ease-out forwards}
.scroll-cue span{font-size:16px;color:var(--accent);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.hero.done .scroll-cue{animation:none;opacity:1}
.start-bar{position:sticky;bottom:0;z-index:5;margin-top:4px;padding:18px 0 4px;background:linear-gradient(transparent,var(--bg) 38%)}
.facts{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px}
.facts-head .h2{font-size:21px;margin:8px 0 4px}
.facts .sub{font-size:12px}
.xrank{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.xrank li{display:grid;grid-template-columns:22px 26px 1fr;align-items:center;gap:6px}
.rk{font-family:var(--display);font-size:15px;color:var(--muted);text-align:center}
.xrank li.top .rk{color:var(--money)}
.rf{font-size:20px;line-height:1}
.rn{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.rn b{font-weight:900}.rn span{font-weight:900;color:var(--muted)}
.xrank li.top .rn span{color:var(--text)}
.rbar{height:6px;background:#1e2128;border-radius:6px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,rgba(61,214,255,.45),var(--fame))}
.xrank li.top .rbar i{background:linear-gradient(90deg,rgba(255,211,77,.5),var(--money))}
.dom{margin-top:16px;padding:12px;background:#0d0f13;border-radius:14px}
.dom-h{font-size:11px;font-weight:900;color:var(--muted);margin-bottom:6px}
.dom-r{display:grid;grid-template-columns:1fr auto 54px;gap:8px;font-size:13px;padding:4px 0;font-weight:700}
.dom-r em{font-style:normal;color:var(--fame);text-align:right;font-weight:900}
.src{font-size:10px;color:#5d626c;line-height:1.6;margin:12px 0 0}
.odds-hero{margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(160deg,rgba(198,255,61,.08),#0d0f13 60%);text-align:center}
.oh-row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted)}
.oh-row b{color:var(--text);font-weight:900}
.oh-arrow{color:var(--muted);margin:4px 0}
.oh-big{margin-top:12px;font-size:13px;font-weight:900}
.oh-big em{font-style:normal;font-family:var(--display);font-size:44px;color:var(--accent);margin:0 2px;text-shadow:0 0 24px rgba(198,255,61,.4)}
.oh-big small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.odd{padding:12px;border-radius:14px;background:#0d0f13;border:1px solid color-mix(in srgb,var(--oc) 30%,transparent)}
.od-top{display:flex;flex-direction:column;gap:2px}
.od-k{font-size:11.5px;font-weight:900;line-height:1.4}
.od-1n{font-size:10px;font-weight:900;color:var(--oc)}
.od-v{font-family:var(--display);font-size:28px;line-height:1.1;margin-top:8px;color:var(--oc)}
.od-v small{font-size:14px;margin-left:1px}
.od-bar{height:5px;background:#1e2128;border-radius:5px;overflow:hidden;margin-top:6px}
.od-bar i{display:block;height:100%;min-width:2px;background:var(--oc);box-shadow:0 0 8px var(--oc)}
.od-note{font-size:9.5px;color:var(--muted);line-height:1.5;margin-top:6px}
@keyframes glow{50%{box-shadow:0 0 30px rgba(198,255,61,.55)}}
.skip-hint{font-size:10.5px;color:#4d525c;font-weight:700;margin-top:12px;transition:opacity .4s}
.hero.done{cursor:default}
.hero.done .brand,.hero.done .pl{animation:none;opacity:1;filter:none;transform:none}
.hero.done .rule{animation:none;width:72%}
.hero.done .skip-hint{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-family:inherit;outline:none}
.field input:focus{border-color:var(--accent)}
/* mode */
.h2{font-family:var(--display);font-size:22px;margin:4px 0 0;font-weight:400}
.sub{color:var(--muted);font-size:12.5px;margin:0}
/* event */
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700}
.age{font-family:var(--display);font-weight:400;font-size:26px;color:var(--text);line-height:1}
.age small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:4px}
.club{text-align:right;line-height:1.35;max-width:62%}
.club b{color:var(--text);display:block;font-size:12px}
.chapter{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.15em;margin-left:8px}
.ev-no{display:inline-block;font-size:10px;letter-spacing:.2em;font-weight:900;color:#0a0b0d;background:var(--accent);padding:3px 8px;border-radius:6px;margin:16px 0 10px}
.ev-text{font-size:17.5px;line-height:1.7;font-weight:700;margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:700;line-height:1.45;transition:.12s}
.choice:active{transform:scale(.98);border-color:var(--accent)}
.choice .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:400;background:#22252d;color:var(--accent)}
.choice .risk{display:inline-block;font-size:9.5px;font-weight:900;color:var(--scandal);border:1px solid var(--scandal);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px;white-space:nowrap}
/* result */
.picked{font-size:12px;color:var(--muted);font-weight:700}
.picked b{color:var(--text)}
.verdict{font-family:var(--display);font-weight:400;font-size:30px;margin:10px 0 6px;line-height:1}
.verdict.ok{color:var(--accent)} .verdict.ng{color:var(--scandal)} .verdict.neu{color:var(--text)}
.res-text{font-size:16px;line-height:1.75;margin:8px 0 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12px;font-weight:900;padding:5px 10px;border-radius:999px;background:#1e2128;border:1px solid var(--line)}
.chip.s{color:var(--skill)} .chip.f{color:var(--fame)} .chip.m{color:var(--money)} .chip.x{color:var(--scandal)}
.newclub{margin-top:12px;font-size:12.5px;font-weight:700;color:var(--fame)}
/* ending */
.end{display:flex;flex-direction:column;gap:10px}
.certificate{padding:18px;border-radius:var(--radius);position:relative;overflow:hidden;
  background:linear-gradient(160deg,#16191f 0%,#0d0f13 100%);border:1px solid transparent;
  background-clip:padding-box}
.certificate::before{content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1px;
  background:linear-gradient(135deg,var(--accent),var(--fame) 40%,var(--scandal));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-label{font-size:10px;letter-spacing:.25em;font-weight:900;color:var(--muted)}
.c-name{font-family:var(--display);font-size:22px;line-height:1.2;margin-top:6px;background:linear-gradient(90deg,#fff,var(--fame));-webkit-background-clip:text;background-clip:text;color:transparent}
.c-sub{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--muted);margin-top:2px}
.c-from{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.c-reason{font-size:11px;color:var(--scandal);font-weight:700;margin-top:2px}
.rank{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:30px;

.c-stats span{display:block;font-size:9px;color:var(--muted);font-weight:700}
.c-stats b{font-family:var(--display);font-weight:400;font-size:16px}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.trait{font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:999px;background:#1a1d24;border:1px solid var(--line);color:var(--text);line-height:1.5}
.g-result .tr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.start-bar .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:8px}
.btn.daily{background:linear-gradient(135deg,rgba(255,211,77,.18),rgba(255,211,77,.05));border:1px solid rgba(255,211,77,.55);color:var(--money)}
.trait.daily{border-color:rgba(255,211,77,.5);color:var(--money)}
.g-result .dl-note{font-size:11px;font-weight:700;color:var(--money);margin-top:8px;text-align:center}
.btn.sm{padding:12px 10px;font-size:13.5px;border-radius:14px;text-align:center;text-decoration:none}
.btn.sm small{display:block;font-size:10px;font-weight:700;opacity:.75;margin-top:2px}
.rarity{margin-top:12px;padding:12px;border-radius:14px;text-align:center;background:linear-gradient(135deg,rgba(255,211,77,.14),rgba(255,211,77,.03));border:1px solid rgba(255,211,77,.4)}
.rarity small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.rarity b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--money);line-height:1.35}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}

.res-grid .wide{grid-column:1/-1}
.res-grid span{display:block;font-size:9.5px;color:var(--muted);font-weight:700}
.res-grid b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.3}
.res-grid b small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:3px}
.res-grid b.tx{font-family:var(--body);font-weight:900;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.epitaph{margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.7;font-weight:700;text-align:center}

.epi p{margin:0;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.75}
.card-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}

.dl-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unlock{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid rgba(198,255,61,.45);background:linear-gradient(135deg,rgba(198,255,61,.12),var(--card) 70%);animation:fade .5s ease-out}
.unlock b{display:block;font-size:13px;color:var(--accent)}
.unlock span{display:block;font-size:11.5px;line-height:1.6;margin-top:2px}
.prog{height:6px;background:#1a1d24;border-radius:3px;overflow:hidden;margin:2px 0 10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dex-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dex-item{background:#1a1d24;border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.dex-item b{display:block;font-size:12px;line-height:1.45}
.dex-item span{display:block;font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}

.dex-flag{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:#1a1d24;font-size:22px;filter:grayscale(1);opacity:.3;min-width:0}
.dex-flag.on{filter:none;opacity:1;outline:1px solid var(--line)}
.dex-flag em{font-style:normal;font-size:8.5px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dex-flag small{position:absolute;top:2px;right:4px;font-size:9px;font-weight:900;color:var(--accent)}
.contract{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.contract.flash{animation:ctflash 1.4s ease-out}
@keyframes ctflash{0%{box-shadow:0 0 0 2px rgba(198,255,61,.75)}100%{box-shadow:0 0 0 0 rgba(198,255,61,0)}}
.ct-head{display:flex;justify-content:space-between;font-size:9.5px;font-weight:900;letter-spacing:.25em;color:var(--muted)}
.ct-daily{letter-spacing:.05em;color:var(--money)}
.ct-club{margin:6px 0 8px}
.ct-club b{display:block;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.ct-club span{font-size:11px;color:var(--muted);font-weight:700}
.ct-row{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.ct-row span{font-size:11px;color:var(--muted);font-weight:700;width:56px;flex:none}

.ct-row em{font-style:normal;font-size:11px;font-weight:900;white-space:nowrap}
.ct-row em.up{color:var(--accent)}
.ct-row em.down{color:var(--scandal)}
.ct-row em.flat{color:var(--muted)}

.side{display:none}

@media (min-width:1000px){
  .side{display:block;position:fixed;top:24px;left:calc(50% + 236px);width:250px;z-index:5}
  .contract-m{display:none}
}
.wc-note{margin:10px 0 0;padding:9px 11px;border-radius:12px;background:rgba(61,214,255,.08);border:1px solid rgba(61,214,255,.3);font-size:12px;line-height:1.6;font-weight:700}
.log-item .season{font-size:10.5px;font-weight:900;color:var(--fame);margin-top:5px;line-height:1.5}
.path{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.6}
.path b{color:var(--text);font-weight:700}
.hl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.hl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.hl-head b{font-family:var(--display);font-weight:400;font-size:16px}
.hl-head span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.15em}
.hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hl li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hl li:first-child{border-top:0}
.hl .a{font-family:var(--display);font-size:15px;color:var(--accent);line-height:1.3}
.hl .a small{font-family:var(--body);font-size:9px;color:var(--muted);margin-left:1px}
.hl .l{font-size:13px;font-weight:900;line-height:1.45}
.hl .r{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.hl .tag{display:inline-block;font-size:9px;font-weight:900;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.hl .tag.ok{color:var(--accent);border:1px solid var(--accent)}
.hl .tag.ng{color:var(--scandal);border:1px solid var(--scandal)}
.all{margin-top:6px}
.all summary{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;padding:8px 0;list-style:none;text-align:center}
.all summary::-webkit-details-marker{display:none}
.all[open] summary{color:var(--text)}
.share{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;background:#fff;color:#000;font-weight:900;font-size:15px;transition:transform .1s}
.share:active{transform:scale(.97)}
.share svg{width:18px;height:18px}
.row{display:flex;gap:8px}
.row .btn{flex:1;font-size:14px;padding:14px}
.shot{text-align:center;font-size:10.5px;color:var(--muted)}
/* country gacha */
.gacha{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:radial-gradient(70% 50% at 50% 48%,#161a22 0%,#07080a 72%);overflow:hidden;cursor:pointer;
  animation:gIn .35s ease-out;user-select:none;-webkit-user-select:none}
.gacha.out{animation:gOut .4s ease-in forwards}
@keyframes gIn{from{opacity:0}}
@keyframes gOut{to{opacity:0;transform:scale(1.05)}}
.g-head{text-align:center;position:relative}
.g-head .lbl{font-size:10px;font-weight:900;letter-spacing:.4em;color:var(--accent)}
.g-head .ttl{font-family:var(--display);font-size:20px;margin-top:6px}
.g-stage{position:relative;width:min(300px,100%);height:170px}
.g-rays{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,211,77,.08) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 20%,transparent);mask:radial-gradient(closest-side,#000 20%,transparent);
  opacity:0;transition:opacity .6s;animation:spin 16s linear infinite;pointer-events:none}
.g-ring{position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;border-radius:50%;pointer-events:none;
  background:conic-gradient(transparent 0 55%,var(--fame) 78%,var(--accent) 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:spin .6s linear infinite;filter:drop-shadow(0 0 8px var(--accent))}
.g-reel{position:absolute;inset:0;border-radius:26px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,#0b0d11,#171b22 50%,#0b0d11);border:1px solid var(--line);
  box-shadow:inset 0 0 40px rgba(0,0,0,.8);transition:box-shadow .4s,border-color .4s}
.g-reel::before,.g-reel::after{content:"";position:absolute;left:0;right:0;height:42px;z-index:1;pointer-events:none}
.g-reel::before{top:0;background:linear-gradient(#0b0d11,transparent)}
.g-reel::after{bottom:0;background:linear-gradient(transparent,#0b0d11)}
.g-mk{position:absolute;top:50%;transform:translateY(-50%);color:var(--accent);font-size:13px;z-index:2}
.g-mk.l{left:12px}.g-mk.r{right:12px}
.g-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.g-item .flag{font-size:68px;line-height:1}
.g-item .cn{font-family:var(--display);font-size:24px;letter-spacing:.02em}
.g-item .ct{font-size:14px;color:var(--text);font-weight:900}
.g-item .ct:empty{display:none}
.g-item.roll{animation:roll var(--d,.08s) cubic-bezier(.2,.8,.3,1)}
@keyframes roll{from{transform:translateY(-75%);opacity:.15;filter:blur(4px)}}
.g-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.g-p{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:3;
  animation:burst 1.2s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%)}to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--r)) scale(.3);opacity:0}}
.g-result{text-align:center;min-height:96px;position:relative}
.g-result>*{opacity:0;transform:translateY(10px)}
.g-result .k{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.3em}
.g-result .v{font-family:var(--display);font-size:30px;margin-top:6px;color:var(--money);text-shadow:0 0 22px rgba(255,211,77,.5)}
.g-result .d{font-size:12.5px;color:var(--muted);margin-top:8px}
.g-result .nm{font-family:var(--display);font-size:30px;line-height:1.2;margin-top:14px;
  background:linear-gradient(90deg,#fff 0%,var(--accent) 60%,var(--fame));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(198,255,61,.35))}
.g-result .ns{font-size:11px;font-weight:900;letter-spacing:.25em;color:var(--muted);margin-top:2px}
.g-result .vp{font-size:17px;margin-left:2px}
.g-foot{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.g-hint{font-size:11px;color:#5d626c;font-weight:700}
.g-bar{width:160px;height:3px;background:#22252d;border-radius:3px;overflow:hidden;opacity:0}
.g-bar i{display:block;height:100%;width:0;background:var(--money)}
.landed .g-rays{opacity:1}
.landed .g-ring{animation-duration:5s;background:conic-gradient(transparent 0 35%,var(--money) 100%);filter:drop-shadow(0 0 12px var(--money))}
.landed .g-reel{border-color:var(--money);box-shadow:0 0 0 1px var(--money),0 0 60px rgba(255,211,77,.45),inset 0 0 30px rgba(255,211,77,.15)}
.landed .g-item{animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards}
.landed .g-item .cn{color:var(--money)}
.landed .g-flash{animation:flash .7s ease-out}
.landed .g-result>*{animation:rise .5s ease-out forwards}
.landed .g-result .v{animation-delay:.3s}.landed .g-result .nm{animation:nameIn .8s cubic-bezier(.2,1.5,.4,1) .9s forwards}.landed .g-result .ns{animation-delay:1.3s}.landed .g-result .d{animation-delay:1.8s}
@keyframes nameIn{0%{opacity:0;transform:scale(1.6);filter:blur(6px)}100%{opacity:1;transform:none}}
.landed .g-bar{opacity:1}
.landed .g-bar i{animation:fill 5s linear forwards}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.3)}100%{transform:scale(1.15)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
.g-main{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;transition:opacity .6s,transform .6s}
.birth .g-main{opacity:0;transform:scale(.9);pointer-events:none}
.g-birth{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s;
  background:radial-gradient(50% 40% at 50% 50%,rgba(255,211,77,.07),transparent 70%)}
.birth .g-birth{opacity:1}
.b-line{opacity:0;transform:translateY(8px);filter:blur(4px)}
.b1{font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--money)}
.b2{font-family:var(--display);font-size:22px;line-height:1.5}
.b3{font-size:13px;color:var(--muted);line-height:1.8}
.b-age{font-family:var(--display);font-size:84px;line-height:1;opacity:0;transform:scale(1.6);color:var(--accent);text-shadow:0 0 30px rgba(198,255,61,.5)}
.b-age small{font-size:22px;margin-left:4px;color:var(--text)}
.birth .b-line{animation:blurIn .9s ease-out forwards}
.b-name{font-family:var(--display);font-size:30px;line-height:1.25;color:var(--text)}
.b-name small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.25em;color:var(--muted);font-weight:900;margin-bottom:4px}
.birth .b1{animation-delay:.4s}.birth .b2{animation-delay:1.6s}.birth .b-name{animation-delay:3s}
.birth .b-age{animation:ageIn .6s cubic-bezier(.2,1.4,.4,1) 4.5s forwards}
@keyframes blurIn{to{opacity:1;transform:none;filter:none}}
@keyframes ageIn{to{opacity:1;transform:scale(1)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--accent);color:#0a0b0d;font-weight:900;font-size:13px;padding:10px 18px;border-radius:999px;z-index:20;animation:up .3s ease-out;white-space:nowrap}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="logo">サッカー人生<br>シミュレーター<small>FOOTBALL LIFE SIM</small></div>
    <div class="top-r">
      <button class="bgm" id="bgmBtn" aria-label="BGMをオフにする">🎵</button>
      <div class="toggle" role="group" aria-label="名前表示の切り替え">
        <button data-nm="real">実名</button>
        <button data-nm="parody">パロディ名</button>
      </div>
    </div>
  </header>
  <div class="statrow">
    <canvas id="avatar" width="32" height="32" role="img" aria-label="選手のドット絵" hidden></canvas>
    <section class="stats" id="stats"></section>
  </div>
  <section class="clock" id="clock" hidden>
    <div class="clock-top">
      <div class="clock-age" id="clockAge">0<small>歳</small></div>
      <div class="clock-state" id="clockState">▶ 時間経過中</div>
      <button class="pause" id="pauseBtn" data-pause>⏸ 一時停止</button>
      <div class="speed" role="group" aria-label="時間の速さ">
        <button data-sp="1">1x</button><button data-sp="2">2x</button><button data-sp="5">5x</button>
      </div>
    </div>
    <div class="ybar"><i id="ybar"></i><span class="ev-mark" id="evMark" hidden></span></div>
  </section>
  <main class="main" id="main"></main>
  <div class="foot">※ 本作はフィクションです。実名モードで表示される団体・大会名は実在しますが、作中の出来事・人物とは一切関係ありません。</div>
</div>
<aside class="side" id="side" hidden aria-label="契約情報"></aside>

<script>

// 国の命名規則に沿って「表示名」と「ローマ字表記」を作る
function genName(country){
  const P = NAME_POOLS[country] || NAME_POOLS['イングランド'];
  const [f, fl] = pick(P.first), [l, ll] = pick(P.last);
  if(country==='日本') return {main:`${l} ${f}`, sub:`${fl} ${ll.toUpperCase()}`};
  if(P.east) return {main:`${l}・${f}`, sub:`${ll.toUpperCase()} ${fl}`};
  if(country==='ブラジル'){
    const r = Math.random();
    if(r<.25){ const [n, nl] = pick(P.nick); return {main:n, sub:`${nl.toUpperCase()}（${fl} ${ll}）`}; } // 愛称のみ
    if(r<.4) return {main:`${f}・ジュニオール`, sub:`${fl.toUpperCase()} JR.`};
  }
  return {main:`${f}・${l}`, sub:`${fl} ${ll.toUpperCase()}`};
}

const parodize = s => { const a = [...s]; if(a.length<3) return s+'（仮）'; a.splice(a.length-1, 0, '〜'); return a.join(''); };
function wpick(pairs){
  let r = Math.random() * pairs.reduce((a,[,w])=>a+w,0);
  for(const [v,w] of pairs){ if((r-=w)<0) return v; }
  return pairs[pairs.length-1][0];
}
// country のリーグからクラブを1つ選ぶ（topOnly=1部だけ、exclude=除外するクラブ名）
function pickClub(country, opt={}){
  const lg = LEAGUES[country], top = lg.c.filter(c=>!(opt.exclude||[]).includes(c));
  const t2 = opt.topOnly ? 0 : lg.t2;
  if(!opt.tier2 && Math.random()*(top.length+t2) < top.length) return {name:pick(top), country, tier:1};
  return LEAGUE2[country] ? {name:pick(LEAGUE2[country]), country, tier:2} : {name:lg.l2, country, tier:2, generic:true};
}
function clubName(c){
  const base = c.generic ? `${c.name}のクラブ` : S.nameMode==='real' ? c.name : PARODY_CLUB[c.name] ? NAMES[PARODY_CLUB[c.name]][1] : parodize(c.name);
  return c.country===S.country.n ? base : `${base}（${c.country}）`;
}
function clubKey(c){ S.dyn.push(c); return 'dyn:'+(S.dyn.length-1); }
// 生まれた時点で、アカデミーのクラブ・ユースのライバル・最初のプロクラブを決めておく
function rollCareerClubs(){
  const home = S.country.n, R = CAREER_ROUTES[home], lg = LEAGUES[home];
  S.dyn = [];
  S.homeClub = pickClub(home, {topOnly:true});                           // 育成組織は1部クラブのもの
  S.rivalClub = pickClub(home, {topOnly:true, exclude:[S.homeClub.name]});
  S.firstAbroad = Math.random() < R.ab;
  if(S.firstAbroad) S.firstClub = pickClub(wpick(Object.entries(R.to)));
  else if(S.mode==='world' && Math.random()*(lg.c.length+lg.t2) < lg.c.length) S.firstClub = S.homeClub; // 1部ならアカデミーから昇格
  else S.firstClub = S.mode==='world' ? pickClub(home, {exclude:[S.homeClub.name]}) : pickClub(home);
}

function proEvent(){
  const fc = S.firstClub, k = clubKey(fc), nm = clubName(fc);
  const grad = S.mode==='japan' ? '高校卒業' : `${N('academy')}卒業`;
  if(S.firstAbroad) return {id:'pro', text:`${grad}。届いたのは、海の向こうからのオファーだった。${fc.country}の${nm.replace(/（.*）$/,'')}が、君と契約したいという。`,
    choices:[
     {label:`${nm}と契約して${fc.country}へ渡る`, fx:{s:6,m:8,f:6}, club:k, text:'空港には家族と、なぜか近所の商店街の人たちまで見送りに来た。'},
     {label:'代理人に年俸交渉を任せる', chance:.5,
      win:{fx:{s:4,m:15,f:4}, club:k, text:'年俸が1.5倍になった。代理人の手数料も1.5倍になった。'},
      lose:{fx:{s:4,m:3,x:3}, club:k, text:'強気すぎて提示額が下がった。それでも海を渡った。'}},
    ]};
  if(S.mode==='japan'){
    const c2 = pickClub(S.country.n, {exclude:fc.tier===1?[fc.name]:[]}), k2 = clubKey(c2);
    return {id:'pro', text:()=>`${grad}。${N('jleague')}のクラブからオファーが届いた！ 進路を決めよう。`,
      choices:[
       {label:`${nm}に入団`, fx:{s:5,m:10,f:6}, club:k, text:'入団会見で緊張しすぎて、スーツの値札が付いたままだった。'},
       {label:`${clubName(c2)}${c2.tier===2&&fc.tier===2?'（別のクラブ）':''}に入団`, fx:{s:6,m:8,f:5}, club:k2, text:'初日の練習でパス回しについていけず、3時間鳥かごの中にいた。'},
      ]};
  }
  if(fc===S.homeClub){
    const lg = LEAGUES[S.country.n], loan = lg.t2 ? pickClub(S.country.n, {tier2:true}) : pickClub(S.country.n, {topOnly:true, exclude:[fc.name]});
    return {id:'pro', text:`${grad}。${nm}のトップ昇格か、武者修行のローン移籍か。`,
      choices:[
       {label:'トップ昇格（ベンチ外濃厚）', fx:{m:12,f:8}, club:k, text:'背番号は42。ベンチではなく観客席から試合を見る日々が始まった。'},
       {label:`${clubName(loan)}へローン移籍`, fx:{s:10,m:3}, club:clubKey(loan), text:`${nm}と契約し、すぐに貸し出された。練習場の隣は牧場。ボールが牛のエリアに入ると取りに行くのは新人の仕事だ。`},
      ]};
  }
  return {id:'pro', text:`${grad}。トップ昇格の声はかからなかった。手を差し伸べてくれたのは、${nm}だった。`,
    choices:[
     {label:'すぐに契約する', fx:{s:6,m:5,f:3}, club:k, text:'「見返してやる」。入団会見で、アカデミーの方角をにらんだ。'},
     {label:'条件を聞いてから決める', chance:.5,
      win:{fx:{s:5,m:10}, club:k, text:'「君が必要だ」と監督が自宅まで来た。即サインした。'},
      lose:{fx:{s:5,x:2}, club:k, text:'迷っている間に背番号が埋まった。残っていたのは77番だった。'}},
    ]};
}

function N(key){
  const city = S.city || '某市';
  if(key==='home') return `${city}の実家`;
  if(key.startsWith('dyn:')) return clubName(S.dyn[+key.slice(4)]);
  if(S.offer && S.offer[key]) return clubName(S.offer[key]);
  if(key==='academy' && S.homeClub) return `${clubName(S.homeClub)}のアカデミー`;
  if(key==='rivalClub' && S.rivalClub) return clubName(S.rivalClub);
  if(key==='kidsacademy') return S.nameMode==='real' ? `プロクラブ育成スクール ${city}校` : `${city}ボールの虎の穴`;
  if(key==='junior') return S.nameMode==='real' ? `${city}ジュニアFC` : `${city}ちびっこ蹴球団`;
  if(key==='chugaku') return S.nameMode==='real' ? `${city}立第二中学校` : `${city}第二中（部員4名）`;
  if(key==='school') return S.nameMode==='real' ? `${S.pref||'某県'}立蹴球高校` : `${city}第一ボール拾い学園`;
  if(key==='daihyo' && S.country && S.country.n!=='日本'){
    return S.nameMode==='real' ? `サッカー${S.country.n}代表` : `${S.country.n}蹴球団`;
  }
  const v = NAMES[key]; if(!v) return key;
  return S.nameMode==='real' ? v[0] : v[1];
}

function fmtYen(n, signed){
  const a = Math.abs(n);
  const body = a<1e4 ? `${Math.round(a).toLocaleString('ja-JP')}円`
    : a<1e8 ? `${Math.round(a/1e4).toLocaleString('ja-JP')}万円`
    : a<1e12 ? `${(a/1e8).toFixed(a<1e9?1:0).replace(/\.0$/,'')}億円`
    : `${(a/1e12).toFixed(1)}兆円`;
  return (signed ? (n>0?'+':n<0?'−':'±') : (n<0?'−':'')) + body;
}

  S.history.push({age:S.age, label:`${old}から${k}（${P.full}）にコンバート`, text:P.d, fx, impact:3, success:null});
  if(fromPick){ S.result = {fx}; S.screen = 'life'; render(true); }
}

  for(const i in P.fx) S.stats[i] = clamp(S.stats[i] + P.fx[i]);
  S.log.push({age:S.age, kind:'event', label:`${P.e} ${k}（${P.full}）を選んだ`, text:`${P.d} ${P.up.join('・')}が伸びやすくなった。`, fx:P.fx, success:null});
  S.history.push({age:S.age, label:`${k}（${P.full}）を選んだ`, text:P.d, fx:P.fx, impact:0, success:null});
  S.result = {fx:P.fx};
  S.screen = 'life';
  render(true);
}

  if(a===12) return 15;
  if(a<18) return a+1;
  const n = Math.min(END_AGE, a + (Math.random()<.5 ? 1 : 2));
  if(S.flags && S.flags.capped && n===a+2 && (isWcYear(wcYearOf(a+1)) || isWcYear(wcYearOf(a+2)))) return a+1;
  return n;
}

// 時間経過ループ（requestAnimationFrame）
let raf = null, lastTs = 0;
function clockStart(){
  if(raf || S.screen!=='life' || S.pendingEnd || S.userPaused) return;
  lastTs = performance.now();
  raf = requestAnimationFrame(clockLoop);
}
function clockLoop(ts){
  raf = null;
  if(S.screen!=='life' || S.pendingEnd || S.userPaused){ updateClock(); return; }
  const dt = Math.min(100, ts - lastTs); lastTs = ts;
  S.progress += dt / (YEAR_MS / S.speed);
  if(S.age===S.joinAge && !S.pos && S.progress>=.3){
    S.progress = .3;
    if(!S.joined){ S.current = JOIN_EVENT; S.screen = 'event'; } // まずチーム／スクールに入る
    else S.screen = 'position';                                    // 入団後にポジション決定
    render();
    return;
  }
  // 分岐イベントの年は、バーが半分まで来たところで一時停止して選択させる
  if(S.age===S.evAge && S.firedAge!==S.age && S.progress>=.5){
    S.progress = .5; S.firedAge = S.age;
    S.current = nextEvent();
    prepareOffers(S.current);
    S.screen = 'event';
    render();
    return;
  }
  if(S.progress>=1){ S.progress = 0; yearEnd(); }
  updateClock();
  if(!raf && S.screen==='life' && !S.pendingEnd && !S.userPaused) raf = requestAnimationFrame(clockLoop);
}

// バーが100%になったら1歳加齢
function togglePause(){
  if(S.pendingEnd) return;
  S.userPaused = !S.userPaused;
  if(S.userPaused){ cancelAnimationFrame(raf); raf = null; }
  updateClock();
  clockStart();
}

function yearEnd(){
  const y0 = S.yen;
  S.natNow = false;
  const season = playSeason();
  worldCupYear();
  if(S.age>=END_AGE){
    S.pendingEnd = 'retired';
    S.log.push({age:S.age, kind:'year', text:`${END_AGE}歳のシーズン終了。静かにスパイクを脱いだ。`, fx:{}, season, dm:S.yen - y0});
    render(); return;
  }
  S.age++;
  ageClub();
  const ch = chapterOf(S.age);
  const fx = {...YEAR_FX[ch]};
  const logAt = S.log.length;
  if(S.stats.x>0) fx.x = -2; // スキャンダルは時間とともに風化
  applyFx(fx);
  const hap = S.age>=6 && S.age!==S.evAge && Math.random()<HAP_RATE ? pickHappening() : null;
  if(S.age<=3 && storyBeat(S.age, fx)){
    // 0〜3歳はきっかけ物語
  } else if(hap){
    applyFx(hap.fx);
    S.usedHap.add(hap);
    if(hap.cat==='怪我') S.hurtAge = S.age;
    if(hap.flag) S.flags[hap.flag] = true;
    const hfx = {...fx}; for(const k in hap.fx) hfx[k] = (hfx[k]||0) + hap.fx[k];
    S.log.push({age:S.age, kind:'hap', cat:hap.cat, text:hap.text, fx:hfx});
    S.history.push({age:S.age, label:`⚡${hap.cat}`, text:hap.text, fx:hap.fx, impact:Object.values(hap.fx).reduce((a,v)=>a+Math.abs(v),0), success:null});
  } else {
    S.log.push({age:S.age, kind:'year', text:pick(ch==='乳幼児期' ? BABY_FLAVOR(S.age) : YEAR_FLAVOR[ch]), fx});
  }
  if(S.log[logAt]) S.log[logAt].dm = S.yen - y0; // その年の資産の増減（円）
  if(S.log[logAt] && season) S.log[logAt].season = season;
  if(S.age===S.body.stopAge) revealHeight();
  if(S.stats.x>=100){ S.pendingEnd = 'banned'; S.log.push({age:S.age, kind:'year', text:'スキャンダルが限界を超え、サッカー界から永久追放された。', fx:{}}); }
  else if(S.age>=20 && S.stats.s<=0){ S.pendingEnd = 'released'; S.log.push({age:S.age, kind:'year', text:'スキルが尽き、クラブから戦力外通告を受けた。', fx:{}}); }
  render();
}

// きっかけ物語の1場面をログに流す
function storyBeat(age, baseFx){
  const b = S.origin.beats.find(b=>b.age===age);
  if(!b) return false;
  applyFx(b.fx);
  const fx = {...(baseFx||{})}; for(const k in b.fx) fx[k] = (fx[k]||0) + b.fx[k];
  S.log.push({age, kind:'story', text:b.text, fx});
  return true;
}

function endCareer(reason){
  S.endReason = reason;
  S.pendingEnd = null;
  finalizeCareer();
  S.screen = 'ending';
  render();
}

function nextEvent(){
  if(S.age===18) return proEvent();
  if(S.age>18){ const w = wcEvent(); if(w) return w; }
  if(S.age===12){ const f = EVENTS.find(e=>e.id===(S.mode==='japan' ? 'c12_jp' : 'c12_scout')); if(f && !S.used.has(f.id)) return f; }
  const ok = e => !S.used.has(e.id) && (!e.req || e.req()) && (!e.club || S.pos) && (e.mode==='all'||e.mode===S.mode) && (!e.pos || e.pos.includes(S.pos)) && (!e.cg || e.cg.includes(cultureGroup())) && S.age>=e.min && S.age<=e.max;
  const pool = EVENTS.filter(ok);
  const mine = pool.filter(e=>e.pos && e.pos.length===1); // ポジション専用イベントは出やすく
  if(mine.length && Math.random()<.35) return pick(mine);
  const local = pool.filter(e=>e.cg); // 生まれた文化圏ならではのイベントも出やすく
  if(local.length && Math.random()<.35) return pick(local);
  const late = pool.filter(e=>e.late);
  if(late.length && Math.random()<.55) return pick(late);
  if(pool.length) return pick(pool);
  return S.age<15 ? GENERIC_CHILD : GENERIC;
}

function choose(i){
  const ev = S.current, c = ev.choices[i];
  let out = c, success = null;
  if(c.chance!=null){ success = Math.random() < c.chance; out = success ? c.win : c.lose; }
  const fx = out.fx || {};
  const y0 = S.yen;
  applyFx(fx);
  if(out.boot || c.boot) S.boot = {brand:S.bootBrand, tier:1, fee:0, until:S.age + 3};
  const wq = out.wcq ?? c.wcq;
  if(wq!=null) wcCycle(wcYearOf(S.age) + 1).bonus += wq;
  const tr = out.trophy || c.trophy;
  if(tr) addTrophy(tr, false);
  const fl = out.flag || c.flag;
  if(fl){ S.flags[fl] = true; if(fl==='wc') S.flags.capped = true; }
  let club = out.club || c.club;
  if(S.offer && S.offer[club]){
    const o = S.offer[club], cur = clubInfo(S.club);
    club = cur && cur.obj.name===o.name ? S.club : clubKey(o); // すでに同じクラブなら移籍しない
  }
  const moved = club && club!==S.club;
  if(moved){ setClub(club); onTransfer(); }
  S.evAge = nextEventAge(S.age);
  const impact = Object.values(fx).reduce((a,v)=>a+Math.abs(v),0);
  S.history.push({age:S.age, label:c.label, text:out.text, fx, impact, success});
  if(!ev.generic) S.used.add(ev.id);
  S.eventNo++;
  S.log.push({age:S.age, kind:'event', label:c.label, text:out.text, fx, dm: S.yen - y0, success, newClub: moved ? club : null});
  S.result = {fx};
  const end = c.end || out.end;
  if(end) S.pendingEnd = end;
  else if(S.stats.x>=100) S.pendingEnd = 'banned';
  else if(S.age>=20 && S.stats.s<=0) S.pendingEnd = 'released';
  if(ev.id==='join'){ S.joined = true; S.screen = 'position'; render(true); return; } // 入団したらそのままポジション選択へ
  const np = out.pos || c.pos;
  if(np==='pick' && !S.pendingEnd){ S.posChange = true; S.screen = 'position'; render(true); return; } // 新ポジションを選ばせる
  if(np && np!=='pick' && np!==S.pos) changePos(np, false);
  S.screen = 'life'; // 選択したら時間が再開
  render(true);
}

/* =========================================================
   デイリーシード：日付から乱数を作り、その日の「生まれ」を全員同じにする
   ========================================================= */
// 日本時間の日付（YYYY-MM-DD）。世界中どこで遊んでも、日本時間で日付が切り替わる
const todayKey = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
function seedOf(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909);
  return (h ^= h>>>16) >>> 0;
}
function mulberry32(a){
  return ()=>{ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };
}
// fn の中の Math.random だけをシード付き乱数に差し替える
function withSeed(seed, fn){
  const orig = Math.random;
  Math.random = mulberry32(seed);
  try{ return fn(); } finally{ Math.random = orig; }
}

// 標準正規分布の上側確率（同世代で上位何%か）
function upperPct(z){
  const t = 1/(1+.3275911*Math.abs(z)/Math.SQRT2);
  const erf = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - .284496736)*t + .254829592)*t*Math.exp(-z*z/2);
  return (z>=0 ? (1-erf)/2 : (1+erf)/2) * 100;
}

function rollTraits(c){
  const n = Math.sqrt(-2*Math.log(1-Math.random())) * Math.cos(2*Math.PI*Math.random());
  const mean = HEIGHT_MEAN[c.n], h = Math.round(mean + Math.max(-3.5, Math.min(3.5, n)) * HEIGHT_SD);
  const z = (h - mean) / HEIGHT_SD;
  // 身長は生まれた時点で決まっているが、伸びが止まる17〜18歳まで本人も知らない
  const body = {h, mean, z, stopAge:17 + (Math.random()<.5 ? 1 : 0), shown:false, label:BUILDS.find(b=>z<b.below).label, fx:BUILDS.find(b=>z<b.below).fx};

  const hard = ['R:africa','R:latin'].includes(c.local) || ['ブラジル','アルゼンチン','ナイジェリア','メキシコ'].includes(c.n);
  const family = wpick([[FAMILIES[0], 15], [FAMILIES[1], hard?30:55], [FAMILIES[2], hard?55:30]]);
  return {body, talent, family, look:rollLook(c)};
}

// 1年が終わるたびに、プロクラブにいればシーズン成績を計算する
function playSeason(){
  if(S.age<18) return null;
  const ci = clubInfo(S.club);
  if(!ci) return null;
  const need = 35 + ci.p*.5; // レギュラーに必要なスキルの目安（レアル・マドリード95、プレミア中堅85、J1 65、2部50前後）
  let share = .45 + (S.stats.s - need)/25 + (Math.random()-.5)*.4;
  if(S.age<=19) share -= .25;                  // 10代はまだ控えが多い
  if(S.talent.k==='physical') share += .05;
  const hurt = Math.random()<.1;
  if(hurt){ share *= .3; S.hurtAge = S.age + 1; }  // 長期離脱のシーズン（翌年まで包帯）
  const apps = Math.round(Math.max(0, Math.min(.92, share)) * 36);
  const rate = {FW:.45, MF:.14, DF:.04, GK:0}[S.pos] ?? .1;
  const tb = ['speed','leftfoot'].includes(S.talent.k) ? 1.15 : 1;
  const goals = Math.round(apps * rate * tb * Math.pow(S.stats.s/100, 2) * (.6 + Math.random()*.8));
  S.career.apps += apps; S.career.goals += goals;
  S.career.seasons.push({age:S.age, club:S.club, apps, goals, p:ci.p});
  updateBoots(ci, apps);
  const money = payday(ci, apps);
  const won = [], out = {age:S.age, apps, goals, won, pay:money.pay};
  if(apps>=10){
    const pl = ci.p>=110 ? .4 : ci.p>=95 ? .2 : ci.p>=80 ? .1 : .05;
    if(Math.random()<pl) won.push(ci.tier===2 ? `${ci.l2}優勝` : `${ci.country}1部リーグ優勝`);
    if(ci.euro && ci.p>=100 && Math.random()<(ci.p>=115 ? .15 : .05)) won.push('@ucl');
    if(S.pos==='FW' && ci.tier===1 && goals>=22 && Math.random()<.5) won.push(`${ci.country}1部 得点王`);
  }
  // 代表入り：層の厚い国ほど高いスキルと、強いクラブでの出場が必要
  const pw = WC_POWER[S.country.n] || .005;
  const far = MIDEAST.has(ci.country) ? .4 : 1; // 中東のリーグにいると代表の目に留まりにくい
  if(!S.flags.capped && S.age>=20 && apps>=15 && S.stats.s >= 75 + pw*100 && ci.p >= (pw>=.03 ? 85 : 55) && Math.random()<.25*far){ S.flags.capped = true; out.cap = true; }
  // 今季、代表の主力として呼ばれているか（W杯予選・本大会のメンバーに関わる）
  S.natNow = !!S.flags.capped && apps>=8 && S.stats.s >= 72 + pw*80 && Math.random() < (far<1 ? .5 : .9);
  if(S.natNow){ const n = 2 + Math.floor(Math.random()*3); S.caps += n; out.caps = n; }
  if(hurt) out.hurt = true;
  // キャプテン：同じクラブで主力として長くプレーし、チームでも抜けた存在になると任される（移籍すると外れる）
  if(S.captain && S.captain!==S.club) S.captain = null;
  if(!S.captain && S.age>=25 && apps>=30 && S.stats.s >= need + 10 && S.stats.x<50 && S.career.seasons.filter(z=>z.club===S.club).length>=3 && Math.random()<.07){
    S.captain = S.club; out.captain = true;
    S.history.push({age:S.age, label:`© ${N(S.club)}のキャプテンに就任`, text:'腕章を巻いて、チームの先頭に立つことになった。', fx:{}, impact:7, success:null});
  }
  won.forEach(k=>addTrophy(k, true));
  const mvNow = marketValueFor(ci, apps, goals, won);
  const mv = S.marketValue>0 ? S.marketValue*.35 + mvNow*.65 : mvNow;
  setMoney(money.pay, mv);
  out.mv = mv;
  return out;
}

  const z = e.season;

  return `<div class="season">📊 ${z.age}歳シーズン ${z.apps}試合 ${z.goals}得点${z.pay ? ` ・💴年俸${fmtYen(z.pay)}` : ''}${z.mv ? ` ・📈市場価値${fmtYen(z.mv)}` : ''}${z.cap?' ・🎽代表初選出':''}${z.caps?` ・🎽代表${z.caps}試合`:''}${z.captain?' ・©キャプテン就任':''}${z.hurt?' ・🩹長期離脱':''}${z.won.map(k=>` ・🏆${esc(trophyLabel(k))}`).join('')}</div>`;
}

const fmtPct = v => v>=10 ? v.toFixed(0) : v>=1 ? v.toFixed(1) : v>=.01 ? v.toFixed(2) : v.toFixed(4);
// 何が「どれくらい珍しいか」は、プロ選手数（FIFA）と大会の登録枠から見積もる
function lifeRarity(score){
  const c = S.career, n = PRO_TOTAL;
  if(c.apps===0){
    const v = (S.clubs.includes('academy') || S.clubs.includes('jy') ? 2 : 30) * Math.max(.5, Math.min(1.5, 1.4 - score/200));
    return {v, scope:'世界のサッカー少年の中で', text:`上位${fmtPct(v)}%の人生`};
  }
  const best = Math.min(
    hasTrophy('@ballon') ? 1/n*100 : 100,
    hasTrophy('@wc') ? 26/n*100 : 100,         // W杯優勝メンバー 26人
    hasTrophy('@ucl') ? .2 : 100,
    S.flags.wc ? 1248/n*100 : 100,             // W杯出場 48か国×26人
    ENDINGS.find(e=>e.k==='big5').c() ? 2600/n*100 : 100, // 五大リーグ 96クラブ×約27人
    S.flags.capped ? 3 : 100,
    S.trophies.some(t=>t.k.endsWith('1部リーグ優勝')) ? 6 : 100,
    S.career.seasons.some(z=>z.apps>0 && z.p>=60) ? 35 : 70,
  );
  const v = best * Math.max(.4, Math.min(1.6, 1.6 - score/250));
  return {v, scope:`プロ選手${fmt(n)}人の中で`, text:`上位${fmtPct(v)}%の人生`};
}
function bestClubKey(){
  const pool = S.career.seasons.filter(z=>z.apps>0);
  if(!pool.length) return null;
  return pool.reduce((a,b)=>b.p>a.p ? b : a).club;
}
function titleSummary(){
  const w = k => k==='@ballon'?100 : k==='@wc'?90 : k==='@ucl'?80 : k.endsWith('1部リーグ優勝')?50 : k.includes('得点王')?40 : k.includes('選手権')?30 : 20;
  const cnt = {};
  S.trophies.forEach(t=>cnt[t.k]=(cnt[t.k]||0)+1);
  const ks = Object.keys(cnt).sort((a,b)=>w(b)-w(a));
  return ks.length ? ks.slice(0,3).map(k=>`${trophyLabel(k)}${cnt[k]>1?`×${cnt[k]}`:''}`).join('・') : 'なし';
}

/* =========================================================
   図鑑：localStorage に保存（使えない環境でもゲームは止めない）
   ========================================================= */
const DEX_KEY = 'fls_dex_v1';
const emptyDex = () => ({plays:0, titles:{}, endings:{}, countries:{}, daily:{}});
function loadDex(){
  const d0 = emptyDex();
  try{
    const raw = localStorage.getItem(DEX_KEY);
    if(!raw) return d0;
    const d = JSON.parse(raw);
    if(!d || typeof d!=='object') return d0;
    for(const k of ['titles','endings','countries','daily']) if(d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) d0[k] = d[k];
    if(Number.isFinite(d.plays)) d0.plays = d.plays;
    return d0;
  }catch(err){ return d0; }
}
function saveDex(d){
  try{ localStorage.setItem(DEX_KEY, JSON.stringify(d)); return true; }catch(err){ return false; }
}
function storageOK(){
  try{ const k = '__fls_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }catch(err){ return false; }
}
// 今回の結果を図鑑に登録し、新しく埋まった項目を返す
function recordDex(){
  const d = loadDex(), F = S.final, n = S.country.n, fresh = [];
  d.plays++;
  if(!d.titles[F.title.t]) fresh.push(`称号「${F.title.t}」`);
  d.titles[F.title.t] = (d.titles[F.title.t]||0) + 1;
  F.endings.forEach(k=>{
    if(!d.endings[k]) fresh.push(ENDINGS.find(e=>e.k===k).t);
    d.endings[k] = (d.endings[k]||0) + 1;
  });
  const c = d.countries[n] && typeof d.countries[n]==='object' ? d.countries[n] : {plays:0, best:null};
  if(!c.plays) fresh.push(`${S.country.f} ${n}`);
  c.plays = (c.plays||0) + 1;
  if(!c.best || RANKS.indexOf(F.rank.r) < RANKS.indexOf(c.best)) c.best = F.rank.r;
  d.countries[n] = c;
  if(S.daily){
    const p = d.daily[S.daily];
    if(!p || RANKS.indexOf(F.rank.r) < RANKS.indexOf(p.rank)) d.daily[S.daily] = {rank:F.rank.r, title:F.title.t, rarity:F.rarity.text, flag:S.country.f, name:S.player};
  }
  return saveDex(d) ? fresh : [];
}

/* =========================================================
   リザルトカード（Canvas 1200×630）
   ========================================================= */
function fitFont(x, text, maxW, size, weight, family){
  let s = size;
  do{ x.font = `${weight} ${s}px ${family}`; } while(x.measureText(text).width > maxW && (s -= 2) > 12);
  return s;
}
function wrapLines(x, text, maxW, maxLines){
  const out = []; let line = '';
  for(const ch of [...text]){
    if(x.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; if(out.length===maxLines) break; }
    else line += ch;
  }
  if(out.length<maxLines && line) out.push(line);
  if(out.length===maxLines && out.join('').length < [...text].length) out[maxLines-1] = out[maxLines-1].slice(0,-1) + '…';
  return out;
}
let cardJob = 0;
async function drawCard(){
  const job = ++cardJob, F = S.final;
  if(!F) return;
  try{
    await Promise.race([
      Promise.all(['400 64px "Dela Gothic One"','900 24px "Noto Sans JP"','700 22px "Noto Sans JP"'].map(f=>document.fonts.load(f))),
      new Promise(r=>setTimeout(r, 1500)),
    ]);
  }catch(err){}
  if(job!==cardJob) return;
  const W = 1200, H = 630, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const DISP = '"Dela Gothic One","Hiragino Sans",sans-serif', BODY = '"Noto Sans JP","Hiragino Sans",sans-serif';
  const acc = '#c6ff3d', muted = '#8a8f9a', gold = '#ffd34d';
  // 背景
  x.fillStyle = '#07080a'; x.fillRect(0,0,W,H);
  let g = x.createRadialGradient(140,-60,0,140,-60,760);
  g.addColorStop(0,'rgba(198,255,61,.20)'); g.addColorStop(1,'rgba(198,255,61,0)');
  x.fillStyle = g; x.fillRect(0,0,W,H);
  g = x.createRadialGradient(1120,680,0,1120,680,620);
  g.addColorStop(0, F.rank.c+'38'); g.addColorStop(1, F.rank.c+'00');
  x.fillStyle = g; x.fillRect(0,0,W,H);
  // センターサークルのライン（アバターの背景）
  x.strokeStyle = 'rgba(255,255,255,.06)'; x.lineWidth = 3;
  x.beginPath(); x.arc(992,250,122,0,Math.PI*2); x.stroke();
  g = x.createRadialGradient(992,270,0,992,270,130); g.addColorStop(0,'rgba(255,255,255,.07)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(860,120,264,264);
  // 枠
  x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 2;
  x.beginPath(); x.roundRect ? x.roundRect(20,20,W-40,H-40,28) : x.rect(20,20,W-40,H-40); x.stroke();
  x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  // 見出し
  x.fillStyle = muted; x.font = `900 18px ${BODY}`;
  x.fillText(`CAREER OVER ・ ${S.age}歳${S.daily ? `　📅 今日の人生 ${S.daily}` : ''}`, 64, 80);
  // 名前
  fitFont(x, S.player, 760, 62, 400, DISP);
  g = x.createLinearGradient(64,0,760,0); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#3dd6ff');
  x.fillStyle = g; x.fillText(S.player, 64, 158);
  // 出身・ポジション・体格
  const pos = S.posPath.length ? S.posPath.join('→') : '—';
  const sub = `${S.country.f} ${S.country.n}・${S.place}出身 ／ ${pos}${S.body.shown ? ` ／ ${S.body.h}cm` : ''} ／ ${S.talent.t}`;
  fitFont(x, sub, 800, 22, 700, BODY); x.fillStyle = '#c9ccd3'; x.fillText(sub, 64, 200);
  // 称号
  const tl = `「${F.title.t}」`;
  fitFont(x, tl, 820, 42, 400, DISP); x.fillStyle = acc; x.fillText(tl, 56, 262);
  // レア度
  x.fillStyle = 'rgba(255,211,77,.10)'; x.strokeStyle = 'rgba(255,211,77,.45)'; x.lineWidth = 2;
  x.beginPath(); x.roundRect ? x.roundRect(64,288,660,76,18) : x.rect(64,288,660,76); x.fill(); x.stroke();
  x.fillStyle = muted; x.font = `700 16px ${BODY}`; x.fillText(F.rarity.scope, 88, 318);
  fitFont(x, F.rarity.text, 610, 32, 400, DISP); x.fillStyle = gold; x.fillText(F.rarity.text, 88, 352);
  // 最終的なアバター（32×32を6倍で、ドットをぼかさずに）
  if(S.look){
    const off = document.createElement('canvas'); off.width = 32; off.height = 32;
    const ox = off.getContext && off.getContext('2d');
    if(ox){ drawAvatar(ox, avatarState(true)); x.imageSmoothingEnabled = false; x.drawImage(off, 896, 150, 192, 192); x.imageSmoothingEnabled = true; }
  }
  // ランク（右上のバッジ）
  x.lineWidth = 5; x.strokeStyle = F.rank.c;
  x.beginPath(); x.arc(1092,92,42,0,Math.PI*2); x.fillStyle = '#0d0f13'; x.fill(); x.stroke();
  x.fillStyle = F.rank.c; x.font = `400 52px ${DISP}`; x.textAlign = 'center'; x.fillText(F.rank.r, 1092, 111);
  x.fillStyle = muted; x.font = `900 15px ${BODY}`; x.textAlign = 'right'; x.fillText('RANK', 1040, 98);
  x.textAlign = 'left';
  // 成績ボックス
  const best = F.bestKey ? N(F.bestKey) : 'プロ未所属';
  const boxes = [
    ['通算出場', `${S.career.apps}`, '試合', true],
    ['通算得点', `${S.career.goals}`, '点', true],
    ['最高所属クラブ', best, '', false],
    ['主な獲得タイトル', titleSummary(), '', false],
  ];
  const bw = [190, 190, 330, 306], gap = 16;
  let bx = 64;
  boxes.forEach(([k,v,u,num],i)=>{
    const w = bw[i];
    x.fillStyle = '#14171d'; x.beginPath(); x.roundRect ? x.roundRect(bx,392,w,124,16) : x.rect(bx,392,w,124); x.fill();
    x.fillStyle = muted; x.font = `700 16px ${BODY}`; x.fillText(k, bx+18, 422);
    if(num){
      x.fillStyle = '#fff'; x.font = `400 52px ${DISP}`; x.fillText(v, bx+18, 488);
      const vw = x.measureText(v).width; x.fillStyle = muted; x.font = `700 18px ${BODY}`; x.fillText(u, bx+24+vw, 488);
    } else {
      x.fillStyle = '#fff'; x.font = `900 24px ${BODY}`;
      const ls = wrapLines(x, v, w-36, 2);
      ls.forEach((l,j)=>x.fillText(l, bx+18, (ls.length===1 ? 474 : 460) + j*32));
    }
    bx += w + gap;
  });
  // 墓碑銘
  const ep = `“${F.epitaph}”`;
  fitFont(x, ep, 820, 24, 700, BODY); x.fillStyle = '#e8eaee'; x.fillText(ep, 64, 572);
  x.fillStyle = muted; x.font = `900 16px ${BODY}`; x.textAlign = 'right';
  x.fillText('#サッカー人生シミュレーター', W-64, 572);
  x.textAlign = 'left';
  const url = cv.toDataURL('image/png');
  S.cardURL = url;
  const img = document.getElementById('cardImg'), dl = document.getElementById('cardDl');
  if(img){ img.src = url; img.classList.add('ready'); }
  if(dl){ dl.href = url; dl.download = `soccer-life-${S.daily || todayKey()}.png`; }
}

  const weight = s => [...s].reduce((a,ch)=>a + (ch.charCodeAt(0)>0x2000 ? 2 : 1), 0);
  for(const drop of [5, 3]){
    if(weight(lines.filter(Boolean).join('\n') + '\n\n' + tags) + 24 <= 280) break;
    lines[drop] = null;
  }
  return lines.filter(Boolean).join('\n') + '\n\n' + tags;
}

    if(k==='m') S.yen = Math.max(0, S.yen + fx.m * moneyUnit());

  if(S.stats.f>=95 && ci.p>=110) spons *= 6;                                  // 世界的スターの広告契約

  const interest = S.yen * .02;
  S.earned += pay;

  S.stats.m = mOfYen(S.yen);

  for(const c of ev.choices || []) for(const o of [c, c.win, c.lose]) if(o && EVENT_CLUBS[o.club] && !S.offer[o.club]) S.offer[o.club] = EVENT_CLUBS[o.club]();

/* =========================================================
   スパイク契約：実際と同じく、契約できるのは一部の選手だけ
   0 なし（自腹で購入）→ 1 用品提供（スパイク無償・契約金なし）→ 2 有償契約 → 3 大型契約 → 4 シグネチャー契約
   ========================================================= */
const BOOT_TIERS = ['なし', '用品提供', '有償契約', '大型契約', 'シグネチャー契約'];
const BOOT_BRANDS = {
  jp:[['adidas',25],['nike',25],['mizuno',25],['asics',15],['puma',10]],
  anglo:[['nike',40],['adidas',35],['puma',15],['newbalance',10]],
  def:[['nike',42],['adidas',38],['puma',15],['newbalance',5]],
};
const pickBrand = not => wpick((BOOT_BRANDS[cultureGroup()] || BOOT_BRANDS.def).filter(([b])=>b!==not));
// 今の立場で、メーカーが出してくれる契約の段階
function bootTierNow(ci, apps){
  const f = S.stats.f, pw = LEAGUE_POWER[ci.country] || 50;
  // シグネチャーモデルは世界でも一握り：バロンドール級か、ビッグクラブでCL・W杯を制したスター
  if(hasTrophy('@ballon') || (f>=98 && ci.p>=115 && apps>=25 && (hasTrophy('@ucl') || hasTrophy('@wc')))) return 4;
  if(ci.tier===1 && f>=80 && (pw>=88 || (S.flags.wc && pw>=72))) return 3;          // 五大リーグの有名選手・W杯に出た強豪リーグの選手
  if(apps>=15 && ((ci.tier===1 && pw>=72) || S.flags.capped)) return 2;              // 強いリーグのレギュラー・代表
  if(apps>=25 && ci.tier===1 && ci.country===S.country.n && f>=55) return 2;         // 自国リーグの人気選手（国内メーカーなど）
  if((ci.tier===1 && pw>=55 && apps>=10) || S.flags.capped) return 1;
  return 0;
}
// 年間の契約金（円・概算）。プレミアリーグの一般的なレギュラーで数千万円、世界的スターで数十億円
function bootFee(t, ci){
  const f = S.stats.f, pw = LEAGUE_POWER[ci.country] || 50, r = .8 + Math.random()*.4;
  if(t===2) return Math.round((pw>=88 ? 2.5e7 : pw>=72 ? 8e6 : 3e6) * (.6 + f/100) * r);
  if(t===3) return Math.round(1.5e8 * (1 + (f - 80)/10) * r);
  if(t===4) return Math.round(1e9 * (1 + (f - 95)/5) * r);
  return 0;
}
function bootLog(text, big){
  S.log.push({age:S.age, kind:'hap', cat:'スパイク契約', text, fx:{}});
  if(big) S.history.push({age:S.age, label:`👟 ${text.split('。')[0]}`, text, fx:{}, impact:big, success:null});
}
// 毎シーズン、契約の新規・格上げ・更新・満了を判定する
function updateBoots(ci, apps){
  if(S.age>=END_AGE) return; // 引退する年は契約の話をしない
  const t = bootTierNow(ci, apps), b = S.boot;
  const fee = n => n ? `年${fmtYen(n)}` : '契約金なし';
  if(!b){
    if(!t) return;
    const brand = S.bootBrand;
    S.boot = {brand, tier:t, fee:bootFee(t, ci), until:Math.min(END_AGE, S.age + 2 + Math.floor(Math.random()*3))};
    bootLog(t===1
      ? `${N(brand)}とスパイクの用品提供契約を結んだ。契約金はないが、もう自腹でスパイクを買わなくていい（契約は${S.boot.until}歳まで）。`
      : `${N(brand)}と初めてのスパイク契約を結んだ。${BOOT_TIERS[t]}で${fee(S.boot.fee)}（${S.boot.until}歳まで）。`, 6);
    return;
  }
  if(t > b.tier){                                           // 活躍したら契約途中でも格上げ
    const old = b.fee;
    b.tier = t; b.fee = bootFee(t, ci); b.until = Math.min(END_AGE, S.age + 3);
    bootLog(`${N(b.brand)}が契約を${BOOT_TIERS[t]}に格上げした。${fee(old)} → ${fee(b.fee)}（${b.until}歳まで）。`, t>=3 ? 10 : 4);
    return;
  }
  if(S.age < b.until) return;
  if(!t){
    bootLog(`${N(b.brand)}とのスパイク契約が満了。更新の話はなかった。また自分でスパイクを買う日々だ。`);
    S.boot = null;
    return;
  }
  const old = b.fee, nf = bootFee(t, ci);
  if(t>=2 && Math.random()<.2){                             // より高い条件を出したライバル社へ乗り換え
    const nb = pickBrand(b.brand), up = Math.round(nf*1.3);
    bootLog(`${N(b.brand)}との契約が満了し、より高い条件を出した${N(nb)}に乗り換えた。${BOOT_TIERS[t]}で${fee(up)}。`, 4);
    S.boot = {brand:nb, tier:t, fee:up, until:Math.min(END_AGE, S.age + 3)};
    return;
  }
  b.until = Math.min(END_AGE, S.age + 2 + Math.floor(Math.random()*3));
  bootLog(t===1 && b.tier===1 ? `${N(b.brand)}からの用品提供が続くことになった（${b.until}歳まで）。`
    : t < b.tier
    ? `${N(b.brand)}との契約を更新したが、${BOOT_TIERS[t]}に格下げされた。${fee(old)} → ${fee(nf)}。`
    : `${N(b.brand)}とのスパイク契約を更新した（${BOOT_TIERS[t]}）。${fee(old)} → ${fee(nf)}（${b.until}歳まで）。`);
  b.tier = t; b.fee = nf;
}
const bootChip = () => S.boot ? `<span class="trait">👟 ${esc(N(S.boot.brand))}・${BOOT_TIERS[S.boot.tier]}</span>` : '';

/* =========================================================
   年俸と市場価値
   ・年俸：シーズン終了時に計算し直す。移籍した瞬間にも、移籍先の水準で結び直す
   ・市場価値：リーグの基準額 × 活躍度 × 年齢 × タイトル。前年の値と混ぜて急変を抑える
   ・サウジ：年俸は移籍時に3〜5倍で保証されるが、市場価値は下がり、伸びも鈍る（代表にも選ばれにくい）
   ========================================================= */
const YEN_PER_EUR = 160;
const MIDEAST = new Set(['サウジアラビア']);
// その選手の今の実力で、そのクラブが払う年俸（ランダムな揺れ込み）
function salaryFor(ci, apps){
  const [a1, a2] = SALARY[ci.country] || [1e7, 2e6];
  const need = 35 + ci.p*.5;
  let pay = (ci.tier===2 ? a2 : a1) * clubPay(ci.obj);
  pay *= Math.max(.3, Math.min(1.6, Math.pow(2, (S.stats.s - need - 8) / 10))); // 実力（リーグ平均的なレギュラーで1倍、チームの稼ぎ頭でも1.6倍まで）
  pay *= apps>=25 ? 1.15 : apps>=12 ? 1 : .75;                                // 出場機会
  if(S.stats.f>=85) pay *= 1 + (S.stats.f - 85) / 10;                         // スター選手の上乗せ
  if(S.age<=19) pay *= .35; else if(S.age<=21) pay *= .65;                    // 若手契約
  pay *= Math.exp((Math.random() - .5) * .4);
  // 契約中は、結んだときの額が最低保証（サウジの大型契約など）
  if(S.contract && S.contract.club===S.club) pay = Math.max(pay, S.contract.floor);
  return Math.min(pay, 1.2e10);
}
// 普通のクラブのレギュラーの市場価値（ユーロ）：プレミア約1,500万€、フランス約530万€、J1約50万€、ナイジェリア約10万€
const mvBase = ci => 15e6 * Math.exp(.086 * ((LEAGUE_POWER[ci.country] || 50) - 100));
function marketValueFor(ci, apps, goals, won){
  const need = 35 + ci.p*.5;
  let v = mvBase(ci) * YEN_PER_EUR;
  if(ci.tier===2) v *= .15;
  if(BIG_CLUBS.has(ci.obj.name)) v *= 5;     // ビッグクラブの主力は数千万〜1億€超
  else if(ci.tier===1 && !BIG5.has(ci.country) && LEAGUES[ci.country].c.indexOf(ci.obj.name)<3) v *= 2;
  v *= Math.max(.2, Math.min(1.8, Math.pow(2, (S.stats.s - need - 8) / 8)));  // 実力（リーグ屈指の選手でも1.8倍まで）
  v *= .3 + .7 * Math.min(1, apps/30);                                      // 出場機会
  if(S.pos==='FW' || S.pos==='MF') v *= 1 + goals/40;                       // 得点
  // 年齢：若手は将来性で高く、30代は下がっていく（主力として活躍していれば下げ幅は小さい）
  const a = S.age;
  let age = a<=21 ? 1.25 : a<=27 ? 1.1 : a<=29 ? .85 : a===30 ? .65 : a===31 ? .5 : a===32 ? .38 : .28 * Math.pow(.8, a-33);
  if(a>=30 && apps>=28 && S.stats.s - need >= 10) age *= 1.4;
  v *= age;
  v *= 1 + .15 * won.length;
  if(S.flags.capped) v *= 1.1;
  if(hasTrophy('@ballon')) v *= 1.5;
  if(MIDEAST.has(ci.country)) v *= .55;                                     // 中東は稼げるが、選手としての評価は伸びない
  return Math.min(v, 2e10);                                                 // 上限は史上最高額クラス（約1.2億€）
}
// 変化の記録（パネルの ▲▼ 表示用）
let chgId = 0;
function setMoney(salary, mv){
  const r = (n, o) => o>0 && n!=null ? n/o - 1 : null;
  S.chg = {s:r(salary, S.salary), v:r(mv, S.marketValue), id:++chgId};
  if(salary!=null) S.salary = salary;
  if(mv!=null){ S.marketValue = mv; S.peakMV = Math.max(S.peakMV, mv); }
}
// 移籍した瞬間に、移籍先との契約を結ぶ
function onTransfer(){
  const ci = clubInfo(S.club);
  if(!ci) return;
  let pay = salaryFor(ci, 25);
  if(MIDEAST.has(ci.country) && S.salary>0) pay = S.salary * (3 + Math.random()*2); // 中東は今の年俸の3〜5倍を保証
  S.contract = {club:S.club, floor:pay};
  const mv = MIDEAST.has(ci.country) ? S.marketValue * (.6 + Math.random()*.1) : S.marketValue;     // 中東移籍で3〜4割下落
  setMoney(pay, mv || null);
}
const leagueLabel = ci => ci.tier===1 ? `${ci.country}1部` : (LEAGUES[ci.country].l2 || `${ci.country}2部以下`);
function pctTag(r){
  if(r==null || Math.abs(r)<.005) return '<em class="flat">±0%</em>';
  const p = Math.round(r*100);
  return r>0 ? `<em class="up">▲ +${p}%</em>` : `<em class="down">▼ ${p}%</em>`;
}
