<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="世界でサッカーをプレーする人は、およそ2億5千万人。どこの国で、どんな家に、どんな才能を持って生まれるかは選べない。あなたのサッカー選手人生をシミュレーション。">
<meta property="og:type" content="website">
<meta property="og:title" content="2億5千万分の1 | サッカー選手人生シミュレーター">
<meta property="og:description" content="世界でサッカーをプレーする人は、およそ2億5千万人。どこの国で、どんな家に、どんな才能を持って生まれるかは選べない。あなたのサッカー選手人生をシミュレーション。">
<meta property="og:site_name" content="2億5千万分の1">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="2億5千万分の1 | サッカー選手人生シミュレーター">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a;
  --card:#111318;
  --card2:#171a21;
  --line:#252932;
  --text:#f2f3f5;
  --muted:#8a8f9a;
  --accent:#c6ff3d;
  --skill:#c6ff3d;
  --fame:#3dd6ff;
  --money:#ffd34d;
  --scandal:#ff3d6e;
  --radius:20px;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.app{
  width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 10px);
  gap:10px;overflow:hidden;position:relative;
  background:
    radial-gradient(120% 50% at 50% -10%,rgba(198,255,61,.10),transparent 60%),
    radial-gradient(80% 40% at 100% 110%,rgba(255,61,110,.10),transparent 60%),
    var(--bg);
}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.logo{font-family:var(--display);font-size:15px;line-height:1.1;letter-spacing:.02em;white-space:nowrap;min-width:0}
.logo small{display:block;white-space:nowrap;font-family:var(--body);font-size:9px;color:var(--muted);letter-spacing:.2em;font-weight:700}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.bgm{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1;display:grid;place-items:center;opacity:.55;transition:.2s}
.bgm.on{opacity:1;border-color:rgba(198,255,61,.5)}
#seBtn svg{width:17px;height:17px;display:block;color:var(--text)}
@media (max-width:360px){.top-r{gap:4px}.bgm{width:30px;height:30px;font-size:13px}#seBtn svg{width:15px;height:15px}
  .toggle button{padding:6px 7px;font-size:10.5px}.logo{font-size:13px}.logo small{font-size:8px;letter-spacing:.12em}}
.toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.toggle button{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;color:var(--muted);transition:.2s}
.toggle button.on{background:var(--accent);color:#0a0b0d}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;transition:opacity .3s}
.statrow{display:flex;gap:6px;flex:none;align-items:stretch}
.statrow .stats{flex:1;min-width:0}
#avatar{width:58px;height:58px;flex:none;align-self:center;image-rendering:pixelated;image-rendering:crisp-edges;background:radial-gradient(circle at 50% 60%,#1c2029,var(--card) 70%);border:1px solid var(--line);border-radius:12px}
.stats.dim{opacity:.25}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px 8px}
.stat .lbl{font-size:9.5px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.stat .val{font-family:var(--display);font-size:17px;line-height:1.2}
.bar{height:4px;background:#22252d;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stat.s .val{color:var(--skill)} .stat.s .bar i{background:var(--skill)}
.stat.f .val{color:var(--fame)} .stat.f .bar i{background:var(--fame)}
.stat.m .val{color:var(--money);font-size:14px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .stat.m .bar i{background:var(--money)}
.stat.x .val{color:var(--scandal)} .stat.x .bar i{background:var(--scandal)}
.stat.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.08)}}
/* clock（時間経過バー＋倍速） */
.clock{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 10px}
.clock-top{display:flex;align-items:center;gap:8px}
.clock-age{font-family:var(--display);font-size:15px;line-height:1;white-space:nowrap}
.clock-age small{font-family:var(--body);font-size:10px;color:var(--muted);margin-left:2px}
.clock-state{flex:1;font-size:10.5px;font-weight:900;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock.paused .clock-state{color:var(--money);animation:blink 1.2s ease-in-out infinite}
.clock.stopped .clock-state{color:var(--muted);animation:none}
@keyframes blink{50%{opacity:.4}}
.pause{flex:none;font-size:11.5px;font-weight:900;padding:8px 12px;min-height:34px;border-radius:999px;background:var(--money);color:#0a0b0d;white-space:nowrap}
.pause.resume{background:var(--accent)}
.pause:disabled{opacity:.35}
.clock.held .ybar i{background:linear-gradient(90deg,rgba(138,143,154,.4),var(--muted));box-shadow:none}
.clock.held .clock-state{color:var(--muted);animation:blink 1.2s ease-in-out infinite}
.speed{display:flex;background:#0c0e12;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.speed button{font-size:11px;font-weight:900;padding:5px 10px;border-radius:999px;color:var(--muted);font-family:var(--display)}
.speed button.on{background:var(--text);color:#0a0b0d}
.ybar{position:relative;height:8px;background:#1e2128;border-radius:8px;overflow:hidden;margin-top:8px}
.ybar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;
  background:linear-gradient(90deg,rgba(198,255,61,.5),var(--accent));box-shadow:0 0 10px rgba(198,255,61,.6)}
.clock.paused .ybar i{background:linear-gradient(90deg,rgba(255,211,77,.4),var(--money));box-shadow:0 0 10px rgba(255,211,77,.5)}
.ybar .ev-mark{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--money);opacity:.8}
/* player name */
.pname{font-family:var(--display);font-size:26px;line-height:1.2;
  background:linear-gradient(90deg,#fff 0%,var(--accent) 70%,var(--fame));-webkit-background-clip:text;background-clip:text;color:transparent}
.psub{font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--muted);margin:2px 0 14px;display:flex;align-items:center;gap:6px}
.pname-s{font-size:12px;font-weight:900;color:var(--muted);margin-bottom:12px}
.pname-s b{color:var(--text)}
/* life */
.life-sub{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:900;letter-spacing:.12em;color:#0a0b0d;background:var(--accent);padding:3px 8px;border-radius:6px}
.next-ev{font-size:11px;color:var(--muted);font-weight:700}
.next-ev b{color:var(--money)}
.log{display:flex;flex-direction:column;gap:6px}
.log-item{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.log-item.new{animation:fade .4s ease-out}
.log-item .la{font-family:var(--display);font-size:14px;color:var(--muted);line-height:1.35}
.log-item .lt{font-size:13px;line-height:1.6}
.log-item .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:10.5px;font-weight:900}
.log-item .mini .s{color:var(--skill)}.log-item .mini .f{color:var(--fame)}.log-item .mini .m{color:var(--money)}.log-item .mini .x{color:var(--scandal)}
.log-item.story{border-color:rgba(255,211,77,.35);background:linear-gradient(135deg,rgba(255,211,77,.08),var(--card) 65%)}
.log-item.story .la{color:var(--money)}
.log-item.story .lt{font-size:13.5px;line-height:1.75}
.story-tag{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--money);margin-bottom:3px}
.pill.pos{color:#0a0b0d}
.pos-head{text-align:center}
.pos-head .h2{font-size:26px;margin-top:2px}
.pos-head .sub{margin-top:6px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 12px;border-radius:18px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 16%,transparent),var(--card) 60%);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);transition:transform .12s}
.pos-card:active{transform:scale(.97)}
.pos-card .pe{font-size:30px;line-height:1.1}
.pos-card .pk{font-family:var(--display);font-size:26px;line-height:1.05;color:var(--pc)}
.pos-card .pf{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.pos-card .pd{font-size:12px;font-weight:700;line-height:1.5;margin-top:4px}
.pos-card.cur{opacity:.55}
.pos-card .pcur{font-size:10px;font-weight:900;color:var(--pc);letter-spacing:.06em}
.pos-card .pu{font-size:10.5px;font-weight:900;color:var(--pc);margin-top:4px}
.log-item.hap{border-color:rgba(61,214,255,.3)}
.hap-tag{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--fame);margin-bottom:2px}
.log-item.ev{border-color:rgba(198,255,61,.35);background:linear-gradient(135deg,rgba(198,255,61,.07),var(--card) 60%)}
.log-item.ev .la{color:var(--accent)}
.log-item .ll{font-size:13.5px;font-weight:900;line-height:1.45;margin-bottom:3px}
.log-item .tag{display:inline-block;font-size:9px;font-weight:900;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.log-item .tag.ok{color:var(--accent);border:1px solid var(--accent)}
.log-item .tag.ng{color:var(--scandal);border:1px solid var(--scandal)}
.log-item .chips{margin-top:8px}
.warn{font-size:12px;font-weight:900;color:var(--scandal);text-align:center}
/* main */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.main>*{flex-shrink:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:900;font-size:16px;background:var(--accent);color:#0a0b0d;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.foot{font-size:9.5px;color:#555a64;text-align:center;flex:none;line-height:1.4}
/* title */
.hero{flex:1;display:flex;flex-direction:column;justify-content:flex-start;text-align:center;padding-block:12px;cursor:pointer;
  background:radial-gradient(closest-side,rgba(198,255,61,.06),transparent 70%) center/120% 60% no-repeat}
.hero .brand{margin-top:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:plIn .9s ease-out both}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,12vw,56px);line-height:1.15;margin:0;letter-spacing:.01em;white-space:nowrap;
  text-shadow:0 0 28px rgba(198,255,61,.18)}
.hero h1 em{font-style:normal;color:var(--accent);font-size:1.18em;text-shadow:0 0 26px rgba(198,255,61,.5)}
.hero .tsub{margin:4px 0 0;font-size:clamp(12px,3.6vw,14px);font-weight:700;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.ball{font-size:30px;animation:spin 6s linear infinite;display:inline-block;filter:drop-shadow(0 0 18px rgba(198,255,61,.45))}
.hero .rule{width:0;height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:grow 1.2s .3s ease-out forwards}
@keyframes grow{to{width:72%}}
.prologue{display:flex;flex-direction:column;gap:12px;margin:18px 0 14px}
.pl{margin:0;font-size:clamp(14.5px,4.2vw,16px);line-height:1.85;font-weight:700;color:#c9ccd3;opacity:0;filter:blur(8px);transform:translateY(10px);
  animation:plIn 1.1s var(--d,0s) ease-out forwards}
.pl b{color:var(--text);font-weight:900}
.pl.last{font-size:clamp(15px,4.4vw,17px);color:var(--text)}
.pl.last b{display:inline-block;margin-top:6px;font-family:var(--display);font-weight:400;font-size:26px;color:var(--money);text-shadow:0 0 22px rgba(255,211,77,.45)}
@keyframes plIn{to{opacity:1;filter:none;transform:none}}
.btn.fate{letter-spacing:.04em;animation:glow 2.4s 1s ease-in-out infinite}
.hero{min-height:calc(100dvh - 250px)}
.hero-sp{margin-top:auto}
@keyframes bob{50%{transform:translateY(5px)}}
/* データ欄への目印：スタートボタンの上に、数字で引きつけて置く */
.data-cue{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:0 0 10px;padding:10px 14px;border-radius:14px;
  background:#0c1a20;box-shadow:0 -10px 20px var(--bg);border:1px solid rgba(61,214,255,.35);color:var(--text);font-family:inherit;cursor:pointer;
  transition:opacity .4s,max-height .4s,margin .4s,padding .4s;max-height:90px;overflow:hidden}
.data-cue .dc-t{font-size:13px;font-weight:700;text-align:left;white-space:nowrap}
.data-cue .dc-t b{font-weight:900;color:var(--fame);margin-left:4px}
.data-cue .dc-s em{font-style:normal}
.data-cue .dc-s{font-size:11px;font-weight:900;color:var(--fame);display:flex;align-items:center;gap:4px;white-space:nowrap}
.data-cue i{font-style:normal;font-size:15px;color:var(--fame);animation:bob 1.4s ease-in-out infinite}
.start-bar.seen .data-cue{opacity:0;max-height:0;margin:0;padding-block:0;border-width:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){.data-cue i{animation:none}}
@media (max-width:360px){.data-cue .dc-s em{display:none}.data-cue .dc-t{font-size:12.5px}}
.start-bar{position:sticky;bottom:0;z-index:5;margin-top:4px;padding:18px 0 4px;background:linear-gradient(transparent,var(--bg) 38%)}
/* タイトル：導入文を最後まで読んでからスタートボタンを出す */
.hero:not(.done) ~ .start-bar{opacity:0;visibility:hidden;transform:translateY(12px)}
.hero.done ~ .start-bar{transition:opacity .6s,transform .6s}
.title-src{margin:14px 0 0;font-size:10px;color:#5d626c;text-align:center;line-height:1.6}
.facts{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px}
.facts-head .h2{font-size:21px;margin:8px 0 4px}
.facts .sub{font-size:12px}
.xrank{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.xrank li{display:grid;grid-template-columns:22px 26px 1fr;align-items:center;gap:6px}
.rk{font-family:var(--display);font-size:15px;color:var(--muted);text-align:center}
.xrank li.top .rk{color:var(--money)}
.rf{font-size:20px;line-height:1}
.rn{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.rn b{font-weight:900}.rn span{font-weight:900;color:var(--muted)}
.xrank li.top .rn span{color:var(--text)}
.rbar{height:6px;background:#1e2128;border-radius:6px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,rgba(61,214,255,.45),var(--fame))}
.xrank li.top .rbar i{background:linear-gradient(90deg,rgba(255,211,77,.5),var(--money))}
.dom{margin-top:16px;padding:12px;background:#0d0f13;border-radius:14px}
.dom-h{font-size:11px;font-weight:900;color:var(--muted);margin-bottom:6px}
.dom-r{display:grid;grid-template-columns:1fr auto 54px;gap:8px;font-size:13px;padding:4px 0;font-weight:700}
.dom-r em{font-style:normal;color:var(--fame);text-align:right;font-weight:900}
.src{font-size:10px;color:#5d626c;line-height:1.6;margin:12px 0 0}
.odds-hero{margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(160deg,rgba(198,255,61,.08),#0d0f13 60%);text-align:center}
.oh-row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted)}
.oh-row b{color:var(--text);font-weight:900}
.oh-arrow{color:var(--muted);margin:4px 0}
.oh-big{margin-top:12px;font-size:13px;font-weight:900}
.oh-big em{font-style:normal;font-family:var(--display);font-size:44px;color:var(--accent);margin:0 2px;text-shadow:0 0 24px rgba(198,255,61,.4)}
.oh-big small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.odd{padding:12px;border-radius:14px;background:#0d0f13;border:1px solid color-mix(in srgb,var(--oc) 30%,transparent)}
.od-top{display:flex;flex-direction:column;gap:2px}
.od-k{font-size:11.5px;font-weight:900;line-height:1.4}
.od-1n{font-size:10px;font-weight:900;color:var(--oc)}
.od-v{font-family:var(--display);font-size:28px;line-height:1.1;margin-top:8px;color:var(--oc)}
.od-v small{font-size:14px;margin-left:1px}
.od-bar{height:5px;background:#1e2128;border-radius:5px;overflow:hidden;margin-top:6px}
.od-bar i{display:block;height:100%;min-width:2px;background:var(--oc);box-shadow:0 0 8px var(--oc)}
.od-note{font-size:9.5px;color:var(--muted);line-height:1.5;margin-top:6px}
@keyframes glow{50%{box-shadow:0 0 30px rgba(198,255,61,.55)}}
.skip-hint{font-size:10.5px;color:#4d525c;font-weight:700;margin-top:12px;transition:opacity .4s}
.hero.done{cursor:default}
.hero.done .brand,.hero.done .pl{animation:none;opacity:1;filter:none;transform:none}
@media (prefers-reduced-motion: reduce){.pl{filter:none;transform:none}.hero:not(.done) ~ .start-bar{transform:none}}
.hero.done .rule{animation:none;width:72%}
.hero.done .skip-hint{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-family:inherit;outline:none}
.field input:focus{border-color:var(--accent)}
/* mode */
.h2{font-family:var(--display);font-size:22px;margin:4px 0 0;font-weight:400}
.sub{color:var(--muted);font-size:12.5px;margin:0}
/* event */
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700}
.age{font-family:var(--display);font-weight:400;font-size:26px;color:var(--text);line-height:1}
.age small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:4px}
.club{text-align:right;line-height:1.35;max-width:62%}

.landed .g-bar{opacity:1}
.landed .g-bar i{animation:fill 5s linear forwards}

// 国の命名規則に沿って「表示名」と「ローマ字表記」を作る
function genName(country){
  const P = NAME_POOLS[country] || NAME_POOLS['イングランド'];
  const [f, fl] = pick(P.first), [l, ll] = pick(P.last);
  if(country==='日本') return {main:`${l} ${f}`, sub:`${fl} ${ll.toUpperCase()}`};
  if(P.east) return {main:`${l}・${f}`, sub:`${ll.toUpperCase()} ${fl}`};
  if(country==='ブラジル'){
    const r = Math.random();
    if(r<.25){ const [n, nl] = pick(P.nick); return {main:n, sub:`${nl.toUpperCase()}（${fl} ${ll}）`}; } // 愛称のみ
    if(r<.4) return {main:`${f}・ジュニオール`, sub:`${fl.toUpperCase()} JR.`};
  }
  return {main:`${f}・${l}`, sub:`${fl} ${ll.toUpperCase()}`};
}

/* =========================================================
   所属クラブ：その国出身のプロ選手が実際にいるクラブと同じ確率で決める
   ・最初のプロクラブが国外になる確率 ab = E/(E+D)
       E＝国外135リーグにいるその国出身選手数（CIES Monthly Report 100の5年累計を、Weekly Post 546〔2026年5月〕の現時点人数に換算）
       D＝国内プロリーグのクラブ数 × 平均登録25.7人（CIES MR79）×（1−リーグの外国籍比率）
   ・国外の行き先は、その国出身の国外選手がいるリーグの分布（CIESの移籍ルート）
   ・リーグ内は、1部も2部以下も1クラブあたりの人数は同じなので、クラブ数に比例して選ぶ

const parodize = s => { const a = [...s]; if(a.length<3) return s+'（仮）'; a.splice(a.length-1, 0, '〜'); return a.join(''); };
function wpick(pairs){
  let r = Math.random() * pairs.reduce((a,[,w])=>a+w,0);
  for(const [v,w] of pairs){ if((r-=w)<0) return v; }
  return pairs[pairs.length-1][0];
}
// country のリーグからクラブを1つ選ぶ（topOnly=1部だけ、exclude=除外するクラブ名）
function pickClub(country, opt={}){
  const lg = LEAGUES[country], top = lg.c.filter(c=>!(opt.exclude||[]).includes(c));
  const t2 = opt.topOnly ? 0 : lg.t2;
  if(!opt.tier2 && Math.random()*(top.length+t2) < top.length) return {name:pick(top), country, tier:1};
  return LEAGUE2[country] ? {name:pick(LEAGUE2[country]), country, tier:2} : {name:lg.l2, country, tier:2, generic:true};
}
function clubName(c){
  const base = c.generic ? `${c.name}のクラブ` : S.nameMode==='real' ? c.name : PARODY_CLUB[c.name] ? NAMES[PARODY_CLUB[c.name]][1] : parodize(c.name);
  return c.country===S.country.n ? base : `${base}（${c.country}）`;
}
function clubKey(c){ S.dyn.push(c); return 'dyn:'+(S.dyn.length-1); }
// 生まれた時点で、アカデミーのクラブ・ユースのライバル・最初のプロクラブを決めておく
function rollCareerClubs(){
  const home = S.country.n, R = CAREER_ROUTES[home], lg = LEAGUES[home];
  S.dyn = [];
  S.homeClub = pickClub(home, {topOnly:true});                           // 育成組織は1部クラブのもの
  S.rivalClub = pickClub(home, {topOnly:true, exclude:[S.homeClub.name]});
  S.firstAbroad = Math.random() < R.ab;
  // 国内か国外かは実際の確率で決め、その中から18歳の実力（ポテンシャルの約8割）に見合うクラブを選ぶ
  const target = S.potBirth >= 80 ? S.potBirth*.88 : S.potBirth*.8 - 2;   // 飛び抜けた才能は、若くして上のクラブへ
  const cands = Array.from({length:14}, ()=> S.firstAbroad ? pickClub(wpick(Object.entries(R.to))) : pickClub(home, {exclude:[S.homeClub.name]}));
  if(!S.firstAbroad && S.mode==='world') cands.push(S.homeClub);
  S.firstClub = cands.reduce((a,b)=> Math.abs(needOf(clubPrestige(b)) - target) < Math.abs(needOf(clubPrestige(a)) - target) ? b : a);
}

function proEvent(){

      lose:{fx:{s:4,m:3,x:3}, club:k, text:'強気すぎて提示額が下がった。それでも海を渡った。'}},

    return {id:'pro', text:`${grad}。${nm}のトップ昇格か、武者修行のローン移籍か。`,

    choices:[
     {label:'すぐに契約する', fx:{s:6,m:5,f:3}, club:k, text:'「見返してやる」。入団会見で、アカデミーの方角をにらんだ。'},

      lose:{fx:{s:5,x:2}, club:k, text:'迷っている間に背番号が埋まった。残っていたのは77番だった。'}},
    ]};
}

function N(key){
  const city = S.city || '某市';
  if(key==='home') return `${city}の実家`;
  if(key.startsWith('dyn:')) return clubName(S.dyn[+key.slice(4)]);
  if(S.offer && S.offer[key]) return clubName(S.offer[key]);
  if(key==='academy' && S.homeClub) return `${clubName(S.homeClub)}のアカデミー`;
  if(key==='rivalClub' && S.rivalClub) return clubName(S.rivalClub);
  if(key==='kidsacademy') return S.nameMode==='real' ? `プロクラブ育成スクール ${city}校` : `${city}ボールの虎の穴`;
  if(key==='junior') return S.nameMode==='real' ? `${city}ジュニアFC` : `${city}ちびっこ蹴球団`;
  if(key==='chugaku') return S.nameMode==='real' ? `${city}立第二中学校` : `${city}第二中（部員4名）`;
  if(key==='school') return S.nameMode==='real' ? `${S.pref||'某県'}立蹴球高校` : `${city}第一ボール拾い学園`;
  if(key==='daihyo' && S.country && S.country.n!=='日本'){
    return S.nameMode==='real' ? `サッカー${S.country.n}代表` : `${S.country.n}蹴球団`;
  }
  const v = NAMES[key]; if(!v) return key;
  return S.nameMode==='real' ? v[0] : v[1];
}

function fmtYen(n, signed){
  const a = Math.abs(n);
  const body = a<1e4 ? `${Math.round(a).toLocaleString('ja-JP')}円`
    : a<1e8 ? `${Math.round(a/1e4).toLocaleString('ja-JP')}万円`
    : a<1e12 ? `${(a/1e8).toFixed(a<1e9?1:0).replace(/\.0$/,'')}億円`
    : `${(a/1e12).toFixed(1)}兆円`;

}

function pickHappening(){
  const low = pickLowHap(); if(low) return low;
  const pool = HAPPENINGS.filter(h=>!S.usedHap.has(h) && !(h.noGK && S.pos==='GK') && (!h.req || h.req()) && (!h.mode || h.mode===S.mode) && (!h.pos || h.pos===S.pos) && S.age>=h.min && S.age<=h.max);
  return pool.length ? pick(pool) : null;
}

function changePos(k, fromPick){
  const P = POSITIONS[k], old = S.pos;
  S.pos = k; S.posPath.push(k); S.posChange = false;
  const fx = fromPick ? {s:2} : {};
  for(const i in fx) S.stats[i] = clamp(S.stats[i] + fx[i]);
  S.log.push({age:S.age, kind:'event', label:`🔄 ${old} → ${P.e} ${k}（${P.full}）にコンバート`, text:`${P.up.join('・')}を磨く日々が始まった。`, fx, success:null});
  S.history.push({age:S.age, label:`${old}から${k}（${P.full}）にコンバート`, text:P.d, fx, impact:3, success:null});
  if(fromPick){ S.result = {fx}; S.screen = 'life'; render(true); }
}
function choosePos(k){
  if(S.posChange){
    if(k===S.pos){ S.posChange = false; S.screen = 'life'; render(true); return; } // 結局そのまま
    changePos(k, true); return;
  }
  const P = POSITIONS[k];
  S.pos = k; S.posPath = [k];
  for(const i in P.fx) S.stats[i] = clamp(S.stats[i] + P.fx[i]);
  S.log.push({age:S.age, kind:'event', label:`${P.e} ${k}（${P.full}）を選んだ`, text:`${P.d} ${P.up.join('・')}が伸びやすくなった。`, fx:P.fx, success:null});
  S.history.push({age:S.age, label:`${k}（${P.full}）を選んだ`, text:P.d, fx:P.fx, impact:0, success:null});
  S.result = {fx:P.fx};
  S.screen = 'life';
  render(true);
}

  if(a<12){ const n = Math.min(12, a + 2 + (Math.random()<.5 ? 1 : 0)); return n===S.joinAge ? n+1 : n; } // 入団の年は避ける
  if(a===12) return 15;
  if(a<18) return a+1;
  const n = Math.min(END_AGE, a + (Math.random()<.5 ? 1 : 2));
  if(S.flags && S.flags.capped && n===a+2 && (isWcYear(wcYearOf(a+1)) || isWcYear(wcYearOf(a+2)))) return a+1;
  return n;
}
function setClub(k){ if(S.club!==k){ S.club=k; S.clubs.push(k); } }
function ageClub(){
  if(S.mode==='japan'){ if(S.age===15) setClub('school'); return; }
  // 12歳のスカウトで落ちても、13歳で拾われる
  if(S.age===13 && S.club!=='academy'){ setClub('academy'); S.log.push({age:S.age, kind:'year', text:()=>`遅咲きの才能が認められ、ついに${N('academy')}への入団が決まった。`, fx:{}}); }
}
const chapterOf = a => a<6 ? '乳幼児期' : a<15 ? '少年期' : a<18 ? 'ユース時代' : a<30 ? 'プロ時代' : 'ベテラン期';

// イベントのない1年に流れる小さな出来事と、毎年の自然な変化

  '乳幼児期':{}, '少年期':{}, 'ユース時代':{f:1},       // スキルの伸びと衰えは skillCurve が担う
  'プロ時代':{f:1}, 'ベテラン期':{},

function startCareer(){
  S.stats = {s:10, f:0, m:0, x:0}; // 資産は0円から（お小遣い・バイト・契約で初めて増える）
  S.age = 0;
  S.club = 'home';
  S.clubs = [S.club];
  S.used = new Set(); S.usedHap = new Set(); S.history = []; S.eventNo = 0;
  S.endReason = null; S.pendingEnd = null;
  S.progress = 0; S.evAge = 1; S.firedAge = -1; S.userPaused = false;
  S.pos = null; S.joined = false; S.posPath = []; S.posChange = false;
  S.yen = 0; S.salary = 0; S.income = 0; S.offer = {}; S.stats.m = 0;
  S.ledger = {salary:0, bonus:0, signing:0, spons:0, boot:0, tax:0, agent:0, living:0, other:0};
  // 実家の資産は本人と別。家庭環境と、その国の所得水準（2部の平均年俸を目安）で決まる
  const lv = Math.max(.15, Math.min(2, ((SALARY[S.country.n] || [0, 2e6])[1]) / 5e6));
  S.famYen = ({rich:8e7, middle:8e6, poor:8e5})[S.family.k] * lv;
  S.birthYear = new Date().getFullYear();
  S.wc = {}; S.caps = 0; S.natNow = false; S.captain = null; S.hurtAge = null;
  S.ss = null; S.pendingOffer = null; S.ballonNom = null; S.marketAsk = null;
  S.form = 0; S.usedFlavor = new Set(); S.records = []; S.ultra = [];
  S.marketValue = 0; S.peakMV = 0; S.earned = 0; S.contract = null; S.chg = null;
  S.boot = null; CELEB_Q.length = 0;
  S.life = {partner:false, married:false, divorced:false, kids:0, pet:false, wild:0, moveAge:null, partnerAge:null, marriedAge:null};
  S.rel = {team:50, fam:60}; S.risk = {inj:0, decl:0, src:[]}; S.later = []; S.lifePlan = null; S.lifeN = {events:0}; S.evYear = {};
  S.persona = wpick(PERSONAS.map(p=>[p.k, p.w * ({grit:{stoic:2}, charisma:{party:1.6}, mental:{leader:1.6}}[S.talent.k]?.[p.k] || 1)]));
  S.trophies = []; S.flags = {}; S.career = {apps:0, goals:0, seasons:[]}; S.final = null; S.cardURL = null;
  S.body.shown = false; // 体格の効果は、身長が確定する17〜18歳で反映
  S.pot = S.potBirth; S.sBonus = 0; S.peakS = 0;
  for(const t of [S.talent, S.family]){ const {s, m, ...rest} = t.fx; applyFx(rest); } // 才能のスキル効果はポテンシャルに含めてある。家庭のお金は実家の資産へ
  S.origin = makeOrigin();
  S.joinAge = rollJoinAge();
  S.rivalName = genName(S.country.pool || S.country.n).main;
  S.friendName = genName(S.country.pool || S.country.n).main;
  S.bootBrand = pickBrand(); // 縁があるのはこのメーカー（契約できるかは実力次第）
  rollCareerClubs();
  S.log = [];
  storyBeat(0);
  S.current = null;
  S.screen = 'life';
  render();
}

// 時間経過ループ（requestAnimationFrame）
let raf = null, lastTs = 0;
function clockStart(){
  if(raf || S.screen!=='life' || S.pendingEnd || S.userPaused || celebOn) return;
  lastTs = performance.now();
  raf = requestAnimationFrame(clockLoop);
}
function clockLoop(ts){
  raf = null;
  if(S.screen!=='life' || S.pendingEnd || S.userPaused || celebOn){ updateClock(); return; }
  const dt = Math.min(100, ts - lastTs); lastTs = ts;
  S.progress += dt / (YEAR_MS / S.speed);
  if(S.age===S.joinAge && !S.pos && S.progress>=.3){
    S.progress = .3;
    if(!S.joined){ S.current = JOIN_EVENT; S.screen = 'event'; } // まずチーム／スクールに入る
    else S.screen = 'position';                                    // 入団後にポジション決定
    render();
    return;
  }
  const le = lifeDue();                                        // 前半戦・後半戦のピッチ外の出来事
  if(le){ S.current = le; S.screen = 'event'; render(); return; }
  // 分岐イベントの年は、バーが半分まで来たところで一時停止して選択させる
  if(S.age===S.evAge && S.firedAge!==S.age && S.progress>=.5){
    S.progress = .5; S.firedAge = S.age;
    S.current = nextEvent();
    prepareOffers(S.current);
    S.screen = 'event';
    render();
    return;
  }
  if(S.progress>=1){ S.progress = 0; yearEnd(); }
  updateClock();
  if(!raf && S.screen==='life' && !S.pendingEnd && !S.userPaused) raf = requestAnimationFrame(clockLoop);
}

// バーが100%になったら1歳加齢
function togglePause(){
  if(S.pendingEnd) return;
  S.userPaused = !S.userPaused;
  if(S.userPaused){ cancelAnimationFrame(raf); raf = null; }
  updateClock();
  clockStart();
}

function yearEnd(){
  const y0 = S.yen;
  S.natNow = false;
  const season = playSeason();
  worldCupYear();
  careerMarket(season);
  if(S.pendingEnd || S.age>=END_AGE) S.marketAsk = null;
  if(S.pendingEnd){                                          // ケガ・戦力外・引退でキャリアが終わった
    const last = S.log[S.log.length-1];
    if(last){ last.season = season; last.dm = S.yen - y0; }
    render(); return;
  }
  if(S.age>=END_AGE){
    S.pendingEnd = 'retired';
    S.log.push({age:S.age, kind:'year', text:`${END_AGE}歳のシーズン終了。静かにスパイクを脱いだ。`, fx:{}, season, dm:S.yen - y0});
    render(); return;
  }
  S.age++;
  ageClub();
  if(S.flags.proSigned){ const m = milestone(); if(m) toast(`${m.icon} ${m.head}`); }   // 昇格して5大リーグに届いたとき
  S.sBonus *= .8;
  recomputeSkill();
  seasonStart();
  lifeLater();
  planLife();
  // 移籍オファー・バロンドール・CL決勝がある年は、必ずイベントの年にする
  if(S.ss) S.ss.race = Math.random()<.75 ? raceType() : null;   // 昇格・残留争いのシーズン
  if((S.pendingOffer || (S.ballonNom && S.ballonNom.age===S.age) || (S.ss && (S.ss.clFinal || S.ss.race))) && S.evAge > S.age) S.evAge = S.age;
  const ch = chapterOf(S.age);
  const fx = {...YEAR_FX[ch]};
  const logAt = S.log.length;
  if(S.stats.x>0) fx.x = -2; // スキャンダルは時間とともに風化
  applyFx(fx);
  const hap = S.age>=6 && S.age!==S.evAge && Math.random()<HAP_RATE ? pickHappening() : null;
  if(S.age<=3 && storyBeat(S.age, fx)){
    // 0〜3歳はきっかけ物語
  } else if(hap){
    applyFx(hap.fx);
    S.usedHap.add(hap);
    if(hap.cat==='怪我') S.hurtAge = S.age;
    if(hap.flag) S.flags[hap.flag] = true;
    const hfx = {...fx}; for(const k in hap.fx) hfx[k] = (hfx[k]||0) + hap.fx[k];
    S.log.push({age:S.age, kind:'hap', cat:hap.cat, text:hap.text, fx:hfx});
    S.history.push({age:S.age, label:`⚡${hap.cat}`, text:hap.text, fx:hap.fx, impact:Object.values(hap.fx).reduce((a,v)=>a+Math.abs(v),0), success:null});
  } else {
    const ft = flavorPick(ch, season);
    S.log.push({age:S.age, kind:'year', text: ft || `${S.age}歳の1年が、静かに過ぎていった。`, fx});
  }
  if(S.log[logAt]) S.log[logAt].dm = S.yen - y0; // その年の資産の増減（円）
  if(S.log[logAt] && season) S.log[logAt].season = season;
  ultraCheck();
  if(S.age===S.body.stopAge) revealHeight();
  if(S.marketAsk && !S.pendingEnd && clubInfo(S.club)){ const m = marketEvent(); if(m){ S.current = m; S.screen = 'event'; } }
  if(S.stats.x>=100){ S.pendingEnd = 'banned'; S.log.push({age:S.age, kind:'year', text:'スキャンダルが限界を超え、サッカー界から永久追放された。', fx:{}}); }
  else if(S.age>=20 && S.stats.s<=0){ S.pendingEnd = 'released'; S.log.push({age:S.age, kind:'year', text:'スキルが尽き、クラブから戦力外通告を受けた。', fx:{}}); }
  render();
}

// きっかけ物語の1場面をログに流す
function storyBeat(age, baseFx){
  const b = S.origin.beats.find(b=>b.age===age);
  if(!b) return false;
  applyFx(b.fx);
  const fx = {...(baseFx||{})}; for(const k in b.fx) fx[k] = (fx[k]||0) + b.fx[k];
  S.log.push({age, kind:'story', text:b.text, fx});
  return true;
}

function endCareer(reason){
  S.endReason = reason;
  S.pendingEnd = null;
  finalizeCareer();
  S.screen = 'ending';
  render();
  showRetro();                                                // リザルトの前に、これまでの人生を振り返る
}

function nextEvent(){
  if(S.age===18) return proEvent();
  if(S.age>18){
    if(S.ballonNom && S.ballonNom.age===S.age) return ballonEvent();
    if(S.ss && S.ss.clFinal && !S.ss.clDone && clubInfo(S.club)) return clFinalEvent();
    const w = wcEvent(); if(w) return w;
    if(S.pendingOffer){ const o = offerEvent(); if(o) return o; }
    if(S.ss && S.ss.race && !S.ss.raceDone && clubInfo(S.club)) return raceEvent();
  }
  if(S.age===12){ const f = EVENTS.find(e=>e.id===(S.mode==='japan' ? 'c12_jp' : 'c12_scout')); if(f && !S.used.has(f.id)) return f; }
  const ok = e => !S.used.has(e.id) && !(e.noGK && S.pos==='GK') && (!e.req || e.req()) && (!e.club || S.pos) && (e.mode==='all'||e.mode===S.mode) && (!e.pos || e.pos.includes(S.pos)) && (!e.cg || e.cg.includes(cultureGroup())) && S.age>=e.min && S.age<=e.max;
  const pool = EVENTS.filter(ok);
  const mine = pool.filter(e=>e.pos && e.pos.length===1); // ポジション専用イベントは出やすく
  if(mine.length && Math.random()<.35) return pick(mine);
  const local = pool.filter(e=>e.cg); // 生まれた文化圏ならではのイベントも出やすく
  if(local.length && Math.random()<.35) return pick(local);
  const late = pool.filter(e=>e.late);
  if(late.length && Math.random()<.55) return pick(late);
  if(pool.length) return pick(pool);
  return S.age<15 ? GENERIC_CHILD : GENERIC;
}

function choose(i){
  const ev = S.current, c = ev.choices[i];
  let out = c, success = null;
  if(c.rolled!=null){ success = c.rolled; out = success ? c.win : c.lose; }
  else if(c.chance!=null){ success = Math.random() < c.chance; out = success ? c.win : c.lose; }
  const fx = out.fx || {};
  const y0 = S.yen;
  const gk = S.pos==='GK', otext = gk && out.gkText || out.text, clabel = gk && c.gkLabel || c.label;
  applyFx(fx);
  const lchg = ev.life ? applyLifeOut(out) : [];
  if(out.boot || c.boot) S.boot = {brand:S.bootBrand, tier:1, fee:0, until:S.age + 3};
  const wq = out.wcq ?? c.wcq;
  if(wq!=null) wcCycle(wcYearOf(S.age) + 1).bonus += wq;
  const tr = out.trophy || c.trophy;
  if(tr) addTrophy(tr, false);
  const fl = out.flag || c.flag;
  if(fl){ S.flags[fl] = true; if(fl==='wc') S.flags.capped = true; }
  let club = out.club || c.club;
  if(S.offer && S.offer[club]){
    const o = S.offer[club], cur = clubInfo(S.club);
    club = cur && cur.obj.name===o.name ? S.club : clubKey(o); // すでに同じクラブなら移籍しない
  }
  const moved = club && club!==S.club;
  if(moved){ const first = !S.flags.proSigned; setClub(club); onTransfer(); if(clubInfo(S.club)){ S.flags.proSigned = true; signCeleb(first); } }
  if(out.gkGoal && !S.flags.gkGoal){ S.flags.gkGoal = true; S.career.goals += 1; S.gkGoalAge = S.age; }
  const rk = out.rank;
  if(rk!=null && S.ss) S.ss.rank = Math.max(1, S.ss.rank + rk);
  if(out.scout){ const sc = findClub('up'); if(sc) S.pendingOffer = {club:sc, kind:'up'}; }
  const chg = [];
  if(moved) chg.push(`移籍：${N(club)}`);
  if(tr) chg.push(`獲得：${trophyLabel(tr)}`);
  if(rk) chg.push(rk<0 ? `クラブの順位が${-rk}つ上がりそう` : `クラブの順位が${rk}つ下がりそう`);
  if(out.scout && S.pendingOffer) chg.push('上のクラブのスカウトの目に留まった');
  if(out.end || c.end) chg.push('現役を退く');
  if(out.renew || c.renew){ S.contract = {club:S.club, floor:S.contract ? S.contract.floor : S.salary, until:S.age + contractYears()}; chg.push(`契約更新（${S.contract.until}歳まで）`); }
  chg.push(...lchg);
  const why = success===false ? ((gk && out.gkWhy) || out.why || (c.chance!=null ? `成功率${Math.round(c.chance*100)}%の賭けが外れた` : c.rolled!=null ? '結果は相手次第だった' : null))
    : (fx.x||0)>=5 || (fx.s||0)<0 || (fx.m||0)<0 ? (out.why || c.why || null) : null;
  if(!ev.life && !ev.market) S.evAge = nextEventAge(S.age);   // 去就の確認も、サッカーの分岐の予定は動かさない                 // ピッチ外の出来事は、サッカーの分岐の予定を動かさない
  if(S.age>=18){ const y = S.evYear[S.age] || (S.evYear[S.age] = {main:0, life:0}); ev.life ? y.life++ : y.main++; }
  if(ev.life) S.lifeN.events++;
  const impact = Object.values(fx).reduce((a,v)=>a+Math.abs(v),0);
  S.history.push({age:S.age, label:clabel, text:otext, fx, impact: ev.life ? impact*.6 : impact, success});
  if(!ev.generic) S.used.add(ev.id);
  S.eventNo++;
  S.log.push({age:S.age, kind:'event', label:clabel, text:otext, fx, dm: S.yen - y0, success, newClub: moved ? club : null, why, chg, lc: ev.life ? `${LIFE_CAT[ev.cat]} ・ ${ev.half}` : null});
  S.result = {fx};
  const end = c.end || out.end;
  if(end) S.pendingEnd = end;
  else if(S.stats.x>=100) S.pendingEnd = 'banned';
  else if(S.age>=20 && S.stats.s<=0) S.pendingEnd = 'released';
  if(ev.id==='join'){ S.joined = true; S.screen = 'position'; render(true); return; } // 入団したらそのままポジション選択へ
  const np = out.pos || c.pos;
  if(np==='pick' && !S.pendingEnd){ S.posChange = true; S.screen = 'position'; render(true); return; } // 新ポジションを選ばせる
  if(np && np!=='pick' && np!==S.pos) changePos(np, false);
  S.screen = 'life'; // 選択したら時間が再開
  render(true);
}

function getTitle(){ const t = TITLES.find(t=>t.c()); return {t:t.t, d:T(t.d)}; }
function getRank(){
  const {f,m,x} = S.stats, s = S.peakS || S.stats.s;
  const score = s*1.2 + f + m*0.8 - x*0.6 + (S.endReason==='banned'? -40 : 0);
  if(score>=200) return {r:'S', c:'#ffd34d'};
  if(score>=150) return {r:'A', c:'#c6ff3d'};
  if(score>=100) return {r:'B', c:'#3dd6ff'};
  if(score>=55)  return {r:'C', c:'#c9a8ff'};
  return {r:'D', c:'#ff3d6e'};
}

/* =========================================================
   シード付き乱数：同じ文字列からは毎回同じ乱数列を作る（W杯の開催国を、どのプレイヤーの世界でも共通にするために使う）
   ========================================================= */
function seedOf(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909);
  return (h ^= h>>>16) >>> 0;
}
function mulberry32(a){
  return ()=>{ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };
}
// fn の中の Math.random だけをシード付き乱数に差し替える
function withSeed(seed, fn){
  const orig = Math.random;
  Math.random = mulberry32(seed);
  try{ return fn(); } finally{ Math.random = orig; }
}

const HEIGHT_MEAN = {

  const erf = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - .284496736)*t + .254829592)*t*Math.exp(-z*z/2);
  return (z>=0 ? (1-erf)/2 : (1+erf)/2) * 100;
}

function rollTraits(c){
  const n = Math.sqrt(-2*Math.log(1-Math.random())) * Math.cos(2*Math.PI*Math.random());
  const mean = HEIGHT_MEAN[c.n], h = Math.round(mean + Math.max(-3.5, Math.min(3.5, n)) * HEIGHT_SD);
  const z = (h - mean) / HEIGHT_SD;
  // 身長は生まれた時点で決まっているが、伸びが止まる17〜18歳まで本人も知らない
  const body = {h, mean, z, stopAge:17 + (Math.random()<.5 ? 1 : 0), shown:false, label:BUILDS.find(b=>z<b.below).label, fx:BUILDS.find(b=>z<b.below).fx};

function playSeason(){

  S.form = Math.max(-1.8, Math.min(1.8, S.form + (S.rel.fam - 65)/300));   // 家庭が安定していると調子も安定する
  let share = .45 + (S.stats.s - need)/25 + (Math.random()-.5)*.4 + S.form*.15 + (S.rel.team - 50)/250;   // 監督・チームメイトとの関係も出場機会に響く
  if(S.age<=18) share -= .15; else if(S.age===19) share -= .08;   // 10代はまだ控えが多い
  if(S.talent.k==='physical') share += .05;
  const hurt = Math.random() < .1 * injMul();
  if(hurt){ share *= .3; S.hurtAge = S.age + 1; }

    S.history.push({age:S.age, label:'🩺 若い頃の不摂生のツケ', text:t, fx:{}, impact:8, success:null});
  }  // 長期離脱のシーズン（翌年まで包帯）
  const apps = Math.round(Math.max(0, Math.min(.92, share)) * 36);
  const rate = {FW:.45, MF:.13, DF:.035, GK:0}[S.pos] ?? .1;
  const tb = ['speed','leftfoot'].includes(S.talent.k) ? 1.15 : 1;
  const rel = Math.max(.3, Math.min(2.4, (.6 + (S.stats.s - need)/12) * (1 + .3*S.form)));   // 得点力はリーグ内での実力差で決まる（リーグ屈指なら年間25〜35点）

    cs = Math.round(apps * Math.max(.05, Math.min(.5, .22 + (S.stats.s - need)/60 + (S.form||0)*.05)));   // 無失点試合

      S.log.push({age:S.age, kind:'hap', cat:'GKのゴール', text:t, fx:{f:15}, ultra:true});
      S.history.push({age:S.age, label:'🧤 GKなのにヘディングで同点ゴール', text:t, fx:{f:15}, impact:30, success:null});
      applyFx({f:15});
    }
  }
  S.career.cs = (S.career.cs || 0) + cs;
  S.career.apps += apps; S.career.goals += goals;
  S.career.seasons.push({age:S.age, club:S.club, apps, goals, cs, p:ci.p});
  checkRecords(ci);
  updateBoots(ci, apps);
  const ss0 = S.ss && S.ss.club===S.club ? S.ss : (seasonStart(), S.ss);
  const money = payday(ci, apps, {title: !!ss0 && ss0.rank===1 && apps>=10, promo: !!ss0 && ci.tier===2 && ss0.rank<=2, cl: !!ss0 && ss0.cl});
  const won = [], out = {age:S.age, apps, goals, cs, gk:S.pos==='GK', won, pay:money.pay};
  const ss = S.ss && S.ss.club===S.club ? S.ss : (seasonStart(), S.ss);
  out.rank = ss.rank; out.cl = ss.cl;
  const lgTitle = ci.tier===2 ? `${ci.l2}優勝` : `${ci.country}1部リーグ優勝`;
  if(apps>=10 && ss.rank===1) won.push(lgTitle);
  else if(ss.rank===1) benchWin(ci.tier===2 ? 'promo' : 'league', lgTitle, apps);
  // 国内カップ戦：上位クラブほど勝ちやすい（1部の1クラブあたり年5%前後。毎年どこか1クラブが優勝する計算）
  const cupP = ci.tier===1 ? (ss.rank<=3 ? .2 : ss.rank<=6 ? .07 : .02) : .005;
  if(Math.random() < cupP){ const cup = `${ci.country}国内カップ優勝`; if(apps>=8) won.push(cup); else benchWin('cup', cup, apps); }
  if(ss.cl && ss.clWin && !ss.clDone && apps>=8){ won.push('@ucl'); ss.clDone = true; }   // CL決勝のイベントが出なかった年
  else if(ss.cl && ss.clWin && !ss.clDone){ ss.clDone = true; benchWin('ucl', `${N('ucl')}優勝`, apps); }
  if(S.pos==='FW' && ci.tier===1 && goals>=22 && Math.random()<.5) won.push(`${ci.country}1部 得点王`);

  const lgN = ci.tier===1 ? LEAGUES[ci.country].c.length : 0;
  if(ci.tier===2 && ss.rank<=2 && LEAGUES[ci.country].t2){ ci.obj.tier = 1; out.promo = true; }
  else if(ci.tier===1 && lgN>=10 && ss.rank > lgN-3 && LEAGUES[ci.country].t2){ ci.obj.tier = 2; out.releg = true; }

  else if(ss.race==='releg') storyLog(`最終節で残留を決めた。${N(S.club)}は来季も1部で戦う。`, 8);
  // 代表：層の厚い国ほど高いスキルが必要。クラブで試合に出ていること、2部ではほぼ呼ばれない、中東は目に留まりにくい
  const pw = WC_POWER[S.country.n] || .005;

  S.natNow = S.age>=19 && apps>=15 && margin>=0 && Math.random() < Math.min(.95, .3 + margin*.08) * (ci.tier===2 ? .08 : 1) * far;
  if(S.natNow && !S.flags.capped){ S.flags.capped = true; out.cap = true; }
  if(S.natNow){ const n = 2 + Math.floor(Math.random()*3); S.caps += n; out.caps = n; }
  if(hurt) out.hurt = true;
  // キャプテン：同じクラブで主力として長くプレーし、チームでも抜けた存在になると任される（移籍すると外れる）
  if(S.captain && S.captain!==S.club) S.captain = null;
  if(!S.captain && S.age>=25 && apps>=30 && S.stats.s >= need + 10 && S.stats.x<50 && S.rel.team>=50 && S.career.seasons.filter(z=>z.club===S.club).length>=3 && Math.random()<.07){

  }

  const mv = S.marketValue>0 ? S.marketValue*.35 + mvNow*.65 : mvNow;

const fmtPct = v => v>=10 ? v.toFixed(0) : v>=1 ? v.toFixed(1) : v>=.01 ? v.toFixed(2) : v.toFixed(4);
// 上半分は「上位○%」、下半分は「下位○%」（上位90% ＝ 下位10%）
const rankTxt = v => v<=50 ? `上位${fmtPct(v)}%` : `下位${fmtPct(Math.max(1, 100 - Math.min(100, v)))}%`;
// 何が「どれくらい珍しいか」は、プロ選手数（FIFA）と大会の登録枠から見積もる
function lifeRarity(score){
  const c = S.career, n = PRO_TOTAL;
  if(c.apps===0){
    const v = (S.clubs.includes('academy') || S.clubs.includes('jy') ? 2 : 30) * Math.max(.5, Math.min(1.5, 1.4 - score/200));
    return {v, scope:'世界のサッカー少年の中で', text:`${rankTxt(v)}の人生`};
  }
  const best = Math.min(
    hasTrophy('@ballon') ? 1/n*100 : 100,
    hasTrophy('@wc') ? 26/n*100 : 100,         // W杯優勝メンバー 26人
    hasTrophy('@ucl') ? .2 : 100,
    S.flags.wc ? 1248/n*100 : 100,             // W杯出場 48か国×26人
    ENDINGS.find(e=>e.k==='big5').c() ? 2600/n*100 : 100, // 五大リーグ 96クラブ×約27人
    S.flags.capped ? 3 : 100,
    S.trophies.some(t=>t.k.endsWith('1部リーグ優勝')) ? 6 : 100,
    S.career.seasons.some(z=>z.apps>0 && z.p>=60) ? 35 : 70,
  );
  const v = best * Math.max(.4, Math.min(1.6, 1.6 - score/250));
  return {v, scope:`プロ選手${fmt(n)}人の中で`, text:`${rankTxt(v)}の人生`};
}

  'ニューカッスル・ユナイテッド':450,'ナポリ':300,'ウェストハム・ユナイテッド':300,'ベンフィカ':190};

/* =========================================================
   図鑑：localStorage に保存（使えない環境でもゲームは止めない）
   ========================================================= */
const DEX_KEY = 'fls_dex_v1';
const emptyDex = () => ({plays:0, titles:{}, endings:{}, countries:{}});
function loadDex(){
  const d0 = emptyDex();
  try{
    const raw = localStorage.getItem(DEX_KEY);
    if(!raw) return d0;
    const d = JSON.parse(raw);
    if(!d || typeof d!=='object') return d0;
    for(const k of ['titles','endings','countries']) if(d[k] && typeof d[k]==='object' && !Array.isArray(d[k])) d0[k] = d[k];
    if(Number.isFinite(d.plays)) d0.plays = d.plays;
    return d0;
  }catch(err){ return d0; }
}
function saveDex(d){
  try{ localStorage.setItem(DEX_KEY, JSON.stringify(d)); return true; }catch(err){ return false; }
}
function storageOK(){
  try{ const k = '__fls_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }catch(err){ return false; }
}
// 今回の結果を図鑑に登録し、新しく埋まった項目を返す
function recordDex(){
  const d = loadDex(), F = S.final, n = S.country.n, fresh = [];
  d.plays++;
  if(!d.titles[F.title.t]) fresh.push(`称号「${F.title.t}」`);
  d.titles[F.title.t] = (d.titles[F.title.t]||0) + 1;
  F.endings.forEach(k=>{
    if(!d.endings[k]) fresh.push(ENDINGS.find(e=>e.k===k).t);
    d.endings[k] = (d.endings[k]||0) + 1;
  });
  const c = d.countries[n] && typeof d.countries[n]==='object' ? d.countries[n] : {plays:0, best:null};
  if(!c.plays) fresh.push(`${S.country.f} ${n}`);
  c.plays = (c.plays||0) + 1;
  if(!c.best || RANKS.indexOf(F.rank.r) < RANKS.indexOf(c.best)) c.best = F.rank.r;
  d.countries[n] = c;
  return saveDex(d) ? fresh : [];
}

/* =========================================================
   リザルトカード（Canvas 1200×630）
   ========================================================= */
function fitFont(x, text, maxW, size, weight, family){
  let s = size;
  do{ x.font = `${weight} ${s}px ${family}`; } while(x.measureText(text).width > maxW && (s -= 2) > 12);
  return s;
}
function wrapLines(x, text, maxW, maxLines){
  const out = []; let line = '';
  for(const ch of [...text]){
    if(x.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; if(out.length===maxLines) break; }
    else line += ch;
  }
  if(out.length<maxLines && line) out.push(line);
  if(out.length===maxLines && out.join('').length < [...text].length) out[maxLines-1] = out[maxLines-1].slice(0,-1) + '…';
  return out;
}
let cardJob = 0;
async function drawCard(){
  const job = ++cardJob, F = S.final;
  if(!F) return;
  try{
    await Promise.race([
      Promise.all(['400 64px "Dela Gothic One"','900 24px "Noto Sans JP"','700 22px "Noto Sans JP"'].map(f=>document.fonts.load(f))),
      new Promise(r=>setTimeout(r, 1500)),
    ]);
  }catch(err){}
  if(job!==cardJob) return;
  const W = 1200, H = 630, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const DISP = '"Dela Gothic One","Hiragino Sans",sans-serif', BODY = '"Noto Sans JP","Hiragino Sans",sans-serif';
  const acc = '#c6ff3d', muted = '#8a8f9a', gold = '#ffd34d';
  // 背景
  x.fillStyle = '#07080a'; x.fillRect(0,0,W,H);
  let g = x.createRadialGradient(140,-60,0,140,-60,760);

const cardFileName = () => `soccer-life-${new Date().toISOString().slice(0,10)}.png`;
// 公開URL（ローカルで開いているときは公開版のURLを使う）
const GAME_URL = 'https://keito-j.github.io/soccer-life-simulator/';
const gameURL = () => location.protocol.startsWith('http') ? location.href.split('#')[0] : GAME_URL;
// 画像付きで共有できる端末か（主にスマホ）
function canShareCard(data){
  try{ return !!(navigator.share && navigator.canShare && navigator.canShare(data)); }catch(e){ return false; }
}
// 共有シートを開く。キャンセルは何もしない。開けなかったら false
async function shareCardFile(text){
  const data = {files:[S.cardFile], text};
  if(!S.cardFile || !canShareCard(data)) return false;
  try{ await navigator.share(data); }
  catch(err){ if(err && err.name==='AbortError') return true; return false; }
  return true;
}
function saveCard(){
  const a = document.createElement('a');
  a.href = S.cardURL; a.download = cardFileName();
  document.body.appendChild(a); a.click(); a.remove();
}
async function shareCardImage(){
  if(!S.cardURL){ toast('画像を作成中です。少し待ってからもう一度どうぞ'); return; }
  if(await shareCardFile(`${shareText()}\n${gameURL()}`)) return;
  toast('この端末では画像を直接共有できません。保存してから投稿してください');
}
function shareText(){
  const F = S.final, name = S.player || '名無しのストライカー';
  const lines = [
    `⚽ ${S.country.f}${S.country.n}生まれ、${name}のサッカー人生`,
    `称号「${F.title.t}」ランク${F.rank.r}`,
    `通算${S.career.apps}試合${S.pos==='GK' ? `・無失点${S.career.cs||0}試合` : `${S.career.goals}得点`}／最高所属：${F.bestKey ? N(F.bestKey) : 'プロ未所属'}`,
    `タイトル：${titleSummary()}`,
    `${F.rarity.text}`,
    `「${F.epitaph}」`,
  ];
  const tags = '#2億5千万分の1 #サッカー人生シミュレーター';
  // X の文字数（日本語は1文字=2カウント、上限280）に収まるよう、長い行から削る
  const weight = s => [...s].reduce((a,ch)=>a + (ch.charCodeAt(0)>0x2000 ? 2 : 1), 0);
  for(const drop of [5, 3]){
    if(weight(lines.filter(Boolean).join('\n') + '\n\n' + tags) + 24 <= 280) break;
    lines[drop] = null;
  }
  return lines.filter(Boolean).join('\n') + '\n\n' + tags;
}

function moneyFx(m){
  if(!(S.income > 0)){
    if(m > 0){ const v = m * 1e4; S.yen += v; ledger('other', v); }
    else S.famYen = Math.max(0, S.famYen + m * Math.max(1e4, S.famYen * .01));

  }
  const inc = S.income / 40;
  const v = m > 0 ? m * inc : -Math.min(S.yen, -m * Math.max(inc, S.yen * .012));

      S.sBonus = Math.max(-5, Math.min(5, S.sBonus + fx.s*.3));

    else if(k==='form') S.form = Math.max(-1.8, Math.min(1.8, (S.form || 0) + fx.form*.15));
    else if(k==='team' || k==='fam') S.rel[k] = clamp(S.rel[k] + fx[k]);

const TAX_TOP = {'イングランド':.47,'スコットランド':.48,'アイルランド':.52,'スペイン':.47,'ポルトガル':.48,'フランス':.45,'ドイツ':.45,'オーストリア':.55,'スイス':.40,

const taxOf = (country, income) => { const top = TAX_TOP[country] ?? .35; return income<=0 ? 0 : Math.min(top, top * 1.3 * income / (income + 1e7)) * income; };

function ledger(k, v){ S.ledger[k] = (S.ledger[k] || 0) + v; }
// 1シーズンのお金：収入（年俸・出場/勝利ボーナス・スポンサー・スパイク契約）−税金−代理人手数料−生活費
function payday(ci, apps, res){
  res = res || {};
  const pay = salaryFor(ci, apps);
  const bonus = pay * (.15 * Math.min(1, apps/34) + (res.title ? .1 : 0) + (res.promo ? .1 : 0) + (res.cl ? .05 : 0));
  // 個人スポンサーは「知名度が高い」かつ「人の目に触れるリーグ・代表」の選手だけ。金額は年俸に比例（世界的スターで年俸と同程度）
  const vis = Math.max(0, Math.min(1.5, (ci.p - 60) / 60)) + (S.flags.capped ? .3 : 0);
  let spons = S.stats.f < 70 ? 0 : pay * Math.pow((S.stats.f - 70) / 30, 2) * vis;
  if(S.stats.f>=95 && BIG_CLUBS.has(ci.obj.name)) spons *= 2;
  const boot = S.boot ? S.boot.fee : 0;
  const gross = pay + bonus + spons + boot;
  const tax = taxOf(ci.country, gross), agent = pay*.05 + spons*.1;  // 代理人手数料：年俸の5%・スポンサー契約の10%
  const net = gross - tax - agent;
  // 生活費は手取りに応じて増える。ただし払える範囲まで（借金はしない＝足りない年は質素に暮らす）
  const living = Math.min(2.4e6 + net*.25, Math.max(0, net + S.yen));
  const ret = S.yen * .01;                                     // 預金・運用の利回り（年1%）
  S.yen = Math.max(0, S.yen + net - living + ret);
  S.income = gross;
  S.earned += pay;
  ledger('salary', pay); ledger('bonus', bonus); ledger('spons', spons); ledger('boot', boot);
  ledger('tax', tax); ledger('agent', agent); ledger('living', living); ledger('other', ret);
  S.stats.m = mOfYen(S.yen);
  return {pay, spons};
}

const BOOT_TIERS = ['なし', '用品提供', '有償契約', '大型契約', 'シグネチャー契約'];

// 今の立場で、メーカーが出してくれる契約の段階
function bootTierNow(ci, apps){
  const f = S.stats.f, pw = LEAGUE_POWER[ci.country] || 50;
  // シグネチャーモデルは世界でも一握り：バロンドール級か、ビッグクラブでCL・W杯を制したスター
  if(hasTrophy('@ballon') || (f>=98 && ci.p>=115 && apps>=25 && (hasTrophy('@ucl') || hasTrophy('@wc')))) return 4;
  if(ci.tier===1 && f>=80 && (pw>=88 || (S.flags.wc && pw>=72))) return 3;          // 五大リーグの有名選手・W杯に出た強豪リーグの選手
  if(apps>=15 && ((ci.tier===1 && pw>=72) || S.flags.capped)) return 2;              // 強いリーグのレギュラー・代表
  if(apps>=25 && ci.tier===1 && ci.country===S.country.n && f>=55) return 2;         // 自国リーグの人気選手（国内メーカーなど）

// 年間の契約金（円・概算）。プレミアリーグの一般的なレギュラーで数千万円、世界的スターで数十億円
function bootFee(t, ci){
  const f = S.stats.f, pw = LEAGUE_POWER[ci.country] || 50, r = .8 + Math.random()*.4;
  // 契約金は年俸に比例：有償契約は年俸の5〜15%、大型契約は30〜60%、シグネチャー契約は年俸と同程度
  const pay = Math.max(S.salary || 0, 3e6);
  if(t===2) return Math.round(Math.min((pw>=88 ? 2.5e7 : pw>=72 ? 8e6 : 3e6) * (.6 + f/100), pay * .15) * r);
  if(t===3) return Math.round(pay * (.3 + .3 * Math.min(1, (f - 80)/20)) * r);
  if(t===4) return Math.round(pay * (.8 + .7 * Math.min(1, (f - 95)/5)) * r);

}
function bootLog(text, big){

// 毎シーズン、契約の新規・格上げ・更新・満了を判定する
function updateBoots(ci, apps){
  if(S.age>=END_AGE) return; // 引退する年は契約の話をしない
  const t = bootTierNow(ci, apps), b = S.boot;
  const fee = n => n ? `年${fmtYen(n)}` : '契約金なし';
  if(!b){
    if(!t) return;
    const brand = S.bootBrand;
    S.boot = {brand, tier:t, fee:bootFee(t, ci), until:Math.min(END_AGE, S.age + 2 + Math.floor(Math.random()*3))};
    bootLog(t===1
      ? `${N(brand)}とスパイクの用品提供契約を結んだ。契約金はないが、もう自腹でスパイクを買わなくていい（契約は${S.boot.until}歳まで）。`
      : `${N(brand)}と初めてのスパイク契約を結んだ。${BOOT_TIERS[t]}で${fee(S.boot.fee)}（${S.boot.until}歳まで）。`, 6);
    return;
  }
  if(t > b.tier){                                           // 活躍したら契約途中でも格上げ
    const old = b.fee;
    b.tier = t; b.fee = bootFee(t, ci); b.until = Math.min(END_AGE, S.age + 3);
    bootLog(`${N(b.brand)}が契約を${BOOT_TIERS[t]}に格上げした。${fee(old)} → ${fee(b.fee)}（${b.until}歳まで）。`, t>=3 ? 10 : 4);
    return;
  }
  if(S.age < b.until) return;
  if(!t){
    bootLog(`${N(b.brand)}とのスパイク契約が満了。更新の話はなかった。また自分でスパイクを買う日々だ。`);
    S.boot = null;
    return;
  }
  const old = b.fee, nf = bootFee(t, ci);
  if(t>=2 && Math.random()<.2){                             // より高い条件を出したライバル社へ乗り換え
    const nb = pickBrand(b.brand), up = Math.round(nf*1.3);
    bootLog(`${N(b.brand)}との契約が満了し、より高い条件を出した${N(nb)}に乗り換えた。${BOOT_TIERS[t]}で${fee(up)}。`, 4);
    S.boot = {brand:nb, tier:t, fee:up, until:Math.min(END_AGE, S.age + 3)};
    return;
  }
  b.until = Math.min(END_AGE, S.age + 2 + Math.floor(Math.random()*3));
  bootLog(t===1 && b.tier===1 ? `${N(b.brand)}からの用品提供が続くことになった（${b.until}歳まで）。`
    : t < b.tier
    ? `${N(b.brand)}との契約を更新したが、${BOOT_TIERS[t]}に格下げされた。${fee(old)} → ${fee(nf)}。`
    : `${N(b.brand)}とのスパイク契約を更新した（${BOOT_TIERS[t]}）。${fee(old)} → ${fee(nf)}（${b.until}歳まで）。`);
  b.tier = t; b.fee = nf;
}

/* =========================================================

   ・年俸：シーズン終了時に計算し直す。移籍した瞬間にも、移籍先の水準で結び直す
   ・市場価値：リーグの基準額 × 活躍度 × 年齢 × タイトル。前年の値と混ぜて急変を抑える
   ・サウジ：年俸は移籍時に3〜5倍で保証されるが、市場価値は下がり、伸びも鈍る（代表にも選ばれにくい）
   ========================================================= */
const YEN_PER_EUR = 160;
const MIDEAST = new Set(['サウジアラビア']);
// その選手の今の実力で、そのクラブが払う年俸（ランダムな揺れ込み）
function salaryFor(ci, apps){
  const [a1, a2] = SALARY[ci.country] || [1e7, 2e6];
  const need = 35 + ci.p*.5;
  let pay = (ci.tier===2 ? a2 : a1) * clubPay(ci.obj);
  pay *= Math.max(.3, Math.min(1.6, Math.pow(2, (S.stats.s - need - 8) / 10))); // 実力（リーグ平均的なレギュラーで1倍、チームの稼ぎ頭でも1.6倍まで）
  pay *= apps>=25 ? 1.15 : apps>=12 ? 1 : .75;                                // 出場機会
  if(S.stats.f>=85) pay *= 1 + (S.stats.f - 85) / 10;                         // スター選手の上乗せ
  if(S.age<=19) pay *= .35; else if(S.age<=21) pay *= .65;                    // 若手契約
  pay *= Math.exp((Math.random() - .5) * .4);
  // 契約中は、結んだときの額が最低保証（サウジの大型契約など）
  if(S.contract && S.contract.club===S.club) pay = Math.max(pay, S.contract.floor);
  return Math.min(pay, 1.2e10);
}

const mvBase = ci => 15e6 * Math.exp(.086 * ((LEAGUE_POWER[ci.country] || 50) - 100));
function marketValueFor(ci, apps, goals, won){
  const need = 35 + ci.p*.5;
  let v = mvBase(ci) * YEN_PER_EUR;
  if(ci.tier===2) v *= .15;
  if(BIG_CLUBS.has(ci.obj.name)) v *= 5;     // ビッグクラブの主力は数千万〜1億€超
  else if(ci.tier===1 && !BIG5.has(ci.country) && LEAGUES[ci.country].c.indexOf(ci.obj.name)<3) v *= 2;
  v *= Math.max(.2, Math.min(1.8, Math.pow(2, (S.stats.s - need - 8) / 8)));  // 実力（リーグ屈指の選手でも1.8倍まで）
  v *= .3 + .7 * Math.min(1, apps/30);                                      // 出場機会
  if(S.pos==='FW' || S.pos==='MF') v *= 1 + goals/40;                       // 得点
  // 年齢：若手は将来性で高く、30代は下がっていく（主力として活躍していれば下げ幅は小さい）
  const a = S.age;
  let age = a<=21 ? 1.25 : a<=27 ? 1.1 : a<=29 ? .85 : a===30 ? .65 : a===31 ? .5 : a===32 ? .38 : .28 * Math.pow(.8, a-33);
  if(a>=30 && apps>=28 && S.stats.s - need >= 10) age *= 1.4;
  v *= age;
  v *= 1 + .15 * won.length;
  if(S.flags.capped) v *= 1.1;
  if(hasTrophy('@ballon')) v *= 1.5;
  if(MIDEAST.has(ci.country)) v *= .55;                                     // 中東は稼げるが、選手としての評価は伸びない
  return Math.min(v, 2e10);                                                 // 上限は史上最高額クラス（約1.2億€）
}

// [直接出場, 大陸間プレーオフ出場枠]（プレーオフは6チームで2枠）

const hostMemo = {};
function wcHosts(y){
  if(WC_KNOWN_HOSTS[y]) return WC_KNOWN_HOSTS[y];
  if(hostMemo[y]) return hostMemo[y];
  const banned = new Set([...wcHosts(y-4), ...wcHosts(y-8)].map(t=>CONF_OF[t]));
  return hostMemo[y] = withSeed(seedOf('wc-host-' + y), ()=>wpick(WC_HOST_BIDS.filter(b=>!banned.has(b[0])).map(b=>[b[1], b[2]])));
}
const wcYearOf = age => S.birthYear + age;

// 予選を1回シミュレーションして、母国が出場できたかを返す（bonus は本人の活躍による上乗せ）
function runQualifying(y, home, bonus){
  const hosts = wcHosts(y), q = new Set(hosts), po = [];
  const gauss = () => Math.sqrt(-2*Math.log(1-Math.random())) * Math.cos(2*Math.PI*Math.random());
  for(const c in WC_TEAMS){
    const [direct, nplay] = WC_SLOTS[c];
    const used = hosts.filter(h=>CONF_OF[h]===c).length;           // 開催国は自分の大陸の枠を使う
    const sc = Object.entries(WC_TEAMS[c]).filter(([t])=>!q.has(t))
      .map(([t,r])=>[r + (t===home ? bonus : 0) + gauss()*WC_SD, t]).sort((a,b)=>b[0]-a[0]);
    const take = Math.max(0, direct - used);
    sc.slice(0, take).forEach(([,t])=>q.add(t));
    sc.slice(take, take + nplay).forEach(([,t])=>po.push([WC_TEAMS[c][t] + gauss()*WC_SD, t]));
  }
  po.sort((a,b)=>b[0]-a[0]).slice(0, 2).forEach(([,t])=>q.add(t));  // 大陸間プレーオフ（6チームで2枠）
  return q.has(home);
}
function wcCycle(y){

}
// 代表戦の相手（同じ大陸で実力の近い国）
function wcRival(){
  const c = CONF_OF[S.country.n], me = WC_TEAMS[c][S.country.n];
  const near = Object.entries(WC_TEAMS[c]).filter(([t])=>t!==S.country.n).sort((a,b)=>Math.abs(a[1]-me)-Math.abs(b[1]-me)).slice(0,4);
  return pick(near)[0];
}
const WC_STAGES = ['グループリーグ敗退','ラウンド32で敗退','ベスト16','ベスト8','ベスト4','準優勝'];
// 毎年の終わりに呼ぶ：予選の出場、予選の結果とメンバー発表、本大会
function worldCupYear(){
  const a = S.age, y = wcYearOf(a);
  const next = [y, y+1, y+2].find(isWcYear);        // 予選期間なら、その先の大会
  const host = () => wcHosts(next).includes(S.country.n);
  const wc = N('worldcup'), me = S.country.n;

  };
  if(next && next>y && a>=18){                       // 予選期間（大会の2年前・1年前）
    const cyc = wcCycle(next);
    if(host()){
      if(next===y+1) log(`${me}は${wc}${next}の開催国。予選は免除され、自動で出場が決まっている。`);
    } else if(S.natNow){
      const n = 3 + Math.floor(Math.random()*4);
      cyc.played += n;
      S.caps += n;
      log(`${wc}${next}・${CONF_LABEL[CONF_OF[me]]}予選を${n}試合戦った。`);
    }
    if(next===y+1){                                  // 予選が終わる年：結果とメンバー発表
      cyc.qualified = host() || runQualifying(next, me, cyc.bonus);
      if(!host()) log(cyc.qualified
        ? `${me}が${wc}${next}への出場を決めた！（${CONF_LABEL[CONF_OF[me]]}の出場枠は${WC_SLOTS[CONF_OF[me]][0]}${WC_SLOTS[CONF_OF[me]][1] ? `＋大陸間プレーオフ${WC_SLOTS[CONF_OF[me]][1]}` : ''}）`
        : `${me}は${wc}${next}の予選で敗退した。`, cyc.played && !cyc.qualified ? 8 : 0);
      if(cyc.qualified && a>=19 && next - S.birthYear <= END_AGE){ // 引退後の大会はメンバー発表なし
        // 本大会メンバー（26人）入り：代表の主力ならほぼ確実、そうでなければ少しだけ望みがある
        // 本大会の26人は、代表の中でも実力上位から選ばれる
        cyc.selected = S.natNow ? Math.random() < Math.min(.9, 0.0 + (S.stats.s - natNeed())*.04) : (S.flags.capped && S.stats.s >= natNeed()-4 && Math.random()<.05);
        if(cyc.selected) log(`${wc}${next}の本大会メンバー26人に選ばれた！`, 10);
        else if(S.flags.capped) log(`${wc}${next}のメンバー発表。そこに自分の名前はなかった。`, 6);
      }

    const cyc = wcCycle(y);
    if(cyc.qualified===undefined) cyc.qualified = host() || runQualifying(y, me, 0);

      const n = cyc.stage==='優勝' || cyc.stage==='準優勝' ? 8 : 3 + WC_STAGES.indexOf(cyc.stage);
      S.caps += n;
      log(`${wc}${y}${where}に出場。${n}試合に出て、${me}は${cyc.stage==='優勝' ? '優勝した！' : cyc.stage + '。'}`, cyc.stage==='優勝' ? 0 : 8);

function rollLook(c){
  const mix = SKIN_BY_COUNTRY[c.n] || {b:1};
  const prof = wpick(Object.entries(mix));
  const skin = wpick(SKIN_MIX[prof].map((w,i)=>[i, w]).filter(([,w])=>w>0));
  const hair = wpick(HAIR_MIX[HAIR_BY_COUNTRY[c.n] || 'nceu'].map((w,i)=>[i, w]).filter(([,w])=>w>0));
  // 子どもの頃は今より明るい髪だった人もいて、成長とともに暗くなる
  const lighter = {2:[3,.3], 3:[4,.4], 1:[2,.15]}[hair];
  const childHair = lighter && Math.random()<lighter[1] ? lighter[0] : hair;
  return {
    skin, hair, childHair, darkenAge: 7 + Math.floor(Math.random()*9),
    grayAge: Math.random()<.4 ? 32 + Math.floor(Math.random()*4) : null,     // ベテランで白髪になる人

    casual: pick(['#e9edf2','#f2d16b','#7fb3e6','#e97b6f','#8fd19e','#c9a8ff']),
  };
}

   ========================================================= */
const avatarStage = a => a<=4 ? 'baby' : a<=12 ? 'kid' : a<=21 ? 'youth' : a<=31 ? 'prime' : 'vet';
const isLight = hex => { const n = parseInt(hex.slice(1), 16); return ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114) / 1000 > 170; };
// 代表として戦っている場面か
function inNationalKit(){
  if(S.screen==='event' && S.current && /^wc/.test(S.current.id)) return true;
  const y = wcYearOf(S.age), cyc = S.wc && S.wc[y];
  return !!(isWcYear(y) && cyc && cyc.selected);
}
function avatarState(final){
  const a = S.age, L = S.look;
  const st = {stage:avatarStage(a), skin:SKIN_TONES[L.skin]};
  const hairIdx = a < L.darkenAge ? L.childHair : L.hair;
  st.gray = st.stage==='vet' && L.grayAge!=null && a>=L.grayAge;
  st.bald = st.stage==='vet' && L.baldAge!=null && a>=L.baldAge;
  st.hair = st.gray ? '#c9c9cc' : HAIR_COLORS[hairIdx];
  st.gk = S.pos==='GK' && st.stage!=='baby';
  if(st.stage==='baby' || S.club==='home') st.kit = [L.casual, '#ffffff'];
  else if(!final && inNationalKit()) st.kit = NAT_COLORS[S.country.n] || ['#ffffff','#111111'];
  else st.kit = clubKit(S.club);
  if(st.gk){                                                  // GKはフィールドの選手と違う色
    const gkc = ['#2ecc71','#f1c40f','#1f1f1f','#e67e22','#9b59b6'].find(c=>c!==st.kit[0]);
    st.kit = [gkc, '#111111'];
  }
  st.captain = !final && !!S.captain && S.captain===S.club;
  st.bandage = !final && S.hurtAge===a;
  st.trophy = final ? S.trophies.length>0 : S.trophies.some(t=>t.age===a || t.age===a-1);
  return st;
}
function drawAvatar(x, st){
  const P = (px, py, w, h, c) => { x.fillStyle = c; x.fillRect(px, py, w, h); };
  x.clearRect(0, 0, 32, 32);
  const [k1, k2, pat] = st.kit, eye = '#1d1d22', shade = 'rgba(0,0,0,.18)';
  P(8, 30, 16, 1, 'rgba(0,0,0,.28)');                        // 足元の影
  const head = (hx, hy, w, h) => {
    P(hx, hy, w, h, st.skin);
    P(hx-1, hy+3, 1, 2, st.skin); P(hx+w, hy+3, 1, 2, st.skin);  // 耳
    P(hx+2, hy+4, 1, 1, eye); P(hx+w-3, hy+4, 1, 1, eye);       // 目
    P(hx+3, hy+6, w-6, 1, shade);                               // 口
    if(!st.bald){ P(hx, hy-1, w, 2, st.hair); P(hx-1, hy, 1, 3, st.hair); P(hx+w, hy, 1, 3, st.hair); }
    else { P(hx-1, hy+1, 1, 3, st.hair); P(hx+w, hy+1, 1, 3, st.hair); }  // 薄毛：横だけ残る
    if(st.bandage){ P(hx, hy+2, w, 1, '#f4f4f4'); P(hx+1, hy+2, 1, 1, '#e0445a'); }
  };
  if(st.stage==='baby'){
    head(11, 11, 10, 9);
    P(12, 21, 8, 6, k1); P(14, 21, 4, 1, k2);                   // ロンパース
    P(10, 22, 2, 3, st.skin); P(20, 22, 2, 3, st.skin);
    P(12, 27, 3, 2, st.skin); P(17, 27, 3, 2, st.skin);
    P(23, 26, 3, 3, '#ffffff'); P(24, 27, 1, 1, '#333');        // 小さなボール
    return;
  }
  const L = {kid:{hy:9, ty:17, th:5, sh:2, lh:2, tx:11, tw:10}, youth:{hy:5, ty:14, th:6, sh:3, lh:2, tx:10, tw:12},
             prime:{hy:3, ty:12, th:7, sh:3, lh:3, tx:10, tw:12}, vet:{hy:3, ty:12, th:7, sh:3, lh:3, tx:10, tw:12}}[st.stage];
  const {hy, ty, th, sh, lh, tx, tw} = L, hx = tx + (tw - 8)/2;
  head(hx, hy, 8, 8);
  P(hx+3, hy+8, 2, ty-hy-8, st.skin);                         // 首
  // シャツ（柄）
  for(let yy=ty; yy<ty+th; yy++) for(let xx=tx; xx<tx+tw; xx++){
    const i = xx - tx, j = yy - ty;
    const alt = pat==='stripes' ? (i>>1)%2===1 : pat==='hoops' ? (j>>1)%2===1 : pat==='halves' ? i>=tw/2
      : pat==='sash' ? Math.abs((tw-1-i) - j*tw/th) < 1.6 : pat==='band' ? Math.abs(i - (tw-1)/2) < 1.6 : pat==='checks' ? ((i>>1)+(j>>1))%2===1 : false;
    P(xx, yy, 1, 1, alt ? k2 : k1);
  }
  if(!pat || pat==='sleeves') P(tx + tw/2 - 1, ty, 2, 1, k2);  // 襟
  const sleeve = pat==='sleeves' ? k2 : k1;
  for(const ax of [tx-2, tx+tw]){
    if(st.raise){                                             // 両手を突き上げる（お祝い用）
      P(ax, ty-1, 2, 2, sleeve); P(ax, ty-th+1, 2, th-2, st.skin);
      if(st.gk) P(ax-(ax<tx ? 1 : 0), ty-th-1, 3, 3, '#f4f7b0'); else P(ax, ty-th, 2, 1, st.skin);
      continue;
    }
    P(ax, ty, 2, 3, sleeve);
    P(ax, ty+3, 2, th-3, st.skin);
    if(st.gk) P(ax-(ax<tx ? 1 : 0), ty+th-1, 3, 3, '#f4f7b0'); // GKグローブ
    else P(ax, ty+th, 2, 1, st.skin);
  }
  if(st.captain && st.raise) P(tx+tw-2, ty+1, 2, 1, isLight(k1) ? '#d7263d' : '#ffd34d');
  else if(st.captain) P(tx+tw, ty+2, 2, 1, isLight(sleeve) ? '#d7263d' : '#ffd34d'); // キャプテンマーク
  const shorts = isLight(k1) && isLight(k2) ? '#1b1b1f' : k2;
  P(tx+1, ty+th, tw-2, sh, shorts);
  const legY = ty + th + sh, lx1 = tx + 2, lx2 = tx + tw - 5;
  for(const lx of [lx1, lx2]){
    P(lx, legY, 3, lh, st.skin);
    P(lx, legY+lh, 3, 28-legY-lh, st.gk ? '#1b1b1f' : k1);    // ソックス
    P(lx-(lx===lx1 ? 1 : 0), 28, 4, 2, '#151515');             // スパイク
  }
  if(st.trophy){                                              // 優勝トロフィー
    const g = '#f2c94c', gy = ty - 1;
    P(24, gy, 5, 1, g); P(24, gy+1, 5, 2, g); P(23, gy+1, 1, 1, g); P(29, gy+1, 1, 1, g);
    P(25, gy+3, 3, 1, g); P(26, gy+4, 1, 2, g); P(25, gy+6, 3, 1, '#c79a2b');
  } else if(!st.gk && !st.noBall){
    P(24, 27, 3, 3, '#ffffff'); P(25, 28, 1, 1, '#333');       // ボール
  }
}

/* =========================================================
   能力：才能の上限（ポテンシャル）と、年齢による成長・衰え
   ・ポテンシャルは生まれつき。上位ほど裾の長い対数正規分布で、「上位約2%が五大リーグ水準、上位約0.3%がビッグクラブ水準」になるよう設定
     （プロ選手128,694人のうち五大リーグ約2,600人＝2.0%、ビッグクラブ16×約27人＝約0.34%）
   ・スキル = ポテンシャル × 年齢カーブ + 直近の調子（イベントの効果。年々薄れる）
   ・全盛期はポジションで違う：FW約25歳・MF約26歳・DF約27歳（Dendir 2016 ほか）、GKはさらに遅い
   ========================================================= */
const POT_MU = 0.8, POT_SIG = 1.03;
const PEAK_AGE = {FW:25, MF:26, DF:27, GK:29};
function rollPotential(talent){
  let p;
  do{ p = 50 + Math.exp(POT_MU + POT_SIG * Math.sqrt(-2*Math.log(1-Math.random())) * Math.cos(2*Math.PI*Math.random())); } while(p > 97);
  return Math.min(99, p + ({prodigy:6, grit:1}[talent.k] ?? 1.5));
}
function skillCurve(a, peak){
  if(a < 5) return .2 + .03*a;
  if(a <= peak) return .35 + .65 * Math.pow((a - 5) / (peak - 5), .5);  // 18歳で全盛期の約85〜88%
  const d = a - peak;
  return Math.max(.3, 1 - .008*d - .003*d*d);               // 全盛期を過ぎると年々加速して落ちる（5年後に約89%、8年後に約74%）
}
function recomputeSkill(){
  const peak = PEAK_AGE[S.pos] ?? 26;
  S.stats.s = clamp(Math.round(S.pot * skillCurve(S.age, peak) + S.sBonus - Math.max(0, S.age - peak) * (S.risk ? S.risk.decl : 0)));
  S.peakS = Math.max(S.peakS || 0, S.stats.s);
}
const needOf = p => 35 + p*.5;                               // そのクラブでレギュラーを張るのに必要なスキル

const TITLE_W = {

  'ボカ・ジュニアーズ':5,'リーベル・プレート':4,'ベレス・サルスフィエルド':3,'ラシン・クラブ':2,'エストゥディアンテス':2,'サン・ロレンソ':2,'ラヌース':1,'バンフィールド':1,'ニューウェルズ・オールドボーイズ':1,
};
const TITLE_LEAGUES = new Set(['イングランド','スペイン','ドイツ','イタリア','フランス','ポルトガル','オランダ','ベルギー','スコットランド','トルコ','サウジアラビア','日本','ブラジル','アルゼンチン']);
// 毎年のように優勝クラブが変わる、戦力が拮抗したリーグ
const FLAT_LEAGUES = new Set(['アメリカ','カナダ','メキシコ','韓国','中国','オーストラリア','コロンビア','エクアドル','チリ','ペルー','ボリビア','パラグアイ','ベネズエラ']);
function titleWeight(country, name, idx){
  if(TITLE_W[name]!=null) return TITLE_W[name];
  if(TITLE_LEAGUES.has(country)) return country==='日本' || country==='ブラジル' || country==='アルゼンチン' ? .4 : .12;
  if(FLAT_LEAGUES.has(country)) return idx<6 ? 2 : 1;
  return [10,6,3,1.5,1][idx] ?? .5;                         // 名簿の先頭が伝統の強豪（名門が優勝を独占しがち）
}
const gumbel = () => -Math.log(-Math.log(Math.random() || 1e-9));
// 今季の順位（1部は重み付き、2部以下は横並び）
function rollRank(c){
  if(c.tier===2){ const n = Math.min(24, LEAGUES[c.country].t2 || 20); return 1 + Math.floor(Math.random()*n); }
  const names = LEAGUES[c.country].c.slice();
  if(!names.includes(c.name)) names[names.length-1] = c.name;  // 昇格してきたクラブ
  const sc = names.map((nm,i)=>[Math.log(titleWeight(c.country, nm, i)) + gumbel(), nm]).sort((a,b)=>b[0]-a[0]);
  return sc.findIndex(([,nm])=>nm===c.name) + 1;
}
// CL本大会の出場枠（リーグ順位で直接出場できる数。2024/25〜の方式の概算）。ここにない欧州のリーグは優勝クラブが予選を勝ち抜けば出場
const CL_SLOTS = {'イングランド':5,'スペイン':4,'ドイツ':4,'イタリア':4,'フランス':3,'ポルトガル':2,'オランダ':2,'ベルギー':1,'スコットランド':1,'トルコ':1,'オーストリア':1,'チェコ':1};
// 出場したシーズンにCLで優勝する確率（直近20大会の優勝回数 ÷ 20 の概算）
const CL_WIN = {'レアル・マドリード':.35,'FCバルセロナ':.2,'バイエルン・ミュンヘン':.1,'チェルシー':.1,'リヴァプール':.05,'マンチェスター・シティ':.05,
  'インテル':.05,'ACミラン':.05,'マンチェスター・ユナイテッド':.05,'パリ・サンジェルマン':.05,'アトレティコ・マドリード':.02,'ユヴェントス':.02,'ボルシア・ドルトムント':.02,'アーセナル':.02,'トッテナム・ホットスパー':.01,'ポルト':.01};
// シーズン開始時に、今季の順位・CL出場・CL決勝進出を決めておく（イベントの発生条件に使う）
function seasonStart(){
  const ci = clubInfo(S.club);
  if(!ci || S.age<18){ S.ss = null; return; }
  const c = ci.obj;
  const prev = S.ss && S.ss.club===S.club ? S.ss.rank : rollRank(c);
  const cl = EURO.has(c.country) && c.tier===1 && (prev <= (CL_SLOTS[c.country] || 0) || (prev===1 && Math.random() < ((LEAGUE_POWER[c.country]||50)>=60 ? .35 : .15)));
  const pw = CL_WIN[c.name] ?? (BIG5.has(c.country) ? .006 : .002);
  const clFinal = cl && Math.random() < Math.min(.9, pw*2);
  S.ss = {club:S.club, rank:rollRank(c), prev, cl, clFinal, clWin: clFinal && Math.random()<.5, clDone:false};
}

/* =========================================================
   代表：所属リーグのレベルと、クラブでの活躍で決まる。層の厚い国ほど狭き門
   ========================================================= */
const NAT_BASE = 61;
const natNeed = () => NAT_BASE + (WC_POWER[S.country.n] || .005) * 130;

/* =========================================================
   移籍市場：活躍すれば1〜2段階上から、出られなければ同格以下から声がかかる
   ・まず同じ国の上位クラブ、次に近隣国（その国から選手がよく移る先）のクラブ
   ・契約満了時、戦力として見られていなければ更新されない（戦力外）
   ========================================================= */
function candidateClubs(ci){
  const out = [], seen = new Set([ci.obj.name]);
  const add = (country, w, tier2) => {
    const lg = LEAGUES[country]; if(!lg) return;
    lg.c.forEach(nm=>{ if(!seen.has(nm)){ seen.add(nm); out.push({name:nm, country, tier:1, w}); } });
    if(tier2 && LEAGUE2[country]) LEAGUE2[country].slice().sort(()=>Math.random()-.5).slice(0,8).forEach(nm=>{ if(!seen.has(nm)){ seen.add(nm); out.push({name:nm, country, tier:2, w}); } });
  };
  add(ci.country, 3, true);
  if(ci.country!==S.country.n) add(S.country.n, 1.5, true);
  const routes = {...((CAREER_ROUTES[ci.country]||{}).to || {}), ...((CAREER_ROUTES[S.country.n]||{}).to || {})};
  Object.entries(routes).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([c])=>add(c, 1, false));
  if(S.stats.s >= 75) BIG5.forEach(c=>add(c, .8, false));   // 五大リーグのスカウト網に入る水準
  return out;
}
function findClub(dir){
  const ci = clubInfo(S.club), s = S.stats.s, cur = needOf(ci.p);
  const ok = c => { const n = needOf(clubPrestige(c));
    return dir==='up' ? n >= cur + 2 && n <= cur + (s - cur >= 10 ? 22 : 14) && n <= s + 3   // 圧倒的な活躍なら2段階以上の飛び級も
      : dir==='side' ? n <= s - 2 && n >= cur - 12
      : n <= s + 1 && n >= s - 25; };
  const pool = candidateClubs(ci).filter(ok);
  if(!pool.length) return null;
  const c = wpick(pool.map(c=>[c, c.w * Math.exp(-Math.abs(needOf(clubPrestige(c)) - (s - 4)) / 5)]));
  return {name:c.name, country:c.country, tier:c.tier};
}
const contractYears = () => S.age<24 ? 2 + Math.floor(Math.random()*3) : S.age<29 ? 2 + Math.floor(Math.random()*2) : 1 + Math.floor(Math.random()*2);

// シーズン終了時：引退・契約更新・戦力外・移籍オファー
function careerMarket(z){
  const ci = clubInfo(S.club);
  if(!ci || !z || S.pendingEnd) return;
  const perf = S.stats.s - needOf(ci.p) + (S.form||0)*3 + (S.rel.team - 50)/15, a = S.age;
  // ビッグクラブ・五大リーグの選手ほど、自分から出ていく理由が少ない
  const stay = BIG_CLUBS.has(ci.obj.name) ? .15 : ci.tier===1 && BIG5.has(ci.country) ? .6 : 1;
  if(z.hurt && Math.random() < (a>=30 ? .2 : .04)){
    S.pendingEnd = 'injury'; marketLog(`${a}歳。大ケガからの復帰を目指したが、医師から現役続行は難しいと告げられた。`); return;
  }
  // 年俸が生活を支えられない下位リーグの選手は、別の道を選ぶことがある
  if(a>=22 && S.salary < 4e6 && Math.random() < (z.apps<10 ? 0.03*2.5 : 0.03)){
    S.pendingEnd = 'quit'; marketLog(`${a}歳。サッカーだけでは生活が成り立たず、スパイクを置いて別の仕事に就くことにした。`); return;
  }
  if(a>=30 && Math.random() < .03 + (a-30)*.05 + (perf < -4 ? .2 : 0)){
    S.pendingEnd = 'retired'; marketLog(`${a}歳。体が限界を告げていた。シーズン最終戦のあと、引退を発表した。`); return;
  }
  if(!S.contract || S.contract.club!==S.club) S.contract = {club:S.club, floor:0, until:a + 1};
  if(a >= S.contract.until){
    if(z.apps >= 6 && perf > -9){          // 控えでも戦力と見られていれば更新される
      const c = Math.random()<0.9*stay ? findClub(perf>=4 ? 'up' : 'side') : null;     // 契約満了で、移籍金なしで新天地へ
      if(c){ S.marketAsk = {club:c, kind:'free'}; return; }      // 残るか移るかは、翌シーズンの頭に本人が決める
      S.contract.until = a + contractYears();
      marketLog(`クラブと契約を更新した（${S.contract.until}歳まで）。`);
    } else {
      marketLog(`契約満了。${N(S.club)}は契約を更新しなかった。戦力外だ。`, 6);
      const c = findClub('down');
      if(c) S.flags.tryout = (S.flags.tryout||0) + 1;
      if(c && Math.random() < (a<=30 ? 0.94 : 0.94*.6)) S.marketAsk = {club:c, kind:'tryout', n:2 + Math.floor(Math.random()*4)};
      else { S.pendingEnd = 'released'; marketLog('次のクラブは見つからなかった。'); }
    }
    return;
  }
  const pUp = perf>=5 && z.apps>=20 ? 0.7 : perf>=2 && z.apps>=15 ? 0.7*.45 : 0;
  if(Math.random() < pUp){ const c = findClub('up'); if(c){ S.pendingOffer = {club:c, kind:'up'}; return; } }
  if(z.apps<10 && perf < -1 && Math.random()<0.6){ const c = findClub('side') || findClub('down'); if(c){ S.pendingOffer = {club:c, kind:'time'}; return; } }
  if(z.apps>=8 && Math.random()<0.5*stay){ const c = findClub('side'); if(c) S.pendingOffer = {club:c, kind:'side'}; }   // 同格クラブへの移籍（環境を変える）
}

/* =========================================================
   調子：前年を引き継ぐランダム（自己相関0.6のAR(1)）。覚醒・スランプ・復活が自然に起きる
   ========================================================= */
const gaussR = () => Math.sqrt(-2*Math.log(1-Math.random())) * Math.cos(2*Math.PI*Math.random());
function rollForm(){
  const prev = S.form || 0;
  S.form = Math.max(-1.8, Math.min(1.8, .6*prev + .48*gaussR()));    // 定常状態の標準偏差は約0.6
  if(S.form > .8 && prev < .2) return 'awake';
  if(prev < -.6 && S.form > .4) return 'revival';
  if(S.form < -.8 && prev > -.4) return 'slump';
  return null;
}
const formLabel = f => f>.8 ? '絶好調' : f>.3 ? '好調' : f<-.8 ? 'スランプ' : f<-.3 ? '不調' : '普通';

  slump:  z=>`長いスランプに落ちた。ボールが足につかない。${z.apps}試合で、自信だけがすり減っていった。`,
  revival:z=>`どん底から這い上がった。スランプを抜けた1年、スタンドから「おかえり」の横断幕が出た。`,

  {k:'windgoal', min:19, max:35, req:()=>!!clubInfo(S.club) && S.pos!=='GK', fx:{f:18}, text:'ハーフウェーラインからのシュートが強風で一度戻りかけ、そこからゴールに吸い込まれた。物理学者がこのゴールで論文を書いた。'},
  {k:'oldman', min:20, max:35, req:()=>!!clubInfo(S.club), fx:{f:6}, text:'試合後、見知らぬ老人に「70年前、私もこのクラブで同じ背番号だった」と声をかけられた。クラブの記録を調べたら、本当だった。'},
];
function ultraCheck(){
  for(const u of ULTRA){
    if(S.age<u.min || S.age>u.max || (u.req && !u.req()) || (S.ultra||[]).includes(u.k)) continue;
    if(Math.random() < 1/1000/(u.max - u.min + 1)){
      S.ultra = [...(S.ultra||[]), u.k];
      applyFx(u.fx);
      if(u.lottery){ const v = 1e8 * Math.max(.15, Math.min(2, ((SALARY[S.country.n] || [0, 2e6])[1]) / 5e6)); S.yen += v; ledger('other', v); }
      S.log.push({age:S.age, kind:'hap', cat:'超レア', text:u.text, fx:u.fx, ultra:true});
      S.history.push({age:S.age, label:`🌠 ${u.text.split('。')[0]}`, text:u.text, fx:u.fx, impact:40, success:null});
    }
  }
}

function flavorPick(ch, z){
  S.usedFlavor = S.usedFlavor || new Set();
  let list;
  if(ch==='乳幼児期') list = BABY_FLAVOR(S.age);
  else if(ch==='少年期') list = KID_FLAVOR;
  else if(ch==='ユース時代') list = YOUTH_FLAVOR;
  else if(z){
    const b = z.apps===0 ? 'none' : z.apps<12 ? 'bench' : z.apps<25 ? 'rotation' : 'regular';
    list = S.age>=31 && b!=='none' && Math.random()<.5 ? PRO_FLAVOR.veteran : PRO_FLAVOR[b];
  } else list = ['所属クラブが見つからず、ひとりでトレーニングを続けた','地元のグラウンドで、黙々とボールを蹴った'];
  const goalTxt = /ゴール|得点|ハットトリック|アシスト|シュートを打つ|点を決め/;
  const fresh = list.filter(t=>!S.usedFlavor.has(t) && !(S.pos==='GK' && goalTxt.test(typeof t==='function' ? t({apps:30, goals:3}) : t)));
  const t = fresh.length ? pick(fresh) : null;
  if(!t) return null;                                         // 使い切ったら、その年は文を出さない
  S.usedFlavor.add(t);
  return typeof t==='function' ? t(z) : t;
}

/* =========================================================
   キャリアの評価点と、同じ国・全世界のプロ選手の中での順位（事前シミュレーションの分布から）
   ========================================================= */
function careerScore(){
  let sc = 0;
  S.career.seasons.forEach(z=>{ if(z.apps>0) sc += Math.pow(Math.max(0, needOf(z.p) - 45), 1.6) * Math.min(1, z.apps/30) / 10; });
  S.trophies.forEach(t=>{ sc += t.k==='@ballon' ? 400 : t.k==='@wc' ? 150 : t.k==='@ucl' ? 120 : /1部リーグ優勝$/.test(t.k) ? 40 : /得点王/.test(t.k) ? 25 : 10; });
  sc += (S.caps||0)*1.5 + wcSummary().went.length*30 + (S.flags.promo||0)*8 + (S.records||[]).length*10;
  return Math.round(sc);
}

function topPct(table, sc){
  if(!table || !table.length) return null;
  if(sc >= table[table.length-1][1]) return table[table.length-1][0];
  if(sc <= table[0][1]){ let p = 100; for(const [pp, th] of table) if(th <= sc) p = pp; return p; }   // 最低点で並んだ人たち
  for(let i=1;i<table.length;i++){
    const [p1, s1] = table[i-1], [p2, s2] = table[i];
    if(sc <= s2){ const t = s2===s1 ? 1 : (sc - s1)/(s2 - s1); return Math.exp(Math.log(p1) + t*(Math.log(p2) - Math.log(p1))); }
  }
  return table[table.length-1][0];
}

  const l = String(T(h.label));
  return h.impact + (h.success===true ? 8 : 0) + (/🏆|バロンドール|🌍/.test(l) ? 15 : 0) + (/昇格|残留|記録/.test(l) ? 8 : 0) + (/🌠/.test(l) ? 30 : 0) + (/戦力外|ケガ/.test(l) ? 6 : 0);
}
