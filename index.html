// 毎年の始まりに、前半戦・後半戦の出来事の枠を用意する（中身は起きるときに選ぶ）
function planLife(){
  S.lifePlan = S.age>=18 ? {age:S.age, done:[]} : null;
}
// 時計が前半戦・後半戦の時期に来たら、出来事が起きるか判定する
function lifeDue(){
  const P = S.lifePlan;
  if(!P || P.age!==S.age || S.pendingEnd || !clubInfo(S.club)) return null;
  for(let i=0; i<LIFE_SLOTS.length; i++){
    const sl = LIFE_SLOTS[i];
    if(P.done.includes(i) || S.progress < sl.t) continue;
    if(sl.t > .5 && S.age===S.evAge && S.firedAge!==S.age) continue;   // メインの分岐イベントが先
    P.done.push(i);
    const ev = pickLife(sl.half);
    if(ev){ S.progress = sl.t; return ev; }
  }
  return null;
}
function pickLife(half){
  const x = lifeCtx();
  const pool = LIFE.filter(e=>!S.used.has(e.id) && (!e.half || e.half===half) && S.age>=e.min && S.age<=e.max && (!e.req || e.req()))
    .map(e=>[e, Math.max(0, e.w(x))]).filter(p=>p[1]>0);
  const sum = pool.reduce((a,p)=>a+p[1], 0);
  if(!pool.length || Math.random() >= sum / (sum + LIFE_W0)) return null;
  const e = wpick(pool);
  return {id:e.id, life:true, cat:e.cat, half, text:typeof e.text==='function' ? e.text(x) : e.text, choices:e.choices(x)};
}
// 選択の結果のうち、生活イベント特有のもの（人生の状態・将来のリスク・数年後の出来事）
function applyLifeOut(o){
  const L = S.life, chg = [];
  if(o.life){
    const v = o.life;
    if(v.partner===true){ L.partner = true; L.partnerAge = S.age; }
    if(v.partner===false) L.partner = false;
    if(v.married===true){ L.married = true; L.marriedAge = S.age; chg.push('💍 結婚した'); }
    if(v.married===false && L.married){ L.married = false; }
    if(v.divorced){ L.divorced = true; chg.push('離婚した'); }
    if(v.kids){ L.kids += v.kids; chg.push('👶 子どもが生まれた'); }
    if(v.pet){ L.pet = true; chg.push('🐶 家族が増えた'); }
    if(v.wild) L.wild += v.wild;
  }
  if(o.risk){
    if(o.risk.inj) S.risk.inj = Math.max(-.3, S.risk.inj + o.risk.inj);
    if(o.risk.decl) S.risk.decl = Math.max(-.3, S.risk.decl + o.risk.decl);
    if(o.risk.src && !S.risk.src.includes(o.risk.src)) S.risk.src.push(o.risk.src);
    chg.push((o.risk.inj||0) + (o.risk.decl||0) > 0 ? '🩺 将来のケガ・衰えのリスクが上がった' : '🩺 体のケアが、将来に効いてくる');
  }
  if(o.later){
    const [a, b] = o.later.y;
    S.later.push({age:S.age + a + Math.floor(Math.random()*(b - a + 1)), fx:o.later.fx, text:o.later.text, from:S.age});
    chg.push('🕰 この選択は、数年後に響くかもしれない');
  }
  return chg;
}
// 数年前の選択が、今になって効いてくる
function lifeLater(){
  const due = S.later.filter(l=>l.age<=S.age);
  S.later = S.later.filter(l=>l.age>S.age);
  for(const l of due){
    applyFx(l.fx);
    const t = T(l.text);
    S.log.push({age:S.age, kind:'hap', cat:`${S.age - l.from}年前の選択`, text:t, fx:l.fx});
    S.history.push({age:S.age, label:`🕰 ${t.split('。')[0]}`, text:t, fx:l.fx, impact:6, success:null});
    S.lifeN.later = (S.lifeN.later||0) + 1;
  }
}

const personaOf = () => PERSONAS.find(p=>p.k===S.persona);
const personaChip = () => S.age>=18 && S.persona ? `<span class="trait">🧠 性格：${personaOf().t}</span>` : '';
const relLabel = v => v>=75 ? '良好' : v>=55 ? 'ふつう' : v>=35 ? 'ぎくしゃく' : '冷え切っている';

  return `<div class="hl-card money-card life-card">
    <div class="hl-head"><b>ピッチの外の人生</b><span>OFF THE PITCH</span></div>
    <div class="mn-r"><span>性格</span><b>${personaOf().t}</b></div>

/* =========================================================
   タイトル獲得のお祝いアニメーション（160×100のドット絵キャンバスを拡大表示。画像ファイルなし）
   ・中央に本人、周りにチームメイト。全員でトロフィーを掲げ、紙吹雪が舞う
   ・タイトルの格で演出を変える（2部優勝・昇格＜1部優勝・カップ戦＜CL＜W杯）
   ・本人がほとんど出ていなければ、後ろの列で控えめに
   ・タップでスキップ。早送り中は短縮版、「視差効果を減らす」がオンなら動かない1枚絵
   ========================================================= */
// トロフィーのドット絵（12×12）。G金 D金の影 H金のハイライト B台座／銀の大会は S・s・W に置き換える
const TROPHY_PX = {
  league:['..HGGGGGGD..','DGHGGGGGGDGD','G.HGGGGGGD.G','G.HGGGGGGD.G','.GHGGGGGGDG.','...GGGGGD...','....GGGD....','.....GD.....','.....GD.....','....GGGD....','...BBBBBB...','...BBBBBB...'],
  cup:   ['.....HD.....','....GGGD....','...HGGGGD...','...HGGGGD...','..HGGGGGGD..','..HGGGGGGD..','..HGGGGGGD..','...HGGGGD...','....HGGD....','.....GD.....','....GGGD....','..BBBBBBBB..'],
  ucl:   ['.....HG.....','....HGGD....','.....GD.....','GHGGGGGGGGDG','GHGGGGGGGGDG','.HGGGGGGGGD.','..HGGGGGGD..','....GGGD....','.....GD.....','.....GD.....','...GGGGGD...','..BBBBBBBB..'],
  wc:    ['....HHGG....','...HGGGGD...','..HGGDGGGD..','..GGDGGGGD..','..GGGGDGGD..','...GGGGGD...','....GGGD....','....HGGD....','...HGGGGD...','...BBBBBB...','..BBBBBBBB..','..BBBBBBBB..'],
  ballon:['....HGGG....','..HGGDDGGG..','.HGGDDDDGGD.','.GGGGDDGGGD.','HGDGGGGGGDGD','HGDDGGGGDDGD','GGDGGGGGGDGD','.GGGGDDGGGD.','.GGGDDDDGGD.','..GGGDDGGD..','....GGGD....','............'],
  scorer:['............','.....HGGD...','.....HGGD...','.....HGGD...','.....HGGD...','.....HGGGD..','....HGGGGGD.','..HGGGGGGGGD','.HGGGGGGGGGD','.DDDDDDDDDDD','..B..B..B...','............'],
};
const TROPHY_PAL = {
  gold:{G:'#f2c94c', D:'#c79a2b', H:'#fff1a8', B:'#6b4a2b'},
  silver:{G:'#d9dde3', D:'#9aa1ab', H:'#ffffff', B:'#3d4f6b'},
};
// タイトルの種類 → 演出の格・トロフィーの形・色
function trophyKind(k){
  return k==='@wc' ? 'wc' : k==='@ucl' ? 'ucl' : k==='@ballon' ? 'ballon' : /得点王/.test(k) ? 'scorer'
    : /カップ優勝$/.test(k) ? 'cup' : /1部リーグ優勝$/.test(k) || /選手権/.test(k) ? 'league' : 'promo';
}
const CELEB_KIND = {
  promo: {shape:'league', pal:'silver', mates:4, confetti:.45, fw:false, gold:false},
  league:{shape:'league', pal:'gold',   mates:6, confetti:1,   fw:false, gold:false},
  cup:   {shape:'cup',    pal:'gold',   mates:6, confetti:1,   fw:false, gold:false},
  ucl:   {shape:'ucl',    pal:'gold',   mates:6, confetti:1.4, fw:true,  gold:false},
  wc:    {shape:'wc',     pal:'gold',   mates:6, confetti:1.8, fw:true,  gold:true},
};
function drawTrophyPx(x, shape, pal, px, py, s){
  const P = TROPHY_PAL[pal], rows = TROPHY_PX[shape];
  for(let j=0; j<rows.length; j++) for(let i=0; i<12; i++){
    const c = rows[j][i]; if(c==='.') continue;
    x.fillStyle = P[c]; x.fillRect(px + i*s, py + j*s, s, s);
  }
}

const CELEB_Q = [];
let celebOn = false;
// その瞬間の見た目（ユニフォーム・年代）を記録して、演出の列に並べる
function celebrate(kind, o){
  if(!CELEB_KIND[kind] || !S.look) return;

  hero.trophy = false; hero.bandage = false;
  if(o.wc) hero.kit = hero.gk ? hero.kit : (NAT_COLORS[S.country.n] || ['#ffffff','#111111']);
  else if(!hero.gk) hero.kit = clubKit(S.club);

  CELEB_Q.push({kind, played:o.played, label:o.label, hero, mateKit, team: o.wc ? `${S.country.n}代表` : N(S.club)});

const celebReduced = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };

function celebScene(item, quick){
  const K = CELEB_KIND[item.kind], W = 160, H = 100;
  // 後列は少し暗く（人物の画素だけを塗る）
  const sprite = (st, raise, dim) => {
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const x = c.getContext('2d'); drawAvatar(x, {...st, raise, noBall:true});
    if(dim){ x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(11,14,20,.3)'; x.fillRect(0, 0, 32, 32); x.globalCompositeOperation = 'source-over'; }
    return c;
  };
  // チームメイト：肌と髪はランダム、ユニフォームは同じ
  const mates = [];
  for(let i=0; i<K.mates; i++){
    const st = {stage:'prime', skin:SKIN_TONES[Math.floor(Math.random()*SKIN_TONES.length)], hair:HAIR_COLORS[Math.floor(Math.random()*4)],
      kit:item.mateKit, gk:false, gray:false, bald:Math.random()<.08, captain:false, bandage:false, trophy:false};
    mates.push(st);
  }
  // 並び：前列（中央＋左右）と後列。本人が出ていなければ、中央はキャプテンに譲って後列へ
  const front = [{x:80, y:88}, {x:46, y:89}, {x:114, y:89}];
  const back = K.mates>4 ? [{x:28, y:80}, {x:63, y:79}, {x:97, y:79}, {x:132, y:80}] : [{x:63, y:79}, {x:97, y:79}];
  const figs = [];
  let lifter;
  if(item.played){
    lifter = {st:item.hero, ...front[0], hero:true};
    figs.push(lifter, {st:mates[0], ...front[1]}, {st:mates[1], ...front[2]});
    back.forEach((p, i)=>figs.push({st:mates[2+i] || mates[i], ...p, back:true}));
  } else {
    mates[0].captain = true;
    lifter = {st:mates[0], ...front[0]};
    figs.push(lifter, {st:mates[1], ...front[1]}, {st:mates[2], ...front[2]});
    back.forEach((p, i)=>figs.push(i===back.length-2 ? {st:item.hero, ...p, back:true, hero:true} : {st:mates[3+i] || mates[i+1], ...p, back:true}));
  }
  lifter.lift = true;
  figs.forEach((f, i)=>{ f.down = sprite(f.st, false, f.back); f.up = sprite(f.st, true, f.back); f.ph = i*1.7; });
  // 紙吹雪の色：昇格はクラブカラーだけ、W杯は金色、CLは色とりどり
  const kc = item.mateKit.slice(0, 2);
  const colors = K.gold ? ['#ffd34d','#f2c94c','#fff1a8','#c79a2b','#ffd34d', ...kc]
    : item.kind==='ucl' ? ['#3dd6ff','#ffffff','#ffd34d','#ff5d8f','#c6ff3d', kc[0]]
    : item.kind==='promo' ? kc : [...kc, '#ffffff', '#ffd34d'];
  const n = Math.round(90 * K.confetti * (quick ? .6 : 1));
  const conf = Array.from({length:n}, ()=>({x:Math.random()*W, y:-Math.random()*H*1.2, vx:(Math.random()-.5)*8, vy:14 + Math.random()*16,
    c:colors[Math.floor(Math.random()*colors.length)], w:Math.random()<.6 ? 2 : 1, ph:Math.random()*6}));
  return {K, W, H, figs, lifter, conf, sparks:[], nextFw:.25, item};
}
// 1コマを描く（t：0〜1の進行度、dt：秒、still：動かない1枚絵）
function celebFrame(x, sc, t, dt, still){
  const {K, W, H, figs, lifter, item} = sc;
  x.clearRect(0, 0, W, H);
  // 背景：スタジアムの夜空と光
  const g = x.createRadialGradient(80, 40, 4, 80, 40, 90);
  g.addColorStop(0, K.gold ? 'rgba(255,211,77,.45)' : item.kind==='ucl' ? 'rgba(61,214,255,.35)' : 'rgba(255,255,255,.18)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = '#0b0e14'; x.fillRect(0, 0, W, H);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#16351f'; x.fillRect(0, 86, W, 14);
  x.fillStyle = '#1d4428'; for(let i=0; i<W; i+=16) x.fillRect(i, 86, 8, 14);
  // 花火（CL・W杯）
  if(K.fw && !still){
    if(t >= sc.nextFw && t < .88){
      sc.nextFw += .07 + Math.random()*.06;                     // 5秒のあいだ0.4〜0.6秒おきに上がる
      const cx = 20 + Math.random()*120, cy = 10 + Math.random()*30, c = K.gold ? '#ffd34d' : ['#3dd6ff','#ff5d8f','#ffffff','#c6ff3d'][Math.floor(Math.random()*4)];
      for(let i=0; i<22; i++){ const a = i/22*Math.PI*2, v = 18 + Math.random()*10; sc.sparks.push({x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, c}); }
    }
    sc.sparks = sc.sparks.filter(p=>(p.life -= dt*1.3) > 0);
    for(const p of sc.sparks){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 20*dt; x.globalAlpha = p.life; x.fillStyle = p.c; x.fillRect(p.x|0, p.y|0, 1, 1); }
    x.globalAlpha = 1;
  }
  // 持ち上げるまで（最初の2割）は胸の前で抱え、そこから一気に掲げる
  const lift = still ? 1 : Math.max(0, Math.min(1, (t - .15) / .15));
  const up = lift >= .5;
  const draw = f => {
    const hop = !still && up && !f.back ? Math.round(Math.abs(Math.sin(t*14 + f.ph)) * 2) : !still && up ? Math.round(Math.abs(Math.sin(t*12 + f.ph))) : 0;
    const px = f.x - 16, py = f.y - 30 - hop;
    x.drawImage(up || f.back ? f.up : f.down, px, py);
    f.top = py;
  };
  figs.filter(f=>f.back).forEach(draw);
  figs.filter(f=>!f.back).forEach(draw);
  // トロフィー：胸の前 → 頭の上へ
  const ty = lifter.top + 13 - lift*20;
  drawTrophyPx(x, K.shape, K.pal, lifter.x - 6, Math.round(ty), 1);
  if(lift>=1 && !still && Math.sin(t*30) > .6){ x.fillStyle = '#ffffff'; x.fillRect(lifter.x + 3, Math.round(ty) + 1, 1, 1); }  // きらり
  // 紙吹雪
  for(const p of sc.conf){
    if(!still){ p.y += p.vy*dt; p.x += (p.vx + Math.sin(t*9 + p.ph)*6)*dt; if(p.y > H && t < .9){ p.y = -2; p.x = Math.random()*W; } }
    const fy = still ? (p.ph*16.7) % 84 : p.y;
    if(fy < 0 || fy > H) continue;
    x.fillStyle = p.c; x.fillRect(p.x|0, fy|0, p.w, (still || Math.sin(t*20 + p.ph) > 0) ? 1 : 2);
  }
}
function showCeleb(){
  if(celebOn || !CELEB_Q.length) return;
  if(typeof matchMedia!=='function' || !document.body){ CELEB_Q.length = 0; return; }
  const item = CELEB_Q.shift(), still = celebReduced(), quick = false;
  const sign = item.kind==='sign';
  const dur = 5000;                                           // 早送り中でも5秒（タップでスキップできる）
  celebOn = true; cancelAnimationFrame(raf); raf = null;
  const el = document.createElement('div');
  el.className = `celeb ${item.kind}${still ? ' still' : ''}${item.played ? '' : ' bench'}`;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', sign ? item.label : `${item.label}のお祝い`);
  el.innerHTML = `<div class="celeb-box"><canvas width="160" height="100"></canvas>
    <div class="celeb-t">${sign ? '✍️' : '🏆'} ${esc(item.label)}</div>
    ${item.note ? `<div class="celeb-n"><b>${item.note.icon} ${esc(item.note.head)}</b>${esc(item.note.text)}</div>` : ''}
    <div class="celeb-s">${item.played ? esc(item.team) : `${esc(item.team)} ・ 出場は少なかったが、優勝メンバーの一員に`}</div>
    <button class="celeb-skip" type="button">タップしてスキップ ▶</button></div>`;
  document.body.appendChild(el);
  const cv = el.querySelector('canvas'), x = cv.getContext('2d');
  const sc = sign ? signScene(item) : celebScene(item, quick), frame = sign ? signFrame : celebFrame;
  let t0 = null, last = 0, id = null, done = false;
  const finish = () => {
    if(done) return; done = true;
    cancelAnimationFrame(id);
    el.classList.add('out');
    setTimeout(()=>{ el.remove(); celebOn = false; CELEB_Q.length ? showCeleb() : clockStart(); }, still ? 0 : 180);
  };
  const opened = performance.now();
  el.addEventListener('click', ()=>{ if(performance.now() - opened > 500) finish(); });   // 直前の操作のタップで消えないように
  if(still){ frame(x, sc, 1, 0, true); setTimeout(finish, dur); return; }
  const loop = ts => {
    if(t0==null){ t0 = ts; last = ts; }
    const t = Math.min(1, (ts - t0) / dur), dt = Math.min(.05, (ts - last) / 1000); last = ts;
    frame(x, sc, quick ? Math.min(1, .3 + t*.7) : t, dt, false);   // 短縮版は掲げたところから
    if(t >= 1) finish(); else id = requestAnimationFrame(loop);
  };
  id = requestAnimationFrame(loop);
}
// リザルトカード用：獲得タイトルを小さなトロフィーで並べる（重要なものから最大8個）
function drawTrophyRow(x, cx, y){
  const order = {wc:0, ballon:1, ucl:2, league:3, cup:4, scorer:5, promo:6};
  const ks = S.trophies.map(t=>trophyKind(t.k)).sort((a,b)=>order[a]-order[b]);
  if(!ks.length) return;
  const show = ks.slice(0, 8), s = 2, w = 12*s + 4, more = ks.length - show.length;
  const total = show.length*w + (more ? 34 : 0);
  let px = cx - total/2;
  for(const k of show){ drawTrophyPx(x, k==='promo' ? 'league' : k, k==='promo' ? 'silver' : 'gold', px + 2, y, s); px += w; }
  if(more){ x.fillStyle = '#ffd34d'; x.font = '900 16px "Noto Sans JP","Hiragino Sans",sans-serif'; x.textAlign = 'left'; x.fillText(`+${more}`, px + 4, y + 19); }
}

/* =========================================================
   契約のアニメーション（プロ初契約・移籍のたび）：テーブルで契約書にサイン → 新しいユニフォームを掲げて記念撮影
   優勝のお祝いと同じ160×100のドット絵・5秒・タップでスキップ
   ========================================================= */
// 5大リーグ・ビッグクラブに初めて届いたとき、それがどれだけすごいことかを伝える
// 実データ：プロ選手128,694人のうち五大リーグ約2,600人（CIES）。ビッグクラブ16×約27人＝約430人
// ゲーム内：移籍を受け続けた1万回のシミュレーションで、5大リーグ到達5.5%・ビッグクラブ到達0.46%
function milestone(){
  const ci = clubInfo(S.club); if(!ci) return null;
  let m = null;
  if(ci.tier===1 && BIG5.has(ci.country) && !S.flags.big5){
    S.flags.big5 = true;
    m = {icon:'🌟', head:'5大リーグ到達！', text:`世界のプロ選手 約12万9千人のうち、5大リーグでプレーできるのは約2,600人。わずか約2%（50人に1人）の世界だ。このシミュレーターでも、ここまでたどり着ける人生は約5.5%（18人に1人）しかない。`};
  }
  if(BIG_CLUBS.has(ci.obj.name) && !S.flags.bigClub){
    S.flags.bigClub = true;
    m = {icon:'👑', head:'世界のビッグクラブ入り！', text:`世界のビッグクラブ16クラブでプレーする選手は約430人。プロ選手全体の約0.3%（300人に1人）だ。このシミュレーターでも、ここまで来られる人生は約0.46%（約220人に1人）。${S.flags.big5Shown ? '' : '5大リーグそのものが、プロの約2%しか届かない世界だ。'}`};
  }
  if(!m) return null;
  S.flags.big5Shown = true;
  S.log.push({age:S.age, kind:'hap', cat:m.head, text:m.text, fx:{}, ultra:true});
  S.history.push({age:S.age, label:`${m.icon} ${m.head}（${N(S.club)}）`, text:m.text, fx:{}, impact:m.icon==='👑' ? 30 : 20, success:null});
  return m;
}
function signCeleb(first){

// 新しいユニフォーム（14×10）
function drawShirt(x, kit, px, py){
  const [k1, k2, pat] = kit, P = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(px + a, py + b, w, h); };
  P(0, 0, 3, 4, pat==='sleeves' ? k2 : k1); P(11, 0, 3, 4, pat==='sleeves' ? k2 : k1);
  for(let j=0; j<10; j++) for(let i=0; i<10; i++){
    const alt = pat==='stripes' ? (i>>1)%2===1 : pat==='hoops' ? (j>>1)%2===1 : pat==='halves' ? i>=5
      : pat==='sash' ? Math.abs((9-i) - j) < 1.6 : pat==='band' ? Math.abs(i - 4.5) < 1.6 : pat==='checks' ? ((i>>1)+(j>>1))%2===1 : false;
    P(2 + i, j, 1, 1, alt ? k2 : k1);
  }
  P(5, 0, 4, 1, k2); P(6, 3, 2, 3, isLight(k1) ? '#1b1b1f' : '#ffffff');   // 襟と背番号
}
function signScene(item){
  const sprite = (st, raise) => { const c = document.createElement('canvas'); c.width = 32; c.height = 32; drawAvatar(c.getContext('2d'), {...st, raise, noBall:true}); return c; };

    kit:['#23262e', '#e8e8e8'], gk:false, gray:false, bald:Math.random()<.3, captain:false, bandage:false, trophy:false};
  // カメラマン（手前のシルエット）
  const cams = [14, 40, 120, 146].map(x0=>({x:x0 + Math.round(Math.random()*6 - 3), next:Math.random()*.2}));
  return {hd:sprite(item.hero, false), hu:sprite(item.hero, true), od:sprite(off, false), ou:sprite(off, true), cams, flash:[], item};
}
function signFrame(x, sc, t, dt, still){
  const W = 160, H = 100, [k1, k2] = sc.item.mateKit;
  const P = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(a, b, w, h); };
  // 背景：クラブカラーの会見ボード
  P(0, 0, W, H, '#0b0e14');
  x.globalAlpha = .3; P(0, 0, W, 64, k1);
  x.globalAlpha = .22; for(let j=0; j<64; j+=10) for(let i=(j/10)%2 ? 6 : 0; i<W; i+=12) P(i, j + 3, 6, 4, k2);
  x.globalAlpha = 1;
  const stand = still || t >= .5;
  const signT = Math.max(0, Math.min(1, (t - .08) / .34));       // サインを書き進める
  if(!stand){
    x.drawImage(sc.od, 118 - 16, 40);                             // 担当者は横で見守る
    x.drawImage(sc.hd, 80 - 16, 44);                              // 本人は座ってサイン
  } else {
    const hop = still ? 0 : Math.round(Math.abs(Math.sin(t*10)) * .8);
    x.drawImage(sc.hu, 64 - 16, 40 - hop);                       // テーブルの後ろに立つ（脚はテーブルに隠れる）
    x.drawImage(sc.ou, 96 - 16, 40);
    drawShirt(x, sc.item.mateKit, 73, 43 - hop);                  // 二人で新しいユニフォームを掲げる
  }
  // テーブルと契約書
  P(14, 64, 132, 3, '#e8e8e8'); P(14, 67, 132, 21, '#2a3550'); P(14, 67, 132, 1, '#1d2740');
  P(66, 66, 26, 9, '#fbfbf6'); for(let j=0; j<3; j++) P(69, 67 + j*2, 18 - j*4, 1, '#c9ccd3');
  const sw = Math.round((stand ? 1 : signT) * 18);               // 署名
  for(let i=0; i<sw; i++) P(69 + i, 73 - (i%4===1 ? 1 : 0), 1, 1, '#1b3fa0');
  if(!stand){ const px = 69 + sw; P(px, 70, 1, 3, '#111111'); P(px + 1, 69, 1, 1, '#d7263d'); }   // ペン
  P(100, 66, 6, 4, '#ffffff'); P(100, 69, 6, 1, '#c9ccd3');        // 水のグラス
  // カメラマンとフラッシュ
  for(const c of sc.cams){
    P(c.x - 4, 90, 8, 10, '#06070a'); P(c.x - 3, 86, 6, 5, '#06070a'); P(c.x - 2, 89, 4, 3, '#2b2f3a');
    if(!still && t >= c.next){ c.next = t + (stand ? .04 : .1) + Math.random()*(stand ? .1 : .2); sc.flash.push({x:c.x, y:89, life:1}); }
  }
  let big = 0;
  sc.flash = sc.flash.filter(f=>(f.life -= dt*6) > 0);
  for(const f of sc.flash){
    x.globalAlpha = f.life; P(f.x - 1, f.y - 1, 3, 3, '#ffffff'); P(f.x - 3, f.y, 7, 1, '#ffffff'); P(f.x, f.y - 3, 1, 7, '#ffffff');
    big = Math.max(big, f.life);
  }
  x.globalAlpha = big * .12; P(0, 0, W, H, '#ffffff'); x.globalAlpha = 1;
}

/* =========================================================

// ある年齢・あるクラブでの見た目
function retroLook(age, key){

  const st = avatarState(true);
  [S.age, S.club, S.hurtAge] = save;
  st.trophy = false; st.noBall = true;
  if(age < S.joinAge) st.gk = false;
  return st;
}
function retroSlides(){
  const sl = [], F = S.final, gk = S.pos==='GK';
  const pre = S.clubs.filter(k=>k!=='home' && !clubInfo(k));     // プロになる前のクラブ・学校
  sl.push({age:0, st:retroLook(0, 'home'), head:'0歳', text:`${S.country.f} ${S.country.n}・${S.place}に生まれる`, bg:'#2a2f3d'});
  sl.push({age:Math.max(4, Math.min(S.joinAge, 9)), st:retroLook(Math.max(5, Math.min(S.joinAge, 9)), pre[0] || 'home'), head:`${S.joinAge}歳`,
    text: pre[0] ? `${N(pre[0])}でサッカーを始める。ポジションは${S.posPath[0] || S.pos}` : 'ボールを追いかける毎日', kit:pre[0]});
  const youth = pre[pre.length-1];
  if(youth && youth!==pre[0]) sl.push({age:16, st:retroLook(16, youth), head:'16歳', text:`${N(youth)}で、プロを夢見た`, kit:youth});
  // プロのクラブごとの在籍（出場の多い順に最大3つ、時系列で）
  const stints = [];
  for(const z of S.career.seasons){
    const last = stints[stints.length-1];
    if(last && last.club===z.club){ last.to = z.age; last.apps += z.apps; last.goals += z.goals; last.cs += z.cs||0; }
    else stints.push({club:z.club, from:z.age, to:z.age, apps:z.apps, goals:z.goals, cs:z.cs||0});
  }
  stints.filter(st=>clubInfo(st.club)).sort((a,b)=>b.apps - a.apps).slice(0, 3).sort((a,b)=>a.from - b.from).forEach(st=>{
    const mid = Math.round((st.from + st.to) / 2);
    sl.push({age:mid, st:retroLook(mid, st.club), head:st.from===st.to ? `${st.from}歳` : `${st.from}〜${st.to}歳`,
      text:`${N(st.club)}　${st.apps}試合${gk ? `・無失点${st.cs}試合` : `${st.goals}得点`}`, kit:st.club});
  });
  // いちばん大きな出来事
  // タイトル・5大リーグ到達・W杯・CLなど、記録に残る出来事（ふつうの選択やハプニングは除く）
  const big = h => { const l = T(h.label); return h.age>=15 && /^[🏆🌟👑🌍🧤🌠🏟©✍🔥]/u.test(l) && !/^✍️ 契約更新/.test(l); };
  const best = [...S.history].filter(big).sort((a,b)=>b.impact - a.impact || a.age - b.age)[0];
  if(best){
    const tk = S.trophies.find(t=>t.age===best.age || t.age===best.age-1);
    const key = (S.career.seasons.find(z=>z.age===best.age) || {}).club || S.club;
    sl.push({age:best.age, st:retroLook(best.age, key), head:`${best.age}歳`, text:T(best.label).replace(/^[^\p{L}\p{N}]+/u, ''), kit:key, raise:true, trophy:tk ? trophyKind(tk.k) : null});
  }
  sl.sort((a,b)=>a.age - b.age);                                 // いちばんの出来事も時系列の位置に
  sl.push({age:S.age, st:retroLook(S.age, S.club), head:`${S.age}歳`, text:`引退。通算${S.career.apps}試合${gk ? `・無失点${S.career.cs||0}試合` : `${S.career.goals}得点`}`, kit:S.club, last:true, sub:`「${F.title.t}」`});
  return sl;
}
function retroFrame(x, sc, i, u, still){
  const W = 160, H = 100, s = sc.slides[i];
  const P = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(a, b, w, h); };
  const kit = s.kit ? clubKit(s.kit) : ['#3a4256', '#ffffff'];
  // 背景：少し色あせた写真のように（そのクラブの色を薄く）
  P(0, 0, W, H, s.last ? '#2b1d1a' : '#1a1d26');
  x.globalAlpha = s.last ? .35 : .22; P(0, 0, W, 70, s.last ? '#e8894a' : kit[0]); x.globalAlpha = 1;
  if(s.last){ x.globalAlpha = .7; for(let r=0; r<9; r++){ const w = Math.round(Math.sqrt(81 - r*r)) * 2; P(30 - w/2, 69 - r, w, 1, r<3 ? '#ffb46a' : '#ffd08a'); } x.globalAlpha = 1; }   // 地平線に沈む夕日
  P(0, 70, W, 30, '#173222'); x.globalAlpha = .4; for(let k=0; k<W; k+=16) P(k, 70, 8, 30, '#1f4a2c'); x.globalAlpha = 1;
  P(0, 70, W, 1, 'rgba(255,255,255,.25)');
  // 本人（2倍のドット）。ゆっくり横に流れる
  const pan = still ? 0 : Math.round((u - .5) * 8);
  const spr = sc.spr[i];
  x.imageSmoothingEnabled = false;
  x.drawImage(spr, 80 - 32 + pan, 74 - 60, 64, 64);
  if(s.trophy) drawTrophyPx(x, s.trophy==='promo' ? 'league' : s.trophy, s.trophy==='promo' ? 'silver' : 'gold', 80 - 12 + pan, 74 - 60 - 16, 2);
  // 古い写真のような色味と周辺の暗さ
  x.globalAlpha = .1; P(0, 0, W, H, '#ffcf8a'); x.globalAlpha = .35;
  P(0, 0, W, 6, '#000'); P(0, H-6, W, 6, '#000'); P(0, 0, 6, H, '#000'); P(W-6, 0, 6, H, '#000');
  x.globalAlpha = 1;
  // 場面の切り替わりは暗転でつなぐ
  const fade = still ? 0 : Math.max(0, 1 - Math.min(u, 1 - u) / .14);
  if(fade > 0){ x.globalAlpha = Math.min(1, fade); P(0, 0, W, H, '#07080a'); x.globalAlpha = 1; }
}
let retroOn = false;
function showRetro(){
  if(typeof matchMedia!=='function' || !document.body || !S.final || retroOn) return;
  const slides = retroSlides(), still = celebReduced(), dur = 20000, per = dur / slides.length;
  retroOn = true;
  if(window.BGM_READY) BGM.setSong('sad');
  const el = document.createElement('div');
  el.className = `celeb retro${still ? ' still' : ''}`;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'サッカー人生の振り返り');
  el.innerHTML = `<div class="celeb-box"><div class="rt-k">MY FOOTBALL LIFE</div><canvas width="160" height="100"></canvas>
    <div class="rt-cap"><b></b><span></span><small></small></div>
    <div class="rt-bar"><i></i></div>
    <button class="celeb-skip" type="button">タップしてスキップ ▶</button></div>`;
  document.body.appendChild(el);
  const cv = el.querySelector('canvas'), x = cv.getContext('2d');
  const cap = el.querySelector('.rt-cap'), bar = el.querySelector('.rt-bar i');
  const sc = {slides, spr:slides.map(s=>{ const c = document.createElement('canvas'); c.width = 32; c.height = 32; drawAvatar(c.getContext('2d'), {...s.st, raise:!!s.raise}); return c; })};
  let shown = -1, t0 = null, id = null, done = false;
  const setCap = i => {
    const s = slides[i]; shown = i;
    cap.classList.remove('in'); void cap.offsetWidth;
    cap.querySelector('b').textContent = s.head; cap.querySelector('span').textContent = s.text; cap.querySelector('small').textContent = s.sub || '';
    cap.classList.add('in');
  };
  const finish = () => {
    if(done) return; done = true;
    cancelAnimationFrame(id); clearTimeout(id);
    el.classList.add('out');
    setTimeout(()=>{ el.remove(); retroOn = false; }, 300);
  };
  const opened = performance.now();
  el.addEventListener('click', ()=>{ if(performance.now() - opened > 500) finish(); });
  if(still){
    let i = 0;
    const step = () => { if(done) return; if(i>=slides.length){ finish(); return; } retroFrame(x, sc, i, .5, true); setCap(i); bar.style.width = `${(i+1)/slides.length*100}%`; i++; id = setTimeout(step, per); };
    step(); return;
  }
  const loop = ts => {
    if(t0==null) t0 = ts;
    const e = ts - t0, i = Math.min(slides.length - 1, Math.floor(e / per)), u = Math.min(1, (e - i*per) / per);
    if(i!==shown) setCap(i);
    retroFrame(x, sc, i, i===slides.length-1 ? Math.min(u, .5) : u, false);   // 最後の場面は暗転せずに止まる
    bar.style.width = `${Math.min(100, e/dur*100)}%`;
    if(e >= dur + 600) finish(); else id = requestAnimationFrame(loop);
  };
  id = requestAnimationFrame(loop);
}

let G = null;

function weightedCountry(){
  const sum = COUNTRIES.reduce((a,c)=>a+c.w,0);
  let r = Math.random()*sum;
  for(const c of COUNTRIES){ if((r-=c.w)<0) return c; }
  return COUNTRIES[0];
}
function pickBirth(){
  const c = weightedCountry(), place = pick(c.c), sp = place.split(' ');
  return {c, place, pref: sp.length>1 ? sp[0] : null, city: sp[sp.length-1], name: genName(c.pool || c.n), ...rollTraits(c)};
}

function gachaAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  const ctx = new AC();
  const out = ctx.createGain(); out.gain.value = .7; out.connect(ctx.destination);
  const buf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise = (dest,t,len,type,freq,vol)=>{
    const src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=buf; f.type=type; f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t+len+.05);
  };
  const tone = (dest,freq,t,len,type,vol)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+len);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+len+.05);
  };
  const roll = ctx.createGain(); roll.connect(out);
  return {
    ctx,
    // スネアのドラムロール（だんだん大きく）
    drumroll(dur){
      const t0 = ctx.currentTime;
      for(let t=0; t<dur; t+=.045) noise(roll, t0+t, .06, 'bandpass', 1900, .05 + .22*(t/dur));
    },
    stopRoll(){ roll.gain.setTargetAtTime(0, ctx.currentTime, .02); },
    // 心音 → やわらかいチャイム（誕生シーン）
    heartbeat(){
      const t0 = ctx.currentTime + .05;
      [0,.28,1.1,1.38,2.2,2.48,3.3,3.58].forEach((dt,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain(), t=t0+dt;
        o.frequency.setValueAtTime(75,t); o.frequency.exponentialRampToValueAtTime(40,t+.15);
        g.gain.setValueAtTime(i%2 ? .45 : .8, t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
        o.connect(g); g.connect(out); o.start(t); o.stop(t+.25);
      });
      [72,76,79,84].forEach((m,i)=>tone(out, 440*Math.pow(2,(m-69)/12), t0+4.5+i*.16, 1.8, 'sine', .07));
    },
    tick(p){ tone(out, 700 + p*700, ctx.currentTime, .035, 'square', .05); },
    // 確定音：キック＋クラッシュ＋ファンファーレ
    land(){
      const t = ctx.currentTime + .02;
      const k=ctx.createOscillator(), kg=ctx.createGain();
      k.frequency.setValueAtTime(150,t); k.frequency.exponentialRampToValueAtTime(40,t+.2);
      kg.gain.setValueAtTime(1,t); kg.gain.exponentialRampToValueAtTime(.001,t+.35);
      k.connect(kg); kg.connect(out); k.start(t); k.stop(t+.4);
      noise(out, t, 1.8, 'highpass', 5000, .45);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.connect(out);
      [60,64,67,72].forEach((m,i)=>tone(lp, 440*Math.pow(2,(m-69)/12), t+i*.07, 1.6, 'sawtooth', .07));
      tone(out, 440*Math.pow(2,(84-69)/12), t+.3, 1.2, 'triangle', .06);
    },
  };
}

      <div class="b-line b1">${birth.c.f} ${birth.c.n} ・ ${birth.place}</div>
      <div class="b-line b2">${birth.c.n}の${birth.city}で、<br>新たな人生が始まった…</div>
      <div class="b-line b-name"><small>その名は——</small>${esc(birth.name.main)}</div>
      <div class="b-age">0<small>歳</small></div>
    </div>
    <div class="g-flash"></div>`;
  document.body.appendChild(el);

  const snd = gachaAudio();
  if(snd) snd.drumroll(spinDur);
  G = {el, birth, snd, timer:null, landed:false, phase:'spin', done:false};

  const item = el.querySelector('.g-item');
  const show = (c, d)=>{
    item.querySelector('.flag').textContent = c.f;
    item.querySelector('.cn').textContent = c.n;
    item.classList.remove('roll'); void item.offsetWidth;
    item.style.setProperty('--d', Math.min(d, 260)+'ms');
    item.classList.add('roll');
  };

  let i = 0, idx = Math.floor(Math.random()*COUNTRIES.length);
  const step = ()=>{
    if(!G || G.landed) return;
    idx = (idx + 1 + Math.floor(Math.random()*3)) % COUNTRIES.length;
    if(i===STEPS-1 && COUNTRIES[idx]===birth.c) idx = (idx+1) % COUNTRIES.length; // 直前に同じ国を出さない
    show(COUNTRIES[idx], delays[i]);
    if(snd) snd.tick(i/STEPS);
    G.timer = setTimeout(++i<STEPS ? step : landGacha, delays[i-1]);
  };
  step();

  el.addEventListener('click', ()=>{
    if(!G) return;
    if(!G.landed) landGacha();
    else if(G.phase!=='birth') birthScene();
    else finishGacha();
  });
}

function landGacha(){
  if(!G || G.landed) return;
  clearTimeout(G.timer);
  G.landed = true;
  const {el, birth, snd} = G;
  const item = el.querySelector('.g-item');
  item.classList.remove('roll');
  item.querySelector('.flag').textContent = birth.c.f;
  item.querySelector('.cn').textContent = birth.c.n;
  item.querySelector('.ct').textContent = `（${birth.place}）`;
  el.querySelector('.ttl').textContent = '生誕地と名前が決定！';
  el.querySelector('.g-hint').textContent = 'タップで次へ';
  el.classList.add('landed');
  if(snd){ snd.stopRoll(); snd.land(); }
  if(navigator.vibrate) navigator.vibrate([30,40,80]);
  // 紙吹雪
  const stage = el.querySelector('.g-stage');
  const colors = ['#c6ff3d','#3dd6ff','#ffd34d','#ff3d6e','#ffffff'];
  for(let k=0;k<36;k++){
    const p = document.createElement('i'); p.className='g-p';
    const a = Math.random()*Math.PI*2, r = 120 + Math.random()*200;
    p.style.cssText = `--tx:${Math.cos(a)*r}px;--ty:${Math.sin(a)*r}px;--r:${Math.random()*720-360}deg;background:${colors[k%colors.length]};animation-delay:${Math.random()*.08}s`;
    stage.appendChild(p);
  }
  S.country = birth.c;
  S.place = birth.place;
  S.city = birth.city;
  S.pref = birth.pref;
  S.mode = birth.c.n==='日本' ? 'japan' : 'world';
  S.player = birth.name.main;
  S.playerSub = birth.name.sub;
  S.body = birth.body; S.talent = birth.talent; S.family = birth.family; S.look = birth.look; S.potBirth = birth.pot;
  G.timer = setTimeout(birthScene, 5000);
}

// 「〇〇で生まれ落ちた…」の誕生シーン
function birthScene(){
  if(!G || G.phase==='birth') return;
  clearTimeout(G.timer);
  G.phase = 'birth';
  G.el.classList.add('birth');
  if(G.snd) G.snd.heartbeat();
  G.timer = setTimeout(finishGacha, 7200);
}

function finishGacha(){
  if(!G || G.done) return;
  G.done = true;
  BGM.duck(false);
  clearTimeout(G.timer);
  const {el, snd} = G;
  G = null;
  startCareer();
  el.classList.add('out');
  setTimeout(()=>el.remove(), 420);
  if(snd) setTimeout(()=>{ try{ snd.ctx.close(); }catch(e){} }, 1800);
}

/* =========================================================
   トースト
   ========================================================= */
let toastTimer;
function toast(msg, ms = 2400){
  clearTimeout(toastTimer);
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), ms);
}

/* =========================================================
   BGM：Web Audio で鳴らす明るいループ曲（音声ファイル不要）
   ブラウザは最初のタップまで音を出せないので、最初の操作で再生を始める
   ========================================================= */
const BGM = (()=>{
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  /* ---------- 曲1：プレイ中の明るい曲（C G Am F、124BPM） ---------- */
  const MAIN_STEP = 60/124/2;                          // 1ステップ = 8分音符
  const MAIN_CHORDS = [[48,[60,64,67]],[43,[59,62,67]],[45,[57,60,64]],[41,[57,60,65]],
                       [48,[60,64,67]],[43,[59,62,67]],[41,[57,60,65]],[43,[59,62,67]]];
  const MAIN_MEL = [
    76,0,79,0,81,79,76,0,   74,0,79,0,74,72,74,0,
    72,0,76,0,79,0,81,79,   77,0,76,0,74,0,0,0,
    76,79,84,0,81,79,76,0,  74,0,79,0,83,0,81,79,
    81,0,77,0,76,0,74,0,    74,76,79,0,0,0,0,0,
  ];
  // 64ステップ（8小節）ごとに、メロディの回と和音を刻む回を交互に
  function playMain(i, t){
    const STEP = MAIN_STEP, bar = Math.floor(i/8) % 8, s = i % 8, verse = Math.floor(i/64) % 2;
    const [root, chord] = MAIN_CHORDS[bar];
    if(s%4===0) kick(t);
    if(s===2 || s===6) snare(t);
    if(bar===7 && s===7) snare(t + STEP/2);                     // ループ前のフィル
    hiss(t, .04, 'highpass', 7000, s%2 ? .05 : .09);
    tone(hz(root + (s%4===2 ? 12 : 0)), t, STEP*.85, 'triangle', .35, 900);
    if(s%2===1) chord.forEach(n=>tone(hz(n), t, STEP*.6, 'sawtooth', .045, 2200));
    if(verse===0){
      const m = MAIN_MEL[bar*8 + s];
      if(m){ let k = 1; while(k<3 && !MAIN_MEL[(bar*8 + s + k) % 64]) k++; tone(hz(m), t, STEP*k*.9, 'square', .07, 3000); }
    } else {
      tone(hz(chord[s%3] + 12 + (s>=6 ? 12 : 0)), t, STEP*.5, 'square', .045, 2600);
    }
  }
  /* ---------- 曲2：引退の振り返り用の切ない曲（Am F C G Dm Am F E、70BPM。ピアノ風のアルペジオと残響） ---------- */
  const SAD_STEP = 60/70/2;
  const SAD_CHORDS = [[45,[57,60,64]],[41,[57,60,65]],[48,[55,60,64]],[43,[55,59,62]],
                      [38,[57,62,65]],[45,[57,60,64]],[41,[57,60,65]],[40,[56,59,64]]];
  const SAD_MEL = [
    76,0,0,74,72,0,71,72,   69,0,0,0,0,0,72,74,
    76,0,0,79,77,0,76,74,   74,0,0,0,0,0,71,72,
    74,0,0,77,76,0,74,72,   72,0,0,0,69,0,71,72,
    72,0,74,0,76,0,77,76,   76,0,0,0,0,0,0,0,
  ];
  const ARP = [0,1,2,1,2,1,0,1];
  function playSad(i, t){
    const STEP = SAD_STEP, bar = Math.floor(i/8) % 8, s = i % 8, verse = Math.floor(i/64) % 2;
    const [root, chord] = SAD_CHORDS[bar];
    if(s===0) tone(hz(root), t, STEP*7.5, 'triangle', .22, 700);                 // ベースは小節の頭に長く
    if(s===0) chord.forEach(n=>tone(hz(n - 12), t, STEP*8, 'sine', .035, 900));  // やわらかいパッド
    tone(hz(chord[ARP[s]] + (s>=4 ? 12 : 0)), t, STEP*2.6, 'sine', .07, 2000);   // ピアノ風アルペジオ
    const m = SAD_MEL[bar*8 + s];
    if(m){
      let k = 1; while(k<4 && !SAD_MEL[(bar*8 + s + k) % 64]) k++;
      if(verse===0) tone(hz(m), t, STEP*k*1.1, 'triangle', .085, 2400);
      else { tone(hz(m + 12), t, STEP*k*1.1, 'sine', .06, 3000); tone(hz(m), t, STEP*k*1.1, 'triangle', .04, 1800); }   // 2回目は1オクターブ上で、そっと
    }
  }
  const SONGS = {
    main:{steps:128, step:MAIN_STEP, play:playMain, tail:1, echo:false},    // 約31秒で1周
    sad: {steps:128, step:SAD_STEP,  play:playSad,  tail:4, echo:true},     // 約55秒で1周
  };
  const VOL = .2;
  // ac：音を組み立てる先（書き出し用のオフラインのコンテキスト）、bus：その出力先
  let ctx = null, master = null, noise = null, ac = null, bus = null, on = true, ducked = false, cur = 'main';
  const bufs = {}, srcs = {}, gains = {}, building = {};
  try{ on = localStorage.getItem('fls_bgm') !== 'off'; }catch(e){}

  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = ducked ? VOL*.25 : VOL;
    master.connect(comp); comp.connect(ctx.destination);
  }
  function tone(freq, t, len, type, vol, cut){
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = cut;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + len + .05);
  }
  function hiss(t, len, type, freq, vol){
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + len + .05);
  }
  function kick(t){
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + .3);
  }
  function snare(t){ hiss(t, .16, 'bandpass', 1800, .35); tone(190, t, .1, 'triangle', .25, 2000); }

  // 曲1周ぶんを最初に一度だけ音声データに書き出し、あとはそれをループ再生する
  // （画面の処理が重くなっても、音の予約が遅れて途切れたり乱れたりしない）
  function build(name){
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(!OAC || building[name] || bufs[name]) return;
    const song = SONGS[name], sr = ctx.sampleRate, n = Math.round(song.steps * song.step * sr);
    building[name] = true;
    const off = new OAC(1, n + Math.round(song.tail * sr), sr);  // 最後の音の余韻ぶん長く
    ac = off; bus = off.destination;
    if(song.echo){                                              // 切ない曲は、ホールのような残響をつける
      const dry = off.createGain(), dl = off.createDelay(1), fb = off.createGain(), lp = off.createBiquadFilter();
      dl.delayTime.value = .34; fb.gain.value = .38; lp.type = 'lowpass'; lp.frequency.value = 2200;
      dry.connect(off.destination); dry.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(off.destination);
      bus = dry;
    }
    noise = off.createBuffer(1, sr, sr);
    const d = noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    for(let i=0; i<song.steps; i++) song.play(i, i*song.step);
    ac = bus = null;
    const done = buf => {
      // はみ出した余韻はループの頭に重ねて、つなぎ目を自然にする
      const out = ctx.createBuffer(1, n, sr), o = out.getChannelData(0), r = buf.getChannelData(0);
      for(let i=0; i<n; i++){ let v = r[i]; for(let j=i+n; j<r.length; j+=n) v += r[j]; o[i] = v; }
      bufs[name] = out; building[name] = false;
      if(on && cur===name) startLoop(name, .05);
      if(name==='main') setTimeout(()=>build('sad'), 2500);     // 引退の曲も先に用意しておく（切り替えで間が空かないように）
    };
    const p = off.startRendering();
    if(p && p.then) p.then(done); else off.oncomplete = e => done(e.renderedBuffer);
  }
  // 曲ごとに音量つまみを持ち、切り替えはフェードでつなぐ
  function startLoop(name, fade){
    if(srcs[name] || !bufs[name]) return;
    const g = gains[name] || (gains[name] = ctx.createGain());
    g.connect(master);
    const t = ctx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(fade > .1 ? 0 : 1, t); g.gain.linearRampToValueAtTime(1, t + fade);
    const s = ctx.createBufferSource(); s.buffer = bufs[name]; s.loop = true; s.connect(g); s.start(t + .02);
    srcs[name] = s;
  }
  function stopLoop(name, fade){
    const s = srcs[name], g = gains[name]; if(!s) return;
    srcs[name] = null;
    const t = ctx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + fade);
    try{ s.stop(t + fade + .05); }catch(e){}
  }
  function setSong(name){
    if(!SONGS[name] || cur===name) return;
    const old = cur; cur = name;
    if(!ctx || !on) return;
    stopLoop(old, 1.5);
    if(bufs[name]) startLoop(name, 2); else build(name);
  }
  function start(){
    if(!on) return;
    if(!ctx) init();
    if(!ctx) return;
    if(ctx.state !== 'running') ctx.resume();
    if(bufs[cur]) startLoop(cur, .05); else build(cur);
  }
  function stop(){
    if(ctx) ctx.suspend();
  }
  function toggle(){
    on = !on;
    try{ localStorage.setItem('fls_bgm', on ? 'on' : 'off'); }catch(e){}
    on ? start() : stop();
    paint();
  }
  // ガチャなど効果音が主役の場面では音量を下げる
  function duck(v){
    ducked = v;
    if(master) master.gain.setTargetAtTime(v ? VOL*.25 : VOL, ctx.currentTime, .3);
  }
  function paint(){
    const b = document.getElementById('bgmBtn');
    if(!b) return;
    b.textContent = on ? '🎵' : '🔇';
    b.classList.toggle('on', on);
    b.setAttribute('aria-label', on ? 'BGMをオフにする' : 'BGMをオンにする');
  }
  // 別のタブに移ったら止め、戻ったら再開
  document.addEventListener('visibilitychange', ()=>{
    if(!ctx || !on || !Object.values(srcs).some(Boolean)) return;
    document.hidden ? ctx.suspend() : ctx.resume();
  });
  // 最初の操作で再生開始（BGMボタン自体を押したときは toggle に任せる）
  const kickoff = e => { if(!(e.target && e.target.closest && e.target.closest('#bgmBtn'))) start(); };
  document.addEventListener('pointerdown', kickoff);
  document.addEventListener('keydown', kickoff);
  return {start, toggle, duck, paint, setSong};
})();
window.BGM_READY = true;

/* =========================================================
   効果音：選択肢を押したときの「ピコッ」（Web Audio で作る、約0.1秒）
   ========================================================= */
const SFX = (()=>{
  let ctx = null, out = null, on = true, last = 0, voice = null;
  try{ on = localStorage.getItem('fls_se') !== 'off'; }catch(e){}
  // AudioContext は最初に押したときに作る（スマホは操作なしで音を出せない）
  function ready(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      out = ctx.createGain(); out.gain.value = .5;
      out.connect(comp); comp.connect(ctx.destination);
    }
    if(ctx.state !== 'running') ctx.resume();
    return true;
  }
  function click(){
    if(!on) return;
    try{
      if(!ready()) return;
      const now = performance.now();
      if(now - last < 70) return;               // 連打しても重ねない
      last = now;
      if(voice){ try{ voice.stop(); }catch(e){} }  // 前の音は切ってから鳴らす
      const t = ctx.currentTime + .005, o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'square';
      o.frequency.setValueAtTime(988, t); o.frequency.setValueAtTime(1976, t + .035);   // 2音で「ピ・コッ」
      f.type = 'lowpass'; f.frequency.value = 5000;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .004);
      g.gain.setValueAtTime(.12, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .1);
      o.connect(f); f.connect(g); g.connect(out);
      o.start(t); o.stop(t + .11);
      voice = o; o.onended = () => { if(voice===o) voice = null; };
    }catch(e){}
  }
  function paint(){
    const b = document.getElementById('seBtn');
    if(!b) return;
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>${on
      ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
      : '<path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'}</svg>`;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? '効果音をオフにする' : '効果音をオンにする');
  }
  function toggle(){
    on = !on;
    try{ localStorage.setItem('fls_se', on ? 'on' : 'off'); }catch(e){}
    paint();
    click();                                     // オンにしたら試しに鳴らす
  }
  return {click, toggle, paint};
})();

/* =========================================================
   イベント委譲
   ========================================================= */
document.addEventListener('click', e=>{
  if(e.target.closest('#bgmBtn')){ BGM.toggle(); return; }
  if(e.target.closest('#seBtn')){ SFX.toggle(); return; }
  const nm = e.target.closest('.toggle button');
  if(nm){
    S.nameMode = nm.dataset.nm;
    try{ localStorage.setItem('fls_nameMode', S.nameMode); }catch(err){}
    render();
    return;
  }
  if(e.target.closest('[data-pause]')){ togglePause(); return; }
  const sp = e.target.closest('.speed button');
  if(sp){
    S.speed = +sp.dataset.sp;
    try{ localStorage.setItem('fls_speed', S.speed); }catch(err){}
    updateClock();
    return;
  }
  const hero = e.target.closest('.hero');
  if(hero && !hero.classList.contains('done')){ hero.classList.add('done'); return; } // 演出スキップ
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const v = el.dataset.v;
  switch(el.dataset.act){
    case 'toTitle': S.screen='title'; render(); break;
    case 'start': startGacha(); break;
    case 'toFacts': { const f = document.querySelector('.facts'); if(f) $main.scrollTo({top:f.offsetTop - $main.offsetTop - 8, behavior:celebReduced() ? 'auto' : 'smooth'}); break; }
    case 'dex': if(S.screen!=='dex') S.dexFrom = S.screen; S.screen = 'dex'; render(); break;
    case 'dexBack': S.screen = S.dexFrom || 'title'; render(); break;
    case 'shareImg': shareCardImage(); break;
    case 'choose': SFX.click(); choose(+v); break;
    case 'pos': choosePos(v); break;
    case 'toEnding': endCareer(S.pendingEnd); break;
    case 'share': shareToX(); break;
    case 'restart': startCareer(); break;
  }
});

/* =========================================================
   PWA: マニフェストを動的に生成
   （Service Worker は別ファイル sw.js が必要なため、置いた場合のみ登録）
   ========================================================= */
(function(){
  const icon = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#07080a"/><circle cx="256" cy="256" r="150" fill="#c6ff3d"/><text x="256" y="300" font-size="150" text-anchor="middle" font-family="sans-serif" font-weight="900" fill="#07080a">FL</text></svg>`);
  const manifest = {
    name:'サッカー人生シミュレーター', short_name:'サッカー人生',
    start_url:location.href.split('#')[0], display:'standalone',
    background_color:'#07080a', theme_color:'#07080a', orientation:'portrait',
    icons:[{src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any'}],
  };
  const link = document.createElement('link');
  link.rel='manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  document.head.appendChild(link);
  const apple = document.createElement('link'); apple.rel='apple-touch-icon'; apple.href=icon; document.head.appendChild(apple);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    fetch('sw.js',{method:'HEAD'}).then(r=>{ if(r.ok) navigator.serviceWorker.register('sw.js'); }).catch(()=>{});
  }
})();

BGM.paint();
SFX.paint();
render();
