/* =========================================================
   W杯と予選（2026年大会以降の48か国方式）
   ・大会は2026年から4年ごと。大会前の2シーズンが予選期間
   ・予選は毎回、各大陸の全加盟国の実力＋ぶれで順位を付け、大陸の出場枠を上から埋める（開催国は自動出場）
   ・実力 = 現在の実力（World Football Elo 概算）と、1998〜2022年の出場実績から逆算した実力の平均
   ========================================================= */
const WC_SD = 90; // 予選ごとのぶれ（32か国時代の枠で1998〜2022年の実績に最も合う値から設定）
const WC_TEAMS = {"UEFA":{"スペイン":2114,"フランス":2065,"イングランド":2049,"ポルトガル":1988,"オランダ":1951,"ドイツ":1999,"クロアチア":1957,"イタリア":1927,"ベルギー":1923,"ノルウェー":1843,"デンマーク":1910,"スイス":1907,"オーストリア":1829,"トルコ":1830,"ウクライナ":1794,"セルビア":1863,"ロシア":1817,"スコットランド":1782,"ギリシャ":1801,"ポーランド":1835,"チェコ":1772,"ハンガリー":1735,"スウェーデン":1804,"ウェールズ":1700,"スロバキア":1747,"スロベニア":1773,"ルーマニア":1750,"ジョージア":1701,"アルバニア":1660,"アイルランド":1722,"ボスニア・ヘルツェゴビナ":1718,"イスラエル":1630,"アイスランド":1620,"コソボ":1620,"北アイルランド":1610,"北マケドニア":1656,"フィンランド":1658,"モンテネグロ":1634,"ブルガリア":1540,"ルクセンブルク":1500,"ベラルーシ":1500,"アルメニア":1480,"カザフスタン":1470,"キプロス":1420,"エストニア":1400,"フェロー諸島":1400,"アゼルバイジャン":1400,"ラトビア":1380,"リトアニア":1380,"モルドバ":1300,"マルタ":1250,"アンドラ":1150,"ジブラルタル":1100,"リヒテンシュタイン":1100,"サンマリノ":1000},"CONMEBOL":{"アルゼンチン":2051,"ブラジル":1953,"コロンビア":1845,"エクアドル":1834,"ウルグアイ":1845,"パラグアイ":1795,"ベネズエラ":1674,"ペルー":1720,"チリ":1710,"ボリビア":1600},"CONCACAF":{"メキシコ":1830,"アメリカ":1760,"カナダ":1688,"パナマ":1700,"コスタリカ":1650,"ジャマイカ":1630,"ホンジュラス":1590,"キュラソー":1570,"ハイチ":1560,"グアテマラ":1560,"エルサルバドル":1520,"スリナム":1520,"トリニダード・トバゴ":1500,"ニカラグア":1450,"ドミニカ共和国":1400,"その他CONCACAF":1300},"CAF":{"モロッコ":1900,"セネガル":1797,"アルジェリア":1760,"コートジボワール":1764,"ナイジェリア":1779,"エジプト":1720,"カメルーン":1764,"チュニジア":1690,"マリ":1648,"コンゴ民主共和国":1680,"南アフリカ":1660,"ブルキナファソ":1650,"カーボベルデ":1650,"ガーナ":1717,"ギニア":1600,"ガボン":1600,"ザンビア":1560,"ウガンダ":1560,"アンゴラ":1560,"ベナン":1550,"赤道ギニア":1540,"ケニア":1500,"その他CAF1":1450,"その他CAF2":1420,"その他CAF3":1400},"AFC":{"日本":1892,"イラン":1800,"韓国":1828,"オーストラリア":1768,"ウズベキスタン":1690,"サウジアラビア":1650,"イラク":1650,"ヨルダン":1650,"カタール":1640,"アラブ首長国連邦":1620,"オマーン":1580,"中国":1550,"パレスチナ":1550,"シリア":1540,"バーレーン":1530,"キルギス":1500,"タイ":1500,"ベトナム":1480,"北朝鮮":1480,"インドネシア":1470},"OFC":{"ニュージーランド":1600,"ニューカレドニア":1350,"ソロモン諸島":1350,"フィジー":1300,"タヒチ":1250}};
// [直接出場, 大陸間プレーオフ出場枠]（プレーオフは6チームで2枠）
const WC_SLOTS = {UEFA:[16,0], CONMEBOL:[6,1], CONCACAF:[6,2], CAF:[9,1], AFC:[8,1], OFC:[1,1]};
const CONF_LABEL = {UEFA:'欧州', CONMEBOL:'南米', CONCACAF:'北中米カリブ海', CAF:'アフリカ', AFC:'アジア', OFC:'オセアニア'};
const CONF_OF = {}; for(const c in WC_TEAMS) for(const t in WC_TEAMS[c]) CONF_OF[t] = c;
const WC_FIRST = 2026;
// 開催国：決まっている大会はそのまま。2038年以降は「直前2大会と同じ大陸は開催不可」の決まりで候補から選ぶ（全員の世界で共通）
const WC_KNOWN_HOSTS = {2026:['アメリカ','カナダ','メキシコ'], 2030:['スペイン','ポルトガル','モロッコ','アルゼンチン','ウルグアイ','パラグアイ'], 2034:['サウジアラビア']};
const WC_HOST_BIDS = [
  ['UEFA',['イングランド','スコットランド','ウェールズ','北アイルランド','アイルランド'],3], ['UEFA',['イタリア','トルコ'],1], ['UEFA',['ドイツ'],1], ['UEFA',['オランダ','ベルギー'],1],
  ['CONMEBOL',['ブラジル'],2], ['CONMEBOL',['コロンビア','エクアドル'],1], ['CONMEBOL',['チリ','ペルー'],1],
  ['CONCACAF',['アメリカ'],1], ['CONCACAF',['メキシコ','コスタリカ'],1],
  ['CAF',['エジプト'],1], ['CAF',['ナイジェリア','ガーナ'],1], ['CAF',['南アフリカ'],1], ['CAF',['セネガル','コートジボワール'],1],
  ['AFC',['日本','韓国'],2], ['AFC',['中国'],2], ['AFC',['オーストラリア','ニュージーランド'],2], ['AFC',['カタール','アラブ首長国連邦'],1],
];
const hostMemo = {};
function wcHosts(y){
  if(WC_KNOWN_HOSTS[y]) return WC_KNOWN_HOSTS[y];
  if(hostMemo[y]) return hostMemo[y];
  const banned = new Set([...wcHosts(y-4), ...wcHosts(y-8)].map(t=>CONF_OF[t]));
  return hostMemo[y] = withSeed(seedOf('wc-host-' + y), ()=>wpick(WC_HOST_BIDS.filter(b=>!banned.has(b[0])).map(b=>[b[1], b[2]])));
}
const wcYearOf = age => S.birthYear + age;
const isWcYear = y => y >= WC_FIRST && (y - WC_FIRST) % 4 === 0;
// 予選を1回シミュレーションして、母国が出場できたかを返す（bonus は本人の活躍による上乗せ）
function runQualifying(y, home, bonus){
  const hosts = wcHosts(y), q = new Set(hosts), po = [];
  const gauss = () => Math.sqrt(-2*Math.log(1-Math.random())) * Math.cos(2*Math.PI*Math.random());
  for(const c in WC_TEAMS){
    const [direct, nplay] = WC_SLOTS[c];
    const used = hosts.filter(h=>CONF_OF[h]===c).length;           // 開催国は自分の大陸の枠を使う
    const sc = Object.entries(WC_TEAMS[c]).filter(([t])=>!q.has(t))
      .map(([t,r])=>[r + (t===home ? bonus : 0) + gauss()*WC_SD, t]).sort((a,b)=>b[0]-a[0]);
    const take = Math.max(0, direct - used);
    sc.slice(0, take).forEach(([,t])=>q.add(t));
    sc.slice(take, take + nplay).forEach(([,t])=>po.push([WC_TEAMS[c][t] + gauss()*WC_SD, t]));
  }
  po.sort((a,b)=>b[0]-a[0]).slice(0, 2).forEach(([,t])=>q.add(t));  // 大陸間プレーオフ（6チームで2枠）
  return q.has(home);
}
function wcCycle(y){
  if(!S.wc[y]) S.wc[y] = {year:y, hosts:wcHosts(y), played:0, bonus:0};
  return S.wc[y];
}
// 代表戦の相手（同じ大陸で実力の近い国）
function wcRival(){
  const c = CONF_OF[S.country.n], me = WC_TEAMS[c][S.country.n];
  const near = Object.entries(WC_TEAMS[c]).filter(([t])=>t!==S.country.n).sort((a,b)=>Math.abs(a[1]-me)-Math.abs(b[1]-me)).slice(0,4);
  return pick(near)[0];
}
const WC_STAGES = ['グループリーグ敗退','ラウンド32で敗退','ベスト16','ベスト8','ベスト4','準優勝'];
// 毎年の終わりに呼ぶ：予選の出場、予選の結果とメンバー発表、本大会
function worldCupYear(){
  const a = S.age, y = wcYearOf(a);
  const next = [y, y+1, y+2].find(isWcYear);        // 予選期間なら、その先の大会
  const host = () => wcHosts(next).includes(S.country.n);
  const wc = N('worldcup'), me = S.country.n;
  const log = (text, big) => {
    S.log.push({age:a, kind:'hap', cat:'代表', text, fx:{}});
    if(big) S.history.push({age:a, label:`🌍 ${text.split('。')[0]}`, text, fx:{}, impact:big, success:null});
  };
  if(next && next>y && a>=18){                       // 予選期間（大会の2年前・1年前）
    const cyc = wcCycle(next);
    if(host()){
      if(next===y+1) log(`${me}は${wc}${next}の開催国。予選は免除され、自動で出場が決まっている。`);
    } else if(S.natNow){
      const n = 3 + Math.floor(Math.random()*4);
      cyc.played += n;
      S.caps += n;
      log(`${wc}${next}・${CONF_LABEL[CONF_OF[me]]}予選を${n}試合戦った。`);
    }
    if(next===y+1){                                  // 予選が終わる年：結果とメンバー発表
      cyc.qualified = host() || (S.daily ? withSeed(seedOf(S.daily + '#wcq' + next), ()=>runQualifying(next, me, cyc.bonus)) : runQualifying(next, me, cyc.bonus));
      if(!host()) log(cyc.qualified
        ? `${me}が${wc}${next}への出場を決めた！（${CONF_LABEL[CONF_OF[me]]}の出場枠は${WC_SLOTS[CONF_OF[me]][0]}${WC_SLOTS[CONF_OF[me]][1] ? `＋大陸間プレーオフ${WC_SLOTS[CONF_OF[me]][1]}` : ''}）`
        : `${me}は${wc}${next}の予選で敗退した。`, cyc.played && !cyc.qualified ? 8 : 0);
      if(cyc.qualified && a>=19 && next - S.birthYear <= END_AGE){ // 引退後の大会はメンバー発表なし
        // 本大会メンバー（26人）入り：代表の主力ならほぼ確実、そうでなければ少しだけ望みがある
        cyc.selected = S.natNow ? Math.random()<.85 : (S.flags.capped && S.stats.s>=70 && Math.random()<.15);
        if(cyc.selected) log(`${wc}${next}の本大会メンバー26人に選ばれた！`, 10);
        else if(S.flags.capped) log(`${wc}${next}のメンバー発表。そこに自分の名前はなかった。`, 6);
      }
    }
  }
  if(isWcYear(y) && a>=19){                          // 大会の年
    const cyc = wcCycle(y);
    if(cyc.qualified===undefined) cyc.qualified = host() || runQualifying(y, me, 0);
    const where = `（${cyc.hosts.join('・')}開催）`;
    if(cyc.qualified && cyc.selected){
      S.flags.wc = true; S.flags.capped = true;
      const pw = WC_POWER[me] || .005, r = WC_TEAMS[CONF_OF[me]][me];
      if(Math.random() < pw * S.stats.s/100){ cyc.stage = '優勝'; addTrophy('@wc', true); }
      else {
        const k = Math.max(0, Math.min(1, (r - 1650) / 450));             // 強い国ほど勝ち進みやすい
        cyc.stage = WC_STAGES[Math.min(5, Math.floor(Math.random() * (2 + 4*k)))];
      }
      const n = cyc.stage==='優勝' || cyc.stage==='準優勝' ? 8 : 3 + WC_STAGES.indexOf(cyc.stage);
      S.caps += n;
      log(`${wc}${y}${where}に出場。${n}試合に出て、${me}は${cyc.stage==='優勝' ? '優勝した！' : cyc.stage + '。'}`, cyc.stage==='優勝' ? 0 : 8);
    } else if(cyc.qualified){
      log(S.flags.capped ? `${wc}${y}${where}。${me}の試合を、スタンドではなく自宅のテレビで観た。` : `${wc}${y}${where}が開幕。${me}の試合を、国中と一緒にテレビの前で応援した。`);
    } else if(!cyc.played){
      log(`${me}は${wc}${y}の予選で敗退していた。${where.slice(1,-1)}で開かれた本大会の、他国の試合をテレビで観た。`);
    }
  }
}
// 予選と本大会のイベント（大会ごとに1回ずつ）
function wcEvent(){
  const a = S.age, y = wcYearOf(a), me = S.country.n, wc = N('worldcup');
  if(isWcYear(y + 1) && S.natNow && !wcHosts(y + 1).includes(me) && !S.used.has('wcq' + (y+1))){
    const opp = wcRival(), Y = y + 1;
    return {id:'wcq' + Y,
      text:`${wc}${Y}・${CONF_LABEL[CONF_OF[me]]}最終予選。${opp}とのアウェー戦は、勝てば本大会出場にぐっと近づく大一番だ。スタジアムは相手サポーターの指笛で埋め尽くされている。`,
      choices:[
        {label:'自分で決めにいく', chance:.5,
          win:{fx:{f:10,s:2}, wcq:90, text:`終了間際に決勝ゴール！ ${me}中が深夜に大騒ぎになった。`},
          lose:{fx:{x:5,f:2}, wcq:-40, text:'決定機を2本外した。試合後、ロッカールームで誰とも目を合わせられなかった。'}},
        {label:'チームのために走り切る', fx:{s:3,f:3}, wcq:35, text:'走行距離はチーム最多。泥臭く、大事な勝ち点をもぎ取った。'},
      ]};
  }
  const cyc = S.wc[y];
  if(isWcYear(y) && cyc && cyc.qualified===false && cyc.played && !S.used.has('wcfail' + y)){
    return {id:'wcfail' + y,
      text:`${me}は${wc}${y}の予選で敗退した。代表として予選を${cyc.played}試合戦ったのに、本大会のピッチには届かなかった。開幕戦の中継が、どのチャンネルでも流れている。`,
      choices:[
        {label:'次の4年に懸けると誓う', fx:{s:4}, text:'テレビを消して、ひとりでグラウンドへ向かった。'},
        {label:'あえて本大会を全試合観る', fx:{s:2,f:-2}, text:'悔しさで眠れなかった。でも、世界の基準が少しだけ分かった気がした。'},
      ]};
  }
  if(isWcYear(y) && cyc && cyc.selected && !S.used.has('wc' + y)){
    return {id:'wc' + y,
      text:`${wc}${y}本大会（${cyc.hosts.join('・')}開催）。グループリーグ突破には勝利が必要だ。キックオフ前、カメラが君を抜く。`,
      choices:[
        {label:'カメラに向かって決めポーズ', chance:.45,
          win:{fx:{f:18,s:3}, text:'その試合で2ゴール。決めポーズは国民的な流行語になった。'},
          lose:{fx:{x:15,f:8}, text:'開始3分で退場。決めポーズのスクショが「戦犯の顔」として教科書に載りそうになった。'}},
        {label:'静かに集中する', fx:{s:5,f:4}, text:'集中して90分を戦い抜いた。地味すぎて、中継では一度も名前を呼ばれなかった。'},
      ]};
  }
  return null;
}
// リザルト画面用：W杯の歩み
function wcSummary(){
  const cs = Object.values(S.wc || {}).filter(c=>c.qualified!==undefined && c.year - S.birthYear >= 19 && c.year - S.birthYear <= S.age).sort((a,b)=>a.year-b.year);
  const went = cs.filter(c=>c.selected && c.stage);
  return {
    cs, went,
    text: went.length ? `出場${went.length}回（${went.map(c=>`${c.year} ${c.stage}`).join('・')}）`
      : cs.some(c=>c.qualified) ? '母国は出場したが、本大会のピッチには立てなかった'
      : cs.length ? '母国は一度も出場できず' : '—',
    never: cs.length>0 && cs.every(c=>!c.qualified),
  };
}

function kitOf(name){ return TEAM_COLORS[name] || KIT_PALETTE[nameHash(name) % KIT_PALETTE.length]; }
function clubKit(key){
  if(key && key.startsWith('dyn:')) return kitOf(S.dyn[+key.slice(4)].name);
  if(key==='academy' && S.homeClub) return kitOf(S.homeClub.name);
  const named = {madrid:'レアル・マドリード', psg:'パリ・サンジェルマン', saudi:'アル・ナスル', mls:'インテル・マイアミ'}[key];
  return kitOf(named || N(key));
}

/* =========================================================
   ドット絵（32×32）：年代で5段階
   ① 乳幼児 0〜4歳 ② 少年期 5〜12歳 ③ 青年期 13〜21歳 ④ プロ全盛期 22〜31歳 ⑤ ベテラン期 32歳〜
   ========================================================= */
const avatarStage = a => a<=4 ? 'baby' : a<=12 ? 'kid' : a<=21 ? 'youth' : a<=31 ? 'prime' : 'vet';
const isLight = hex => { const n = parseInt(hex.slice(1), 16); return ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114) / 1000 > 170; };
// 代表として戦っている場面か
function inNationalKit(){
  if(S.screen==='event' && S.current && /^wc/.test(S.current.id)) return true;
  const y = wcYearOf(S.age), cyc = S.wc && S.wc[y];
  return !!(isWcYear(y) && cyc && cyc.selected);
}
function avatarState(final){
  const a = S.age, L = S.look;
  const st = {stage:avatarStage(a), skin:SKIN_TONES[L.skin]};
  const hairIdx = a < L.darkenAge ? L.childHair : L.hair;
  st.gray = st.stage==='vet' && L.grayAge!=null && a>=L.grayAge;
  st.bald = st.stage==='vet' && L.baldAge!=null && a>=L.baldAge;
  st.hair = st.gray ? '#c9c9cc' : HAIR_COLORS[hairIdx];
  st.gk = S.pos==='GK' && st.stage!=='baby';
  if(st.stage==='baby' || S.club==='home') st.kit = [L.casual, '#ffffff'];
  else if(!final && inNationalKit()) st.kit = NAT_COLORS[S.country.n] || ['#ffffff','#111111'];
  else st.kit = clubKit(S.club);
  if(st.gk){                                                  // GKはフィールドの選手と違う色
    const gkc = ['#2ecc71','#f1c40f','#1f1f1f','#e67e22','#9b59b6'].find(c=>c!==st.kit[0]);
    st.kit = [gkc, '#111111'];
  }
  st.captain = !final && !!S.captain && S.captain===S.club;
  st.bandage = !final && S.hurtAge===a;
  st.trophy = final ? S.trophies.length>0 : S.trophies.some(t=>t.age===a || t.age===a-1);
  return st;
}
function drawAvatar(x, st){
  const P = (px, py, w, h, c) => { x.fillStyle = c; x.fillRect(px, py, w, h); };
  x.clearRect(0, 0, 32, 32);
  const [k1, k2, pat] = st.kit, eye = '#1d1d22', shade = 'rgba(0,0,0,.18)';
  P(8, 30, 16, 1, 'rgba(0,0,0,.28)');                        // 足元の影
  const head = (hx, hy, w, h) => {
    P(hx, hy, w, h, st.skin);
    P(hx-1, hy+3, 1, 2, st.skin); P(hx+w, hy+3, 1, 2, st.skin);  // 耳
    P(hx+2, hy+4, 1, 1, eye); P(hx+w-3, hy+4, 1, 1, eye);       // 目
    P(hx+3, hy+6, w-6, 1, shade);                               // 口
    if(!st.bald){ P(hx, hy-1, w, 2, st.hair); P(hx-1, hy, 1, 3, st.hair); P(hx+w, hy, 1, 3, st.hair); }
    else { P(hx-1, hy+1, 1, 3, st.hair); P(hx+w, hy+1, 1, 3, st.hair); }  // 薄毛：横だけ残る
    if(st.bandage){ P(hx, hy+2, w, 1, '#f4f4f4'); P(hx+1, hy+2, 1, 1, '#e0445a'); }
  };
  if(st.stage==='baby'){
    head(11, 11, 10, 9);
    P(12, 21, 8, 6, k1); P(14, 21, 4, 1, k2);                   // ロンパース
    P(10, 22, 2, 3, st.skin); P(20, 22, 2, 3, st.skin);
    P(12, 27, 3, 2, st.skin); P(17, 27, 3, 2, st.skin);
    P(23, 26, 3, 3, '#ffffff'); P(24, 27, 1, 1, '#333');        // 小さなボール
    return;
  }
  const L = {kid:{hy:9, ty:17, th:5, sh:2, lh:2, tx:11, tw:10}, youth:{hy:5, ty:14, th:6, sh:3, lh:2, tx:10, tw:12},
             prime:{hy:3, ty:12, th:7, sh:3, lh:3, tx:10, tw:12}, vet:{hy:3, ty:12, th:7, sh:3, lh:3, tx:10, tw:12}}[st.stage];
  const {hy, ty, th, sh, lh, tx, tw} = L, hx = tx + (tw - 8)/2;
  head(hx, hy, 8, 8);
  P(hx+3, hy+8, 2, ty-hy-8, st.skin);                         // 首
  // シャツ（柄）
  for(let yy=ty; yy<ty+th; yy++) for(let xx=tx; xx<tx+tw; xx++){
    const i = xx - tx, j = yy - ty;
    const alt = pat==='stripes' ? (i>>1)%2===1 : pat==='hoops' ? (j>>1)%2===1 : pat==='halves' ? i>=tw/2
      : pat==='sash' ? Math.abs((tw-1-i) - j*tw/th) < 1.6 : pat==='band' ? Math.abs(i - (tw-1)/2) < 1.6 : pat==='checks' ? ((i>>1)+(j>>1))%2===1 : false;
    P(xx, yy, 1, 1, alt ? k2 : k1);
  }
  if(!pat || pat==='sleeves') P(tx + tw/2 - 1, ty, 2, 1, k2);  // 襟
  const sleeve = pat==='sleeves' ? k2 : k1;
  for(const ax of [tx-2, tx+tw]){
    P(ax, ty, 2, 3, sleeve);
    P(ax, ty+3, 2, th-3, st.skin);
    if(st.gk) P(ax-(ax<tx ? 1 : 0), ty+th-1, 3, 3, '#f4f7b0'); // GKグローブ
    else P(ax, ty+th, 2, 1, st.skin);
  }
  if(st.captain) P(tx+tw, ty+2, 2, 1, isLight(sleeve) ? '#d7263d' : '#ffd34d'); // キャプテンマーク
  const shorts = isLight(k1) && isLight(k2) ? '#1b1b1f' : k2;
  P(tx+1, ty+th, tw-2, sh, shorts);
  const legY = ty + th + sh, lx1 = tx + 2, lx2 = tx + tw - 5;
  for(const lx of [lx1, lx2]){
    P(lx, legY, 3, lh, st.skin);
    P(lx, legY+lh, 3, 28-legY-lh, st.gk ? '#1b1b1f' : k1);    // ソックス
    P(lx-(lx===lx1 ? 1 : 0), 28, 4, 2, '#151515');             // スパイク
  }
  if(st.trophy){                                              // 優勝トロフィー
    const g = '#f2c94c', gy = ty - 1;
    P(24, gy, 5, 1, g); P(24, gy+1, 5, 2, g); P(23, gy+1, 1, 1, g); P(29, gy+1, 1, 1, g);
    P(25, gy+3, 3, 1, g); P(26, gy+4, 1, 2, g); P(25, gy+6, 3, 1, '#c79a2b');
  } else if(!st.gk){
    P(24, 27, 3, 3, '#ffffff'); P(25, 28, 1, 1, '#333');       // ボール
  }
}
function renderAvatar(){
  const cv = document.getElementById('avatar');
  if(!cv) return;
  const show = !!S.look && !['title','dex'].includes(S.screen);
  cv.hidden = !show;
  if(!show || !cv.getContext) return;
  const st = avatarState(false);
  drawAvatar(cv.getContext('2d'), st);
  cv.setAttribute('aria-label', `選手のドット絵（${S.age}歳）`);
}

  ).join('');

function renderToggle(){
  document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('on', b.dataset.nm===S.nameMode));
}
const $clock = document.getElementById('clock');
let clockKey = '';
function updateClock(){
  const show = S.screen==='life' || S.screen==='event' || S.screen==='position';
  $clock.hidden = !show;
  if(!show) return;
  const paused = S.screen==='event' || S.screen==='position', stopped = !!S.pendingEnd, held = S.userPaused && !paused && !stopped;
  $clock.classList.toggle('paused', paused);
  $clock.classList.toggle('stopped', stopped);
  $clock.classList.toggle('held', held);
  document.getElementById('ybar').style.width = (S.progress*100)+'%';
  // 以下は毎フレーム書き換えるとボタンのタップが取りこぼされるので、変化したときだけ更新
  const key = [S.userPaused, stopped, S.age, S.screen, held, S.speed, S.evAge, S.firedAge].join('|');
  if(key===clockKey) return;
  clockKey = key;
  const pb = document.getElementById('pauseBtn');
  pb.textContent = S.userPaused ? '▶ 再生' : '⏸ 一時停止';
  pb.classList.toggle('resume', S.userPaused);
  pb.disabled = stopped;
  document.getElementById('clockAge').innerHTML = `${S.age}<small>歳</small>`;
  document.getElementById('clockState').textContent =
    stopped ? '⏹ キャリア終了' : S.screen==='position' ? '⏸ ポジション選択' : paused ? '⏸ 選択待ち' : held ? '⏸ 一時停止中' : `▶ ${S.age+1}歳まで経過中`;
  document.getElementById('evMark').hidden = !(S.age===S.evAge && S.firedAge!==S.age);
  document.querySelectorAll('.speed button').forEach(b=>b.classList.toggle('on', +b.dataset.sp===S.speed));
}
function fxKeys(fx, dm){
  return Object.keys(fx||{}).filter(k=>fx[k] && !(k==='m' && dm===0));
}
function fxText(k, v, dm){
  if(k==='m') return dm!==undefined ? fmtYen(dm, true) : `${v>0?'+':''}${v}`;
  return `${v>0?'+':''}${v}`;
}
function miniFx(fx, dm){
  const lbl = {s:'スキル',f:'知名度',m:'資産',x:'スキャンダル'};
  const ks = fxKeys(fx, dm);
  return ks.length ? `<div class="mini">${ks.map(k=>`<span class="${k}">${lbl[k]}${fxText(k,fx[k],dm)}</span>`).join('')}</div>` : '';
}
function logItem(e, i){ return logItemBase(e, i).replace(/<\/div><\/div>\s*$/, seasonHTML(e) + '</div></div>'); }
function logItemBase(e, i){
  if(e.kind==='story'){
    return `<div class="log-item story ${i===0?'new':''}"><div class="la">${e.age}歳</div><div><div class="story-tag">${S.origin.icon} きっかけ ・ ${esc(S.origin.label)}</div><div class="lt">${esc(T(e.text))}</div>${miniFx(e.fx, e.dm)}</div></div>`;
  }
  if(e.kind==='event'){
    const tag = e.success===true ? '<span class="tag ok">成功</span>' : e.success===false ? '<span class="tag ng">失敗</span>' : '';
    return `<div class="log-item ev ${i===0?'new':''}"><div class="la">${e.age}歳</div><div>
      <div class="ll">▶ ${esc(T(e.label))}${tag}</div>
      <div class="lt">${esc(T(e.text))}</div>
      <div class="chips">${chipsHTML(e.fx, e.dm)}</div>
      ${e.newClub?`<div class="newclub">➜ ${esc(N(e.newClub))} に移籍</div>`:''}
    </div></div>`;
  }
  if(e.kind==='hap'){
    return `<div class="log-item hap ${i===0?'new':''}"><div class="la">${e.age}歳</div><div><div class="hap-tag">⚡ ${esc(e.cat)}</div><div class="lt">${esc(T(e.text))}</div>${miniFx(e.fx, e.dm)}</div></div>`;

let G = null;

function weightedCountry(){
  const sum = COUNTRIES.reduce((a,c)=>a+c.w,0);
  let r = Math.random()*sum;
  for(const c of COUNTRIES){ if((r-=c.w)<0) return c; }
  return COUNTRIES[0];
}
function pickBirth(){
  const c = weightedCountry(), place = pick(c.c), sp = place.split(' ');
  return {c, place, pref: sp.length>1 ? sp[0] : null, city: sp[sp.length-1], name: genName(c.pool || c.n), ...rollTraits(c)};
}

function gachaAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  const ctx = new AC();
  const out = ctx.createGain(); out.gain.value = .7; out.connect(ctx.destination);
  const buf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise = (dest,t,len,type,freq,vol)=>{
    const src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=buf; f.type=type; f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t+len+.05);
  };
  const tone = (dest,freq,t,len,type,vol)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+len);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+len+.05);
  };
  const roll = ctx.createGain(); roll.connect(out);
  return {
    ctx,
    // スネアのドラムロール（だんだん大きく）
    drumroll(dur){
      const t0 = ctx.currentTime;
      for(let t=0; t<dur; t+=.045) noise(roll, t0+t, .06, 'bandpass', 1900, .05 + .22*(t/dur));
    },
    stopRoll(){ roll.gain.setTargetAtTime(0, ctx.currentTime, .02); },
    // 心音 → やわらかいチャイム（誕生シーン）
    heartbeat(){
      const t0 = ctx.currentTime + .05;
      [0,.28,1.1,1.38,2.2,2.48,3.3,3.58].forEach((dt,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain(), t=t0+dt;
        o.frequency.setValueAtTime(75,t); o.frequency.exponentialRampToValueAtTime(40,t+.15);
        g.gain.setValueAtTime(i%2 ? .45 : .8, t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
        o.connect(g); g.connect(out); o.start(t); o.stop(t+.25);
      });
      [72,76,79,84].forEach((m,i)=>tone(out, 440*Math.pow(2,(m-69)/12), t0+4.5+i*.16, 1.8, 'sine', .07));
    },
    tick(p){ tone(out, 700 + p*700, ctx.currentTime, .035, 'square', .05); },
    // 確定音：キック＋クラッシュ＋ファンファーレ
    land(){
      const t = ctx.currentTime + .02;
      const k=ctx.createOscillator(), kg=ctx.createGain();
      k.frequency.setValueAtTime(150,t); k.frequency.exponentialRampToValueAtTime(40,t+.2);
      kg.gain.setValueAtTime(1,t); kg.gain.exponentialRampToValueAtTime(.001,t+.35);
      k.connect(kg); kg.connect(out); k.start(t); k.stop(t+.4);
      noise(out, t, 1.8, 'highpass', 5000, .45);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.connect(out);
      [60,64,67,72].forEach((m,i)=>tone(lp, 440*Math.pow(2,(m-69)/12), t+i*.07, 1.6, 'sawtooth', .07));
      tone(out, 440*Math.pow(2,(84-69)/12), t+.3, 1.2, 'triangle', .06);
    },
  };
}

function startGacha(){
  if(G) return;
  BGM.duck(true); // 効果音を聞かせるため、ガチャ中はBGMを小さく
  const birth = S.daily ? withSeed(seedOf(S.daily), pickBirth) : pickBirth();
  const STEPS = 28;
  const delays = Array.from({length:STEPS}, (_,i)=> 45 + Math.pow(i/STEPS, 3)*480);
  const spinDur = delays.reduce((a,b)=>a+b,0)/1000;

  const el = document.createElement('div');
  el.className = 'gacha';
  el.innerHTML = `
    <div class="g-main">
      <div class="g-head"><div class="lbl">${S.daily ? `TODAY'S LIFE ・ ${S.daily}` : 'BIRTHPLACE GACHA'}</div><div class="ttl">${S.daily ? '今日の生まれを読み込んでいます…' : '生まれる場所を決めています…'}</div></div>
      <div class="g-stage">
        <div class="g-rays"></div>
        <div class="g-ring"></div>
        <div class="g-reel"><span class="g-mk l">▶</span><div class="g-item"><span class="flag"></span><span class="cn"></span><span class="ct"></span></div><span class="g-mk r">◀</span></div>
      </div>
      <div class="g-result">
        <div class="k">あなたの生誕地</div>
        <div class="v">${birth.c.f} ${birth.c.n}<span class="vp">（${birth.place}）</span></div>
        <div class="nm">${esc(birth.name.main)}</div>
        <div class="ns">${esc(birth.name.sub)}</div>
        <div class="d">${birth.c.d}</div>
        <div class="tr">${traitsHTML(birth)}</div>
        ${S.daily ? '<div class="dl-note">📅 今日この日に遊ぶ全員が、この生まれからスタートします</div>' : ''}
      </div>
      <div class="g-foot"><div class="g-bar"><i></i></div><div class="g-hint">タップでスキップ</div></div>
    </div>
    <div class="g-birth">
      <div class="b-line b1">${birth.c.f} ${birth.c.n} ・ ${birth.place}</div>
      <div class="b-line b2">${birth.c.n}の${birth.city}で、<br>新たな人生が始まった…</div>
      <div class="b-line b-name"><small>その名は——</small>${esc(birth.name.main)}</div>
      <div class="b-age">0<small>歳</small></div>
    </div>
    <div class="g-flash"></div>`;
  document.body.appendChild(el);

  const snd = gachaAudio();
  if(snd) snd.drumroll(spinDur);
  G = {el, birth, snd, timer:null, landed:false, phase:'spin', done:false};

  const item = el.querySelector('.g-item');
  const show = (c, d)=>{
    item.querySelector('.flag').textContent = c.f;
    item.querySelector('.cn').textContent = c.n;
    item.classList.remove('roll'); void item.offsetWidth;
    item.style.setProperty('--d', Math.min(d, 260)+'ms');
    item.classList.add('roll');
  };

  let i = 0, idx = Math.floor(Math.random()*COUNTRIES.length);
  const step = ()=>{
    if(!G || G.landed) return;
    idx = (idx + 1 + Math.floor(Math.random()*3)) % COUNTRIES.length;
    if(i===STEPS-1 && COUNTRIES[idx]===birth.c) idx = (idx+1) % COUNTRIES.length; // 直前に同じ国を出さない
    show(COUNTRIES[idx], delays[i]);
    if(snd) snd.tick(i/STEPS);
    G.timer = setTimeout(++i<STEPS ? step : landGacha, delays[i-1]);
  };
  step();

  el.addEventListener('click', ()=>{
    if(!G) return;
    if(!G.landed) landGacha();
    else if(G.phase!=='birth') birthScene();
    else finishGacha();
  });
}

function landGacha(){
  if(!G || G.landed) return;
  clearTimeout(G.timer);
  G.landed = true;
  const {el, birth, snd} = G;
  const item = el.querySelector('.g-item');
  item.classList.remove('roll');
  item.querySelector('.flag').textContent = birth.c.f;
  item.querySelector('.cn').textContent = birth.c.n;
  item.querySelector('.ct').textContent = `（${birth.place}）`;
  el.querySelector('.ttl').textContent = '生誕地と名前が決定！';
  el.querySelector('.g-hint').textContent = 'タップで次へ';
  el.classList.add('landed');
  if(snd){ snd.stopRoll(); snd.land(); }
  if(navigator.vibrate) navigator.vibrate([30,40,80]);
  // 紙吹雪
  const stage = el.querySelector('.g-stage');
  const colors = ['#c6ff3d','#3dd6ff','#ffd34d','#ff3d6e','#ffffff'];
  for(let k=0;k<36;k++){
    const p = document.createElement('i'); p.className='g-p';
    const a = Math.random()*Math.PI*2, r = 120 + Math.random()*200;
    p.style.cssText = `--tx:${Math.cos(a)*r}px;--ty:${Math.sin(a)*r}px;--r:${Math.random()*720-360}deg;background:${colors[k%colors.length]};animation-delay:${Math.random()*.08}s`;
    stage.appendChild(p);
  }
  S.country = birth.c;
  S.place = birth.place;
  S.city = birth.city;
  S.pref = birth.pref;
  S.mode = birth.c.n==='日本' ? 'japan' : 'world';
  S.player = birth.name.main;
  S.playerSub = birth.name.sub;
  S.body = birth.body; S.talent = birth.talent; S.family = birth.family; S.look = birth.look;
  G.timer = setTimeout(birthScene, 5000);
}

// 「〇〇で生まれ落ちた…」の誕生シーン
function birthScene(){
  if(!G || G.phase==='birth') return;
  clearTimeout(G.timer);
  G.phase = 'birth';
  G.el.classList.add('birth');
  if(G.snd) G.snd.heartbeat();
  G.timer = setTimeout(finishGacha, 7200);
}

function finishGacha(){
  if(!G || G.done) return;
  G.done = true;
  BGM.duck(false);
  clearTimeout(G.timer);
  const {el, snd} = G;
  G = null;
  startCareer();
  el.classList.add('out');
  setTimeout(()=>el.remove(), 420);
  if(snd) setTimeout(()=>{ try{ snd.ctx.close(); }catch(e){} }, 1800);
}

/* =========================================================
   トースト
   ========================================================= */
let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), 2400);
}

/* =========================================================
   BGM：Web Audio で鳴らす明るいループ曲（音声ファイル不要）
   ブラウザは最初のタップまで音を出せないので、最初の操作で再生を始める
   ========================================================= */
const BGM = (()=>{
  const BPM = 124, STEP = 60/BPM/2;                 // 1ステップ = 8分音符
  // 8小節のコード進行（C G Am F C G F G）：[ベースの音, コードの音]
  const CHORDS = [[48,[60,64,67]],[43,[59,62,67]],[45,[57,60,64]],[41,[57,60,65]],
                  [48,[60,64,67]],[43,[59,62,67]],[41,[57,60,65]],[43,[59,62,67]]];
  // メロディ（MIDIノート番号、0は休符）
  const MEL = [
    76,0,79,0,81,79,76,0,   74,0,79,0,74,72,74,0,
    72,0,76,0,79,0,81,79,   77,0,76,0,74,0,0,0,
    76,79,84,0,81,79,76,0,  74,0,79,0,83,0,81,79,
    81,0,77,0,76,0,74,0,    74,76,79,0,0,0,0,0,
  ];
  const VOL = .2;
  let ctx = null, master = null, noise = null, timer = null, step = 0, next = 0, on = true, ducked = false;
  try{ on = localStorage.getItem('fls_bgm') !== 'off'; }catch(e){}
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);

  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = ducked ? VOL*.25 : VOL;
    master.connect(comp); comp.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
  }
  function tone(freq, t, len, type, vol, cut){
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = cut;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + len + .05);
  }
  function hiss(t, len, type, freq, vol){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + len + .05);
  }
  function kick(t){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }
  function snare(t){ hiss(t, .16, 'bandpass', 1800, .35); tone(190, t, .1, 'triangle', .25, 2000); }

  // 64ステップ（8小節）ごとに、メロディの回と和音を刻む回を交互に
  function play(i, t){
    const bar = Math.floor(i/8) % 8, s = i % 8, verse = Math.floor(i/64) % 2;
    const [root, chord] = CHORDS[bar];
    if(s%4===0) kick(t);
    if(s===2 || s===6) snare(t);
    if(bar===7 && s===7) snare(t + STEP/2);                     // ループ前のフィル
    hiss(t, .04, 'highpass', 7000, s%2 ? .05 : .09);
    tone(hz(root + (s%4===2 ? 12 : 0)), t, STEP*.85, 'triangle', .35, 900);
    if(s%2===1) chord.forEach(n=>tone(hz(n), t, STEP*.6, 'sawtooth', .045, 2200));
    if(verse===0){
      const m = MEL[bar*8 + s];
      if(m){ let k = 1; while(k<3 && !MEL[(bar*8 + s + k) % 64]) k++; tone(hz(m), t, STEP*k*.9, 'square', .07, 3000); }
    } else {
      tone(hz(chord[s%3] + 12 + (s>=6 ? 12 : 0)), t, STEP*.5, 'square', .045, 2600);
    }
  }
  function tick(){
    while(next < ctx.currentTime + .15){ play(step, next); next += STEP; step++; }
  }
  function start(){
    if(!on) return;
    if(!ctx) init();
    if(!ctx) return;
    if(ctx.state !== 'running') ctx.resume();
    if(!timer){ next = ctx.currentTime + .08; timer = setInterval(tick, 25); }
  }
  function stop(){
    clearInterval(timer); timer = null;
    if(ctx) ctx.suspend();
  }
  function toggle(){
    on = !on;
    try{ localStorage.setItem('fls_bgm', on ? 'on' : 'off'); }catch(e){}
    on ? start() : stop();
    paint();
  }
  // ガチャなど効果音が主役の場面では音量を下げる
  function duck(v){
    ducked = v;
    if(master) master.gain.setTargetAtTime(v ? VOL*.25 : VOL, ctx.currentTime, .3);
  }
  function paint(){
    const b = document.getElementById('bgmBtn');
    if(!b) return;
    b.textContent = on ? '🎵' : '🔇';
    b.classList.toggle('on', on);
    b.setAttribute('aria-label', on ? 'BGMをオフにする' : 'BGMをオンにする');
  }
  // 別のタブに移ったら止め、戻ったら再開
  document.addEventListener('visibilitychange', ()=>{
    if(!ctx || !timer) return;
    document.hidden ? ctx.suspend() : ctx.resume();
  });
  // 最初の操作で再生開始（BGMボタン自体を押したときは toggle に任せる）
  const kickoff = e => { if(!(e.target && e.target.closest && e.target.closest('#bgmBtn'))) start(); };
  document.addEventListener('pointerdown', kickoff);
  document.addEventListener('keydown', kickoff);
  return {start, toggle, duck, paint};
})();

/* =========================================================
   イベント委譲
   ========================================================= */
document.addEventListener('click', e=>{
  if(e.target.closest('#bgmBtn')){ BGM.toggle(); return; }
  const nm = e.target.closest('.toggle button');
  if(nm){
    S.nameMode = nm.dataset.nm;
    try{ localStorage.setItem('fls_nameMode', S.nameMode); }catch(err){}
    render();
    return;
  }
  if(e.target.closest('[data-pause]')){ togglePause(); return; }
  const sp = e.target.closest('.speed button');
  if(sp){
    S.speed = +sp.dataset.sp;
    try{ localStorage.setItem('fls_speed', S.speed); }catch(err){}
    updateClock();
    return;
  }
  const hero = e.target.closest('.hero');
  if(hero && !hero.classList.contains('done')){ hero.classList.add('done'); return; } // 演出スキップ
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const v = el.dataset.v;
  switch(el.dataset.act){
    case 'toTitle': S.screen='title'; render(); break;
    case 'start': S.daily = null; startGacha(); break;
    case 'daily': S.daily = todayKey(); startGacha(); break;
    case 'dex': if(S.screen!=='dex') S.dexFrom = S.screen; S.screen = 'dex'; render(); break;
    case 'dexBack': S.screen = S.dexFrom || 'title'; render(); break;
    case 'shareImg': shareCardImage(); break;
    case 'choose': choose(+v); break;
    case 'pos': choosePos(v); break;
    case 'toEnding': endCareer(S.pendingEnd); break;
    case 'share': shareToX(); break;
    case 'restart': startCareer(); break;
  }
});

/* =========================================================
   PWA: マニフェストを動的に生成
   （Service Worker は別ファイル sw.js が必要なため、置いた場合のみ登録）
   ========================================================= */
(function(){
  const icon = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#07080a"/><circle cx="256" cy="256" r="150" fill="#c6ff3d"/><text x="256" y="300" font-size="150" text-anchor="middle" font-family="sans-serif" font-weight="900" fill="#07080a">FL</text></svg>`);
  const manifest = {
    name:'サッカー人生シミュレーター', short_name:'サッカー人生',
    start_url:location.href.split('#')[0], display:'standalone',
    background_color:'#07080a', theme_color:'#07080a', orientation:'portrait',
    icons:[{src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any'}],
  };
  const link = document.createElement('link');
  link.rel='manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  document.head.appendChild(link);
  const apple = document.createElement('link'); apple.rel='apple-touch-icon'; apple.href=icon; document.head.appendChild(apple);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    fetch('sw.js',{method:'HEAD'}).then(r=>{ if(r.ok) navigator.serviceWorker.register('sw.js'); }).catch(()=>{});
  }
})();

BGM.paint();
render();
</script>
